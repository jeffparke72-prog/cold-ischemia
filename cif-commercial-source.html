<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>CIF film source (rendered to cif-commercial.mp4)</title>
<style>
@font-face{font-family:'Anton';font-weight:400;font-display:block;src:url(fonts/anton-400-normal.woff2) format('woff2')}
@font-face{font-family:'Bebas Neue';font-weight:400;font-display:block;src:url(fonts/bebasneue-400-normal.woff2) format('woff2')}
@font-face{font-family:'IBM Plex Mono';font-weight:400 500;font-display:block;src:url(fonts/ibmplexmono-500-normal.woff2) format('woff2')}
@font-face{font-family:'Playfair Display';font-style:italic;font-weight:400;font-display:block;src:url(fonts/playfairdisplay-400-italic.woff2) format('woff2')}
@font-face{font-family:'Playfair Display';font-style:normal;font-weight:900;font-display:block;src:url(fonts/playfairdisplay-900-normal.woff2) format('woff2')}
:root{--gold:#f2b84b;--red:#ff4d5e;--ice:#8fd8ff}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#000;overflow:hidden}
#stage{position:absolute;left:0;top:0;width:1920px;height:1080px;overflow:hidden;background:#02040a;transform-origin:0 0}
.L{position:absolute;inset:0}
canvas.L{width:1920px;height:1080px}
.shot{position:absolute;inset:-4%;opacity:0;will-change:transform,opacity}
.shot img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.shot .fill{filter:blur(40px) brightness(.45) saturate(.8);transform:scale(1.15)}
.shot .fg{object-fit:contain;-webkit-mask-image:linear-gradient(90deg,transparent,#000 9%,#000 91%,transparent);mask-image:linear-gradient(90deg,transparent,#000 9%,#000 91%,transparent)}
#shadeL{background:linear-gradient(90deg,rgba(2,4,10,.88) 0%,rgba(2,4,10,.55) 42%,rgba(2,4,10,.1) 75%,rgba(2,4,10,.45) 100%),linear-gradient(0deg,rgba(2,4,10,.92) 0%,rgba(2,4,10,0) 36%)}
#tint{mix-blend-mode:soft-light}
/* dialogue figures */
#sil{position:absolute;width:820px;height:1040px;opacity:0;transform-origin:50% 100%;will-change:transform,opacity,filter}
#sil svg{width:100%;height:100%;display:block}
#fnd{position:absolute;bottom:0;right:40px;width:900px;height:1080px;opacity:0;transform-origin:50% 80%;will-change:transform,opacity,filter}
#fnd img{position:absolute;left:50%;bottom:0;height:1090px;transform:translateX(-50%);-webkit-mask-image:radial-gradient(ellipse 46% 64% at 50% 44%,#000 56%,transparent 100%);mask-image:radial-gradient(ellipse 46% 64% at 50% 44%,#000 56%,transparent 100%)}
#phone{position:absolute;opacity:0;width:900px;height:900px;background:radial-gradient(circle at 50% 50%,rgba(150,215,255,.55),rgba(60,140,220,.18) 28%,transparent 62%);mix-blend-mode:screen}
#lamp{position:absolute;inset:0;opacity:0;background:radial-gradient(ellipse 760px 620px at 1480px 380px,rgba(255,170,70,.34),transparent 70%);mix-blend-mode:screen}
/* type */
.t{position:absolute;opacity:0;will-change:transform,opacity,filter;text-shadow:0 4px 34px rgba(0,0,0,.8);line-height:.95}
.t.c{left:80px;right:80px;text-align:center;top:50%}
.t.l{left:140px;max-width:1280px;top:50%}
.t.r{right:140px;max-width:1280px;text-align:right;top:50%}
.a{font-family:'Anton','Bebas Neue',Impact,sans-serif;color:#fff;text-transform:uppercase}
.x{font-family:'Anton',Impact,sans-serif;color:#fff;font-size:520px;line-height:.85}
.i{font-family:'Playfair Display',Georgia,serif;font-style:italic;font-weight:400;color:#f3ece0;line-height:1.1}
.m{font-family:'IBM Plex Mono',monospace;font-weight:500;color:#aab6c4;letter-spacing:9px;text-transform:uppercase;font-size:30px}
.g{color:var(--gold)!important}
.r{color:var(--red)!important;text-shadow:0 0 50px rgba(255,60,80,.45),0 4px 30px rgba(0,0,0,.8)}
#cap{position:absolute;left:260px;right:260px;bottom:128px;text-align:center;font:italic 400 40px/1.3 'Playfair Display',Georgia,serif;color:#fff;text-shadow:0 2px 6px #000,0 0 28px rgba(0,0,0,.95);opacity:0}
#spk{position:absolute;left:0;right:0;bottom:240px;text-align:center;font:500 20px 'IBM Plex Mono',monospace;letter-spacing:8px;text-transform:uppercase;opacity:0}
#bars i{position:absolute;left:0;right:0;height:80px;background:#000}
#bars i:first-child{top:0}#bars i:last-child{bottom:0}
#flash{background:#fff;opacity:0;mix-blend-mode:screen}
#dots{position:absolute;left:140px;top:760px;display:flex;gap:18px;opacity:0}
#dots b{width:44px;height:44px;border-radius:50%;background:var(--red);box-shadow:0 0 22px rgba(255,60,80,.7);display:block}
#end{position:absolute;inset:0;opacity:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:26px;text-align:center}
#end img{height:300px}
#end .nm{font:400 118px/1 'Anton',sans-serif;letter-spacing:.08em;color:#fff;text-transform:uppercase}
#end .tg{font:500 26px 'IBM Plex Mono',monospace;letter-spacing:10px;color:#aab6c4;text-transform:uppercase}
#end .cta{font:500 30px 'IBM Plex Mono',monospace;letter-spacing:7px;color:#02040a;background:var(--gold);padding:20px 40px;margin-top:20px;text-transform:uppercase}
</style>
</head>
<body>
<div id="stage">
  <canvas class="L" id="bg" width="1920" height="1080"></canvas>
  <div class="L" id="shots"></div>
  <div class="L" id="shadeL"></div>
  <div class="L" id="tint"></div>
  <div id="phone"></div>
  <div id="sil"><svg viewBox="0 0 700 900" aria-hidden="true"><defs><linearGradient id="rim" x1="1" y1="0" x2="0" y2="0"><stop offset="0" stop-color="#8fd8ff" stop-opacity=".95"/><stop offset=".14" stop-color="#8fd8ff" stop-opacity="0"/></linearGradient></defs>
    <g fill="#04060b"><ellipse cx="350" cy="250" rx="128" ry="160"/><ellipse cx="228" cy="278" rx="19" ry="32"/><ellipse cx="472" cy="278" rx="19" ry="32"/>
    <path d="M0 900V770C24 650 140 580 262 548C292 520 300 470 296 400L404 400C400 470 408 520 438 548C560 580 676 650 700 770V900Z"/>
    <path d="M228 196C246 112 296 90 350 90C408 90 454 122 472 196C430 164 270 164 228 196Z"/></g>
    <path fill="none" stroke="url(#rim)" stroke-width="6" d="M478 214C474 150 430 98 350 94"/>
    <path fill="none" stroke="url(#rim)" stroke-width="5" d="M438 548C560 580 676 650 700 770"/></svg></div>
  <div id="fnd"><img src="jeff-headshot.png" alt=""></div>
  <div id="lamp"></div>
  <div class="L" id="titles"></div>
  <div id="dots"></div>
  <canvas class="L" id="fx" width="1920" height="1080" style="pointer-events:none"></canvas>
  <div class="L" id="flash"></div>
  <div id="end"><img src="cold-ischemia-logo-clear.png" alt=""><div class="nm">Cold Ischemia Foundation</div><div class="tg">Independent &middot; Unbought &middot; Unafraid</div><div class="cta">Volunteer &nbsp;&middot;&nbsp; coldischemia.foundation</div></div>
  <div id="spk"></div>
  <div id="cap"></div>
  <div id="bars"><i></i><i></i></div>
</div>
<script>
(function(){
'use strict';
function cl(x,a,b){return x<a?a:x>b?b:x}
function ss(a,b,x){x=cl((x-a)/(b-a),0,1);return x*x*(3-2*x)}
function eo(x){return 1-Math.pow(1-cl(x,0,1),4)}
function eexp(x){x=cl(x,0,1);return x===1?1:1-Math.pow(2,-10*x)}
function hash(n){n=Math.sin(n*127.1+311.7)*43758.5453;return n-Math.floor(n)}
var $=function(i){return document.getElementById(i)};
var stage=$('stage'),Q=new URLSearchParams(location.search);
var TL=null,DUR=180,ITEMS=[],SC={},SCL=[];

/* ---------- picture plan: which photo is behind which line ---------- */
/* [image, scene-line index, fraction of that line, options] */
var PLAN={
 am:[['stress.png',3,0,{dim:.5}]],
 truth:[['night-shift.png',0,0,{dim:.7}],['the-situation-room.png',1,0,{blur:9,dim:.45}],['accountability-corridor.png',2,0,{dim:.7}],['transplant-loopholes.png',3,0,{blur:7,dim:.4}]],
 room:[['night-shift.png',0,0,{blur:14,dim:.42}]],
 legacy:[['marie_and_jeff.jpg',0,0,{}],['jeff-marie-founders.png',1,0,{fit:'contain'}],['march-for-care.jpg',2,0,{}]],
 work:[['accountability-corridor.png',0,0,{dim:.7}],['the-situation-room.png',0,.42,{blur:9,dim:.5}],['research-banner.png',0,.66,{blur:8,dim:.5}],['advocacy-infographic.png',1,0,{blur:12,dim:.4}]],
 close:[['united_we_stand.jpg',0,0,{blur:14,dim:.4}],['hero-banner.jpg',2,0,{blur:12,dim:.3,cut:1}]]
};
var TINT={am:'linear-gradient(120deg,rgba(30,80,160,.45),rgba(5,10,30,.5))',truth:'linear-gradient(120deg,rgba(210,40,50,.32),rgba(10,10,30,.45))',room:'linear-gradient(120deg,rgba(255,150,60,.3),rgba(10,30,70,.35))',legacy:'linear-gradient(120deg,rgba(255,170,80,.38),rgba(20,50,100,.3))',work:'linear-gradient(120deg,rgba(40,120,200,.38),rgba(10,20,40,.4))',close:'linear-gradient(120deg,rgba(242,184,75,.32),rgba(10,30,60,.35))'};
var SHOTS=[],BIGS=[];

function build(){
  var by={};
  TL.items.forEach(function(it,i){it.i=i;(by[it.s]=by[it.s]||[]).push(it)});
  TL.scenes.forEach(function(s,k){
    var arr=by[s.id];s.items=arr;s.t0=k===0?0:arr[0].t0-1.0;
  });
  TL.scenes.forEach(function(s,k){s.t1=k<TL.scenes.length-1?TL.scenes[k+1].t0:DUR;SC[s.id]=s;SCL.push(s)});
  ITEMS=TL.items;
  /* shots */
  TL.scenes.forEach(function(s){
    var plan=PLAN[s.id]||[];
    plan.forEach(function(p,k){
      var it=s.items[Math.min(p[1],s.items.length-1)],t0=(k===0&&p[1]===0&&p[2]===0)?s.t0:it.t0+p[2]*(it.t1-it.t0)-.3;
      var nx=plan[k+1],t1=s.t1;
      if(nx){var it2=s.items[Math.min(nx[1],s.items.length-1)];t1=it2.t0+nx[2]*(it2.t1-it2.t0)-.3}
      var o=p[3]||{},el=document.createElement('div');el.className='shot';
      if(o.fit==='contain')el.innerHTML='<img class="fill" src="'+p[0]+'" alt=""><img class="fg" src="'+p[0]+'" alt="">';else el.innerHTML='<img src="'+p[0]+'" alt="">';
      var im=el.querySelector('img:last-child'),f='contrast(1.08) saturate(.9)';
      if(o.blur)f+=' blur('+o.blur+'px)';f+=' brightness('+(o.dim||.78)+')';
      im.style.filter=f;$('shots').appendChild(el);
      SHOTS.push({el:el,t0:t0,t1:t1,o:o,seed:SHOTS.length+3,scene:s.id});
    });
  });
  /* big words */
  ITEMS.forEach(function(it){
    (it.big||[]).forEach(function(b,k){
      var el=document.createElement('div'),cls=b.c.split(' '),base=cls[0];
      el.className='t '+b.pos+' '+b.c;el.textContent=b.t;
      var n=b.t.length,fs;
      if(base==='a'){fs=n<=8?150:n<=14?128:n<=20?108:n<=30?90:76}
      else if(base==='i'){fs=n<=26?84:n<=40?68:58}
      else if(base==='m'){fs=30}
      if(fs)el.style.fontSize=fs+'px';
      $('titles').appendChild(el);
      BIGS.push({el:el,t0:it.t0+b.at*(it.t1-it.t0)-.12,t1:it.t1+.75,y:b.y||0,base:base,hit:base==='a'||base==='x'});
    });
  });
  var d=$('dots');for(var i=0;i<17;i++)d.appendChild(document.createElement('b'));
}

/* ---------- background art (window at night, soft light) ---------- */
var bg=$('bg').getContext('2d');
function bokeh(g,t,n,pal,x0,y0,x1,y1,seed,blur,amt){
  g.save();g.beginPath();g.rect(x0,y0,x1-x0,y1-y0);g.clip();g.filter='blur('+blur+'px)';
  for(var i=0;i<n;i++){
    var x=x0+hash(i+seed)*(x1-x0)+Math.sin(t*.07+i)*18,y=y0+hash(i+seed+50)*(y1-y0)+Math.cos(t*.05+i*1.3)*10;
    var r=14+hash(i+seed+90)*60,c=pal[Math.floor(hash(i+seed+130)*pal.length)],a=(.18+.5*hash(i+seed+170))*(.75+.25*Math.sin(t*(.4+hash(i)*.6)+i));
    g.fillStyle='rgba('+c+','+a+')';g.beginPath();g.arc(x,y,r,0,6.283);g.fill();
  }
  g.restore();
}
function drawBg(t,sid,vis){
  bg.clearRect(0,0,1920,1080);
  if(vis<=0)return;
  var w=bg.createLinearGradient(0,0,0,1080);w.addColorStop(0,'#05070f');w.addColorStop(1,'#0a0e18');bg.fillStyle=w;bg.fillRect(0,0,1920,1080);
  if(sid==='am'){
    /* a window onto a city that does not sleep */
    var sky=bg.createLinearGradient(0,120,0,900);sky.addColorStop(0,'#0b1730');sky.addColorStop(1,'#1b2a44');bg.fillStyle=sky;bg.fillRect(1010,130,820,760);
    bokeh(bg,t,70,['255,200,120','150,200,255','255,255,255','255,120,100'],1010,330,1830,890,7,5,1);
    bokeh(bg,t,30,['150,200,255','255,220,160'],1010,130,1830,500,300,9,1);
    bg.fillStyle='#04060b';bg.fillRect(1000,120,16,780);bg.fillRect(1824,120,16,780);bg.fillRect(1000,120,840,16);bg.fillRect(1000,884,840,18);bg.fillRect(1276,120,12,780);bg.fillRect(1550,120,12,780);
    var wl=bg.createRadialGradient(1420,500,60,1420,500,700);wl.addColorStop(0,'rgba(90,130,200,.22)');wl.addColorStop(1,'rgba(0,0,0,0)');bg.fillStyle=wl;bg.fillRect(0,0,1920,1080);
  }
}

/* ---------- fx: dust, light, vignette, grain ---------- */
var fx=$('fx').getContext('2d'),NOISE=[];
(function(){for(var n=0;n<4;n++){var c=document.createElement('canvas');c.width=c.height=256;var cx=c.getContext('2d'),id=cx.createImageData(256,256),sd=n*9973+7;
  for(var p=0;p<id.data.length;p+=4){sd=(sd*16807)%2147483647;var v=sd&255;id.data[p]=id.data[p+1]=id.data[p+2]=v;id.data[p+3]=255}cx.putImageData(id,0,0);NOISE.push(fx.createPattern(c,'repeat'))}})();
function drawFx(t,sid){
  fx.clearRect(0,0,1920,1080);
  var warm=(sid==='room'||sid==='legacy'||sid==='close');
  for(var i=0;i<110;i++){
    var sp=6+hash(i)*24,x=(hash(i+3)*2200+t*sp)%2200-140,y=(hash(i+5)*1180-t*(3+hash(i+7)*12))%1180;if(y<0)y+=1180;y-=50;
    var r=.6+hash(i+11)*2.2,a=(.15+.45*hash(i+13))*(.6+.4*Math.sin(t*(.5+hash(i))+i));
    fx.fillStyle=warm?'rgba(255,214,150,'+a+')':'rgba(170,225,255,'+a+')';fx.beginPath();fx.arc(x,y,r,0,6.283);fx.fill();
  }
  var vg=fx.createRadialGradient(960,540,400,960,540,1150);vg.addColorStop(0,'rgba(0,0,0,0)');vg.addColorStop(1,'rgba(0,0,0,.78)');fx.fillStyle=vg;fx.fillRect(0,0,1920,1080);
  var f=Math.floor(t*24);fx.save();fx.globalAlpha=.06;fx.globalCompositeOperation='overlay';fx.translate(-(hash(f)*256),-(hash(f+1)*256));fx.fillStyle=NOISE[f%4];fx.fillRect(0,0,2200,1340);fx.restore();
}

/* ---------- render(t) ---------- */
function sceneAt(t){for(var i=SCL.length-1;i>=0;i--)if(t>=SCL[i].t0)return SCL[i];return SCL[0]}
var lastScene='',capEl=$('cap'),spkEl=$('spk'),flashEl=$('flash'),sil=$('sil'),fnd=$('fnd'),phone=$('phone'),lamp=$('lamp'),dots=$('dots'),endEl=$('end');
function speakerAt(t){for(var i=0;i<ITEMS.length;i++){if(t>=ITEMS[i].t0-.05&&t<=ITEMS[i].t1+.3)return ITEMS[i]}return null}
function render(t){
  var sc=sceneAt(t),sid=sc.id;
  if(sid!==lastScene){$('tint').style.background=TINT[sid]||'none';lastScene=sid}
  var master=ss(0,1.4,t)*(1-ss(DUR-1.5,DUR,t));stage.style.opacity=master.toFixed(3);
  var it=speakerAt(t),flash=0;
  /* shots with slow push */
  SHOTS.forEach(function(o){
    var fin=o.o.cut?ss(o.t0,o.t0+.12,t):ss(o.t0-.5,o.t0+.8,t),fout=1-ss(o.t1-.2,o.t1+1,t),a=fin*fout;
    if(a<=.001){if(o.el.style.opacity!=='0')o.el.style.opacity='0';return}
    var p=cl((t-o.t0)/(o.t1-o.t0+1),0,1),h=hash(o.seed),s=1.03+.1*p+(o.o.cut?.05*(1-eo((t-o.t0)/.8)):0);
    o.el.style.opacity=a.toFixed(3);
    o.el.style.transform='translate('+((h-.5)*3*(1-2*p)).toFixed(2)+'%,'+((hash(o.seed+2)-.5)*2*(1-2*p)).toFixed(2)+'%) scale('+s.toFixed(4)+')';
  });
  /* background art */
  var amVis=sid==='am'?(1-ss(SC.am.items[3].t0-.5,SC.am.items[3].t0+1.2,t)):0;
  var roomVis=sid==='room'?1:0;
  drawBg(t,'am',amVis);
  $('bg').style.opacity=(amVis).toFixed(3);
  /* silhouette + phone glow (3 a.m.) */
  var sx,sy,sk=1;
  if(amVis>0){
    sx=300+Math.sin(t*.2)*6;sy=40;sk=.86+.012*Math.sin(t*1.1);
    sil.style.opacity=(amVis*.97).toFixed(3);sil.style.left=sx+'px';sil.style.bottom='-120px';sil.style.filter='brightness(.9)';
    sil.style.transform='scale('+sk.toFixed(4)+')';
    var fl=.8+.2*Math.sin(t*9)*Math.sin(t*2.3);
    phone.style.opacity=(amVis*fl).toFixed(3);phone.style.left=(sx+240)+'px';phone.style.top='150px';
  }else phone.style.opacity='0';
  /* dialogue: founder and volunteer */
  if(roomVis){
    var k=ss(sc.t0,sc.t0+1.2,t)*(1-ss(sc.t1-.5,sc.t1+.5,t));
    var who=(it&&it.s==='room')?it.w:'';
    var vFocus=who==='V'?1:0,fFocus=who==='F'?1:0;
    var vv=ss(0,1,vFocus),push=eo((t-sc.t0)/60);
    sil.style.opacity=(k).toFixed(3);sil.style.left='-120px';sil.style.bottom='-170px';
    sil.style.transform='scale('+(1.05+.05*push+.03*vFocus).toFixed(4)+')';
    sil.style.filter='brightness('+(.55+.55*vFocus).toFixed(2)+') drop-shadow(0 0 '+(14+34*vFocus)+'px rgba(143,216,255,'+(.25+.5*vFocus).toFixed(2)+'))';
    fnd.style.opacity=k.toFixed(3);
    fnd.style.transform='scale('+(1+.04*push+.03*fFocus+.006*Math.sin(t*1.3)).toFixed(4)+')';
    fnd.style.filter='brightness('+(.5+.55*fFocus).toFixed(2)+')';
    lamp.style.opacity=(k*(.65+.35*fFocus)).toFixed(3);
  }else{lamp.style.opacity='0';if(amVis<=0){sil.style.opacity='0'}fnd.style.opacity='0'}
  /* big type */
  BIGS.forEach(function(b){
    var el=b.el;
    if(t<b.t0-.05||t>b.t1+.6){if(el.style.opacity!=='0')el.style.opacity='0';return}
    var pin=t-b.t0,out=1-ss(b.t1,b.t1+.55,t),op=1,tr='',fl='',ls='';
    if(b.base==='a'){var e=eexp(pin/.5);op=cl(pin/.12,0,1);tr=' scale('+(1.55-.55*e).toFixed(4)+')';fl='blur('+(16*(1-e)).toFixed(1)+'px)';el.style.letterSpacing=(.14*(1-e)+.012).toFixed(3)+'em';tr+=' scale('+(1+.03*cl(pin/6,0,1)).toFixed(4)+')'}
    else if(b.base==='x'){var e2=eexp(pin/.45);op=cl(pin/.1,0,1);tr=' scale('+(2-1*e2).toFixed(4)+')';fl='blur('+(20*(1-e2)).toFixed(1)+'px)'}
    else if(b.base==='i'){var e3=eo(pin/1.0);op=cl(pin/.7,0,1);tr=' translateY('+(44*(1-e3)).toFixed(1)+'px)';fl='blur('+(10*(1-e3)).toFixed(1)+'px)'}
    else{op=ss(0,.8,pin)}
    if(out<1){fl='blur('+(10*(1-out)).toFixed(1)+'px)';tr+=' translateY('+(-24*(1-out)).toFixed(1)+'px)'}
    el.style.opacity=(op*out).toFixed(3);
    el.style.transform='translateY(calc(-50% + '+b.y+'px))'+tr;el.style.filter=fl||'none';
    if(pin>=0&&pin<.55&&b.hit)flash=Math.max(flash,.2*(1-pin/.55));
  });
  flashEl.style.opacity=flash.toFixed(3);
  /* seventeen */
  var di=ITEMS.filter(function(x){return x.dots})[0],dk=0;
  if(di){var a0=di.t0+.5,a1=di.t1+1.2;dk=ss(a0-.3,a0+.5,t)*(1-ss(a1,a1+.6,t));
    var bs=dots.children;for(var q=0;q<17;q++){var dead=ss(a0+.4+q*.13,a0+.75+q*.13,t);bs[q].style.opacity=(1-.82*dead).toFixed(2);bs[q].style.transform='scale('+(1-.25*dead).toFixed(2)+')'}}
  dots.style.opacity=dk.toFixed(3);
  /* captions and speaker */
  var cap='',ca=0,spk='',spkc='';
  if(it){cap=it.text;ca=ss(it.t0-.05,it.t0+.2,t)*(1-ss(it.t1+.05,it.t1+.3,t));

    fl.type='lowpass';fl.frequency.value=cut||2000;fl.Q.value=.6;o.connect(fl);fl.connect(g);g.connect(dest);
    g.gain.setValueAtTime(0,st);g.gain.linearRampToValueAtTime(peak,st+a);g.gain.setValueAtTime(peak,st+Math.max(a,dur));g.gain.exponentialRampToValueAtTime(.0001,st+Math.max(a,dur)+rel);

  ITEMS.forEach(function(it){
