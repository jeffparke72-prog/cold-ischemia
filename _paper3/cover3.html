<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:PF;src:url(../fonts/playfairdisplay-900-normal.woff2);font-weight:900}
@font-face{font-family:PFI;src:url(../fonts/playfairdisplay-400-italic.woff2);font-style:italic}
@font-face{font-family:BN;src:url(../fonts/bebasneue-400-normal.woff2)}
html,body{margin:0;width:1600px;height:2560px;overflow:hidden;background:#0b1620}
.c{position:relative;width:1600px;height:2560px;color:#f6efe3;background:radial-gradient(ellipse at 50% 38%,#1d3b52 0%,#10222f 55%,#080f16 100%)}
.top{position:absolute;top:130px;width:100%;text-align:center;font-family:BN;letter-spacing:16px;font-size:40px;color:#e2b873}
.t{position:absolute;top:1480px;width:100%;text-align:center;font-family:PF;font-size:230px;line-height:.98;letter-spacing:3px;text-shadow:0 10px 40px rgba(0,0,0,.55)}
.sub{position:absolute;top:2000px;width:100%;text-align:center;font-family:PFI;font-size:52px;line-height:1.28;padding:0 130px;box-sizing:border-box}
.stat{position:absolute;top:2220px;width:100%;text-align:center;font-family:BN;font-size:46px;letter-spacing:7px;color:#e2b873}
.au{position:absolute;top:2310px;width:100%;text-align:center;font-family:BN;font-size:100px;letter-spacing:16px}
.fd{position:absolute;top:2440px;width:100%;text-align:center;font-family:BN;font-size:32px;letter-spacing:8px;color:#e2b873;opacity:.9}
svg{position:absolute;left:0;top:0}
</style></head><body><div class="c">
<div class="top">1972 · A PROMISE · AN AUDIT</div>
<svg width="1600" height="2560" viewBox="0 0 1600 2560">
<defs><radialGradient id="glow"><stop offset="0" stop-color="#ffd7a0" stop-opacity=".55"/><stop offset="1" stop-color="#ffd7a0" stop-opacity="0"/></radialGradient>
<linearGradient id="gold" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f6d79a"/><stop offset="1" stop-color="#b9792b"/></linearGradient>
<filter id="b"><feGaussianBlur stdDeviation="10"/></filter></defs>
<circle cx="800" cy="760" r="560" fill="url(#glow)"/>
<!-- the seal: three quarters complete, the rest dashed -->
<g transform="translate(800 760)" fill="none" stroke-linecap="round">
<circle r="340" stroke="#e2b873" stroke-width="3" opacity=".35"/>
<path d="M0,-340 A340,340 0 1 1 -340,0" stroke="url(#gold)" stroke-width="22"/>
<path d="M-340,0 A340,340 0 0 1 0,-340" stroke="#e2b873" stroke-width="8" stroke-dasharray="4 26" opacity=".9"/>
<circle r="250" stroke="url(#gold)" stroke-width="5"/>
<circle r="238" stroke="#e2b873" stroke-width="2" opacity=".5"/>
</g>
<text x="800" y="715" text-anchor="middle" font-family="PF" font-size="150" fill="#f6efe3">1972</text>
<text x="800" y="800" text-anchor="middle" font-family="BN" font-size="52" letter-spacing="10" fill="#e2b873">PUBLIC LAW 92-603</text>
<!-- the road: afternoons converging on the seal -->
<g stroke="#e2b873" fill="none">
<path d="M800,1180 L330,1440" stroke-width="3" opacity=".6"/><path d="M800,1180 L1270,1440" stroke-width="3" opacity=".6"/>
<path d="M800,1180 L560,1440" stroke-width="2" opacity=".45"/><path d="M800,1180 L1040,1440" stroke-width="2" opacity=".45"/>
<path d="M800,1180 L800,1440" stroke-width="2" stroke-dasharray="3 22" opacity=".8"/>
</g>
<polygon points="800,1180 740,1440 860,1440" fill="#ffd7a0" opacity=".12" filter="url(#b)"/>
</svg>
<div class="t">WHAT WE<br>PROMISED</div>
<div class="sub">The Kidney Patient, the Afternoon,<br>and America’s Unfinished Pledge</div>
<div class="stat">ONE PROMISE · TEN COMMITMENTS</div>
<div class="au">JEFF PARKE</div>
<div class="fd">FOUNDER · COLD ISCHEMIA FOUNDATION</div>
</div></body></html>
