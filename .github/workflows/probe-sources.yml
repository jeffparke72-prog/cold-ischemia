# One-off and on demand: looks at public data sources from a machine with open internet and writes what it finds
# to _tools/source-probe-report.txt, so the state directory can be built from real column names.
name: Probe data sources
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["_tools/probe-sources.py"]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --quiet openpyxl
      - run: python3 _tools/probe-sources.py
      - name: Save
        run: |
          git config user.name "cif-data-bot"; git config user.email "actions@users.noreply.github.com"
          git add _tools/source-probe-report.txt
          if git diff --cached --quiet; then echo "No change."; exit 0; fi
          git commit -m "Source probe report [skip ci]"
          for i in 1 2 3; do git pull --rebase -q origin main && git push -q origin HEAD:main && exit 0; sleep 5; done
          exit 1
