# On demand: lists the closest CMS hospital records for kidney centers that still have no phone.
name: Diagnose missing phones
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["_tools/diagnose-missing.py"]
permissions:
  contents: write
jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --quiet openpyxl
      - run: python3 _tools/diagnose-missing.py
      - name: Save
        run: |
          git config user.name "cif-data-bot"; git config user.email "actions@users.noreply.github.com"
          git add _tools/missing-candidates.txt
          if git diff --cached --quiet; then echo "No change."; exit 0; fi
          git commit -m "Missing-phone candidates [skip ci]"
          for i in 1 2 3; do git pull --rebase -q origin main && git push -q origin HEAD:main && exit 0; sleep 5; done
          exit 1
