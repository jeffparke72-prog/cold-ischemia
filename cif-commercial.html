<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Stop Doing This Alone — Cold Ischemia Foundation Film</title>
<meta name="description" content="A three-minute film on the mission of the Cold Ischemia Foundation: patient-led, independent transplant and kidney care partner advocacy.">
<style>
@font-face{font-family:'Bebas Neue';font-style:normal;font-weight:400;font-display:block;src:url(fonts/bebasneue-400-normal.woff2) format('woff2')}
@font-face{font-family:'IBM Plex Mono';font-style:normal;font-weight:400 500;font-display:block;src:url(fonts/ibmplexmono-500-normal.woff2) format('woff2')}
@font-face{font-family:'Playfair Display';font-style:italic;font-weight:400;font-display:block;src:url(fonts/playfairdisplay-400-italic.woff2) format('woff2')}
@font-face{font-family:'Playfair Display';font-style:normal;font-weight:900;font-display:block;src:url(fonts/playfairdisplay-900-normal.woff2) format('woff2')}
/* Cold Ischemia Foundation: "Stop Doing This Alone", a 3-minute film.
   Everything on screen is a pure function of time (render(t)), so the same code plays live in a browser
   and renders frame-perfect to cif-commercial.mp4 (see _tools/render-commercial.js).
   The script lives in SCENES below; captions, titles and the score are timed from it automatically.
   Optional narration: put a recording at cif-commercial-voice.mp3 and it plays in sync, with the music ducked. */
:root{--ink:#030509;--tx:#ece4d8;--mut:#9aa6b4;--gold:#e0a53a;--gold2:#ffd27a;--ice:#8fd8ff;--red:#e8324c}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#000;color:var(--tx);overflow:hidden;font-family:'Playfair Display',Georgia,serif}
#wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#000}
#stage{position:absolute;left:0;top:0;width:1920px;height:1080px;overflow:hidden;background:#02040a;transform-origin:0 0}
.L{position:absolute;inset:0}
.shot{position:absolute;inset:-4%;opacity:0;will-change:transform,opacity}
.shot img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.shot .fill{filter:blur(40px) brightness(.45) saturate(.8);transform:scale(1.15)}
.shot .fg{object-fit:contain;-webkit-mask-image:linear-gradient(90deg,transparent,#000 9%,#000 91%,transparent);mask-image:linear-gradient(90deg,transparent,#000 9%,#000 91%,transparent)}
#shade{background:linear-gradient(90deg,rgba(2,4,10,.82) 0%,rgba(2,4,10,.35) 45%,rgba(2,4,10,.1) 70%,rgba(2,4,10,.55) 100%),linear-gradient(0deg,rgba(2,4,10,.9) 0%,rgba(2,4,10,0) 38%)}
#tint{mix-blend-mode:soft-light}
#grid{opacity:0;background:
  radial-gradient(ellipse at 50% 40%,rgba(40,90,160,.35),transparent 70%),
  repeating-linear-gradient(0deg,rgba(143,216,255,.06) 0 1px,transparent 1px 80px),
  repeating-linear-gradient(90deg,rgba(143,216,255,.06) 0 1px,transparent 1px 80px),#030812}
#pres{position:absolute;bottom:0;width:860px;height:1080px;opacity:0;will-change:transform,opacity}
#pres .glow{position:absolute;inset:8% 6% 0;background:radial-gradient(ellipse at 50% 45%,rgba(224,165,58,.32),transparent 65%);filter:blur(30px)}
#pres img{position:absolute;left:50%;bottom:0;height:1060px;transform:translateX(-50%);
  -webkit-mask-image:radial-gradient(ellipse 46% 62% at 50% 44%,#000 58%,transparent 100%);
  mask-image:radial-gradient(ellipse 46% 62% at 50% 44%,#000 58%,transparent 100%);
  filter:contrast(1.08) saturate(.92) brightness(.98)}
#pres .rim{position:absolute;inset:0;background:linear-gradient(100deg,transparent 40%,rgba(143,216,255,.12) 62%,transparent 75%);mix-blend-mode:screen}
#pres .tag{position:absolute;bottom:150px;left:50%;transform:translateX(-50%);white-space:nowrap;font:500 15px 'IBM Plex Mono',monospace;letter-spacing:5px;text-transform:uppercase;color:var(--gold);opacity:.85;text-shadow:0 2px 12px #000}
.t{position:absolute;opacity:0;will-change:transform,opacity,filter;text-shadow:0 4px 30px rgba(0,0,0,.75)}
.t.c{left:0;right:0;top:50%;text-align:center;transform-origin:50% 50%}
.t.l{left:150px;width:980px;transform-origin:0 50%}
.t.r{right:150px;width:960px;text-align:right;transform-origin:100% 50%}
.bb{font-family:'Bebas Neue',Impact,sans-serif;line-height:.9;letter-spacing:.02em}
.mono{font:500 22px 'IBM Plex Mono',monospace;letter-spacing:6px;text-transform:uppercase;color:var(--mut)}
.xl{font-size:250px}.l1{font-size:170px}.l2{font-size:132px}.l3{font-size:100px}.l4{font-size:76px}
.gold{color:var(--gold2)}.ice{color:var(--ice)}.red{color:var(--red)}.dim{color:var(--mut)}
.serif{font-family:'Playfair Display',Georgia,serif;font-weight:900;line-height:1.02}
.ital{font-family:'Playfair Display',Georgia,serif;font-style:italic;font-weight:400}
.stamp{display:inline-block;border:5px solid var(--red);color:var(--red);padding:10px 26px 2px;font-family:'Bebas Neue',sans-serif;font-size:84px;letter-spacing:.06em;line-height:1;background:rgba(10,0,4,.35)}
.stamp.s{font-size:58px;border-width:4px;padding:8px 20px 0}
.rule{display:block;height:3px;width:180px;background:var(--gold);margin:26px 0}
.c .rule{margin:26px auto}
.chip{display:inline-block;font:500 18px 'IBM Plex Mono',monospace;letter-spacing:5px;text-transform:uppercase;color:var(--ink);background:var(--gold);padding:10px 18px;margin-bottom:22px}
/* tool cards */
.card{position:absolute;width:640px;height:300px;border:1px solid rgba(143,216,255,.28);background:linear-gradient(160deg,rgba(14,30,52,.92),rgba(5,10,20,.92));border-radius:14px;padding:30px 34px;opacity:0;box-shadow:0 30px 80px rgba(0,0,0,.6),inset 0 1px 0 rgba(255,255,255,.06);will-change:transform,opacity}
.card h4{font:500 17px 'IBM Plex Mono',monospace;letter-spacing:4px;text-transform:uppercase;color:var(--ice);margin-bottom:14px}
.card .big{font-family:'Bebas Neue',sans-serif;font-size:96px;line-height:.9;color:#fff}
.card .sm{font:400 20px 'IBM Plex Mono',monospace;color:var(--mut);letter-spacing:1px;margin-top:10px}
.card svg{position:absolute;right:34px;top:50%;margin-top:-95px}
.wire{margin-top:8px}
.wire div{font:400 21px/1.5 'IBM Plex Mono',monospace;color:#cfe2f3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;border-bottom:1px solid rgba(143,216,255,.12);padding:6px 0}
.live{display:inline-block;width:12px;height:12px;border-radius:50%;background:var(--red);margin-right:10px;box-shadow:0 0 12px var(--red)}
.chk div{font:400 23px/1.65 'IBM Plex Mono',monospace;color:#cfe2f3}
.chk b{display:inline-block;width:30px;color:var(--gold2)}
#fx{position:absolute;inset:0;pointer-events:none}
#bars i{position:absolute;left:0;right:0;height:86px;background:#000}
#bars i:first-child{top:0}#bars i:last-child{bottom:0}
#chap{position:absolute;left:150px;top:118px;font:500 16px 'IBM Plex Mono',monospace;letter-spacing:6px;text-transform:uppercase;color:rgba(236,228,216,.6);opacity:0}
#chap b{color:var(--gold);font-weight:500;margin-right:14px}
#cap{position:absolute;left:220px;right:220px;bottom:118px;text-align:center;font:italic 400 38px/1.3 'Playfair Display',Georgia,serif;color:#fff;text-shadow:0 2px 6px #000,0 0 26px rgba(0,0,0,.9);opacity:0}
.nocc #cap{display:none}
#flash{background:#fff;opacity:0;mix-blend-mode:screen}
/* player chrome (hidden when rendering) */
#ui{position:fixed;left:0;right:0;bottom:0;z-index:9;display:flex;align-items:center;gap:12px;padding:12px 16px;background:linear-gradient(0deg,rgba(0,0,0,.85),transparent);transition:opacity .4s;font:500 12px 'IBM Plex Mono',monospace;letter-spacing:1.5px;color:#d8cfc4}
#ui button{font:inherit;letter-spacing:inherit;text-transform:uppercase;color:#030509;background:var(--gold);border:0;border-radius:999px;padding:9px 16px;cursor:pointer}
#ui button.o{background:transparent;color:#d8cfc4;border:1px solid rgba(224,165,58,.5)}
#ui input{flex:1;accent-color:#e0a53a;min-width:60px}
#ui span{min-width:92px;text-align:center}
body.idle #ui{opacity:0}
#big{position:fixed;z-index:10;left:50%;top:50%;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;gap:14px;background:none;border:0;cursor:pointer;color:#fff;font:500 13px 'IBM Plex Mono',monospace;letter-spacing:4px;text-transform:uppercase;text-shadow:0 2px 10px #000}
#big i{width:110px;height:110px;border-radius:50%;background:rgba(224,165,58,.92);display:flex;align-items:center;justify-content:center;box-shadow:0 0 0 0 rgba(224,165,58,.6);animation:pulse 2s infinite}
#big i:after{content:"";margin-left:8px;border-left:34px solid #030509;border-top:21px solid transparent;border-bottom:21px solid transparent}
@keyframes pulse{50%{box-shadow:0 0 0 22px rgba(224,165,58,0)}}
#big[hidden],#ui[hidden]{display:none}
body.render #ui,body.render #big{display:none}
@media (max-width:640px){#ui{gap:8px;padding:10px}#ui span{display:none}#ui button{padding:8px 11px}}
</style>
</head>
<body>
<div id="wrap"><div id="stage">
  <div class="L" id="grid"></div>

<script>
(function(){
'use strict';
var DUR = 180, WPS = 2.55, LINE_GAP = 0.4, SCENE_GAP = 0.9, LEAD = 2.5;
var VOICE = 'cif-commercial-voice.mp3';

/* ------------------------------------------------------------------ SCRIPT + PICTURE
   lines: the narration, in order (also shown as captions).
   shots: backdrop images; "at" = which line it cuts in on.  pres: presenter on screen (side, from line, to line).
   titles: on-screen type; at/to are line numbers (to = until that line ends; omitted = end of scene). */
var SCENES = [
 { ch:'', dark:true, lines:[
   'There is a clock most families never hear about.',
   'It starts the moment a donated organ leaves the body.',
   'Doctors call it cold ischemia time.',
   'And every minute counts.'],
   titles:[
   {at:0, to:1, pos:'c', y:-40, a:'fade', h:'<div class="mono">Organ recovered &nbsp;·&nbsp; on ice</div><div class="bb l2 ice" style="margin-top:22px" data-clock="1">00:00:00</div>'},
   {at:2, to:2, pos:'c', y:-60, a:'smash', hit:1, h:'<div class="bb xl ice">COLD ISCHEMIA</div><div class="ital" style="font-size:40px;color:#cfe2f3;margin-top:18px">the hours a donated organ spends on ice, waiting for someone</div>'},
   {at:3, pos:'c', y:-40, a:'rise', h:'<div class="bb l1 red">EVERY MINUTE COUNTS.</div>'}]},

 { ch:'01 | The people', bg:'warm', lines:[
   'Behind every transplant is a patient, a family,',
   'and a care partner holding everything together.',
   'They deserve a map.',
   'Too often, they are handed a maze.'],
   shots:[{img:'march-for-care.jpg', at:0, blur:6}],
   pres:{side:'r', from:0},
   titles:[
   {at:0, to:1, pos:'l', y:-150, a:'rise', h:'<div class="bb l3">A PATIENT.</div>'},
   {at:0, to:1, pos:'l', y:-40, d:1.3, a:'rise', h:'<div class="bb l3">A FAMILY.</div>'},
   {at:1, to:1, pos:'l', y:70, d:.6, a:'rise', h:'<div class="bb l3 gold">A CARE PARTNER.</div>'},
   {at:2, to:3, pos:'l', y:-90, a:'smash', hit:1, h:'<div class="bb l2">THEY DESERVE<br><span class="gold">A MAP.</span></div>'},
   {at:3, pos:'l', y:140, d:.5, a:'stamp', hit:.6, h:'<div class="stamp">NOT A MAZE</div>'}]},

 { ch:'02 | The gap', bg:'cold', lines:[
   'Paperwork at midnight. Policies no one explains.',
   'Decisions made behind closed doors.',
   'Fifty-three million Americans care for someone they love,',
   'and most of them are doing it alone.'],
   shots:[{img:'night-shift.png', at:0}, {img:'stress.png', at:2, fit:'contain'}],
   titles:[
   {at:0, to:0, pos:'l', y:-60, a:'type', h:'<div class="mono" style="color:#cfe2f3">02:14 AM &nbsp;·&nbsp; another form &nbsp;·&nbsp; another hold</div>'},
   {at:1, to:1, pos:'l', y:-60, a:'type', h:'<div class="mono" style="color:#cfe2f3">Decision pending &nbsp;·&nbsp; reason not provided</div>'},
   {at:2, to:3, pos:'l', y:-120, a:'smash', hit:1, h:'<div class="bb xl gold" data-count="53000000">0</div><div class="mono" style="margin-top:12px">American care partners</div>'},
   {at:3, pos:'l', y:150, a:'rise', h:'<div class="bb l3 red">MOST OF THEM ALONE.</div>'}]},

 { ch:'03 | The system', bg:'red', lines:[
   'More than one hundred thousand people are waiting for a transplant.',
   'Yet donated organs are still thrown away,',
   'and the rules meant to protect patients are full of loopholes.',
   'The policy exists. The conduct does not follow.'],
   shots:[{img:'transplant-loopholes.png', at:0}, {img:'post-image.png', at:3, fit:'contain', cut:1}],
   titles:[
   {at:0, to:0, pos:'l', y:-100, a:'smash', hit:1, h:'<div class="bb xl" data-count="100000" data-suffix="+">0</div><div class="mono" style="margin-top:12px">People waiting for a transplant</div>'},
   {at:1, to:2, pos:'l', y:-80, a:'stamp', hit:.6, h:'<div class="stamp">ORGANS DISCARDED</div>'},
   {at:2, to:2, pos:'l', y:60, d:.4, a:'stamp', hit:.6, h:'<div class="stamp">RULES FULL OF LOOPHOLES</div>'}]},

 { ch:'04 | The difference', bg:'gold', grid:true, lines:[
   'So we built something different.',
   'The Cold Ischemia Foundation is patient-led and fiercely independent.',
   'No pharmaceutical money. No dialysis corporations.',
   'No hospital systems. No insurers.',
   'Our independence is not a feature. It is the product.'],
   pres:{side:'l', from:0},
   titles:[
   {at:0, to:1, pos:'r', y:-170, a:'rise', h:'<div class="bb l3">SO WE BUILT<br>SOMETHING DIFFERENT.</div>'},
   {at:1, to:1, pos:'r', y:80, d:.8, a:'rise', h:'<div class="mono gold">Patient-led &nbsp;·&nbsp; fiercely independent</div>'},
   {at:2, to:3, pos:'r', y:-230, a:'stamp', hit:.5, h:'<div class="stamp s">NO PHARMACEUTICAL MONEY</div>'},
   {at:2, to:3, pos:'r', y:-120, d:1.6, a:'stamp', hit:.5, h:'<div class="stamp s">NO DIALYSIS CORPORATIONS</div>'},
   {at:3, to:3, pos:'r', y:-10, a:'stamp', hit:.5, h:'<div class="stamp s">NO HOSPITAL SYSTEMS</div>'},
   {at:3, to:3, pos:'r', y:100, d:1.2, a:'stamp', hit:.5, h:'<div class="stamp s">NO INSURERS</div>'},
   {at:4, pos:'r', y:-60, a:'smash', hit:1, h:'<div class="mono">Our independence is</div><div class="bb l2 gold" style="margin-top:10px">THE PRODUCT.</div>'}]},

 { ch:'05 | Facts into force', bg:'cold', lines:[
   'We turn facts into force.',
   'The Situation Room tracks what institutions would rather you never see.',
   'Our Accountability Atlas and demand letters put it on the record,',
   'and the Congress Scorecard shows who stands with patients.'],
   shots:[{img:'the-situation-room.png', at:0}, {img:'accountability-corridor.png', at:2}, {img:'advocacy-infographic.png', at:3, fit:'contain'}],
   titles:[
   {at:0, to:0, pos:'c', y:-60, a:'smash', hit:1, h:'<div class="bb xl">FACTS <span class="gold">INTO</span> FORCE.</div>'},
   {at:1, to:1, pos:'c', y:300, a:'rise', h:'<div class="chip">The Situation Room</div>'},
   {at:2, to:2, pos:'c', y:300, a:'rise', h:'<div class="chip">Accountability Atlas &nbsp;·&nbsp; Demand Letters</div>'},
   {at:2, to:2, pos:'r', y:-200, d:1.4, a:'stamp', hit:.6, h:'<div class="stamp">ON THE RECORD</div>'},
   {at:3, pos:'c', y:300, a:'rise', h:'<div class="chip">Congress Scorecard</div>'}]},

 { ch:'06 | Real tools', bg:'cold', grid:true, lines:[
   'We put real tools in your hands:',
   'a living donor journey with your own readiness score,',
   'a directory of every organ procurement organization in America,',
   'a live wire of transplant and kidney research,',
   'and a crisis guide for the first twenty-four hours.',
   'Free. No sign-up. No catch.'],
   cards:true,
   titles:[
   {at:0, to:4, pos:'c', y:-385, a:'rise', h:'<div class="bb l4">REAL TOOLS. <span class="gold">IN YOUR HANDS.</span></div>'},
   {at:5, pos:'c', y:-70, a:'smash', hit:1, h:'<div class="bb l1">FREE. <span class="gold">NO SIGN-UP.</span> NO CATCH.</div>'}]},

 { ch:'07 | Together', bg:'warm', lines:[
   'Because truth does not weaken a caregiver.',
   'It empowers one.',
   'And when care partners stand together,',
   'the systems that ignored us have to listen.'],
   shots:[{img:'research-banner.png', at:0}, {img:'united_we_stand.jpg', at:2, cut:1, blur:6, dim:.6}, {img:'march-for-care.jpg', at:3}],
   titles:[
   {at:2, to:2, pos:'c', y:-60, a:'smash', hit:1, h:'<div class="bb xl">STAND TOGETHER.</div>'},
   {at:3, pos:'l', y:-60, a:'rise', h:'<div class="bb l2">AND MAKE THEM<br><span class="gold">LISTEN.</span></div>'}]},

 { ch:'08 | Who we are', bg:'warm', lines:[
   'This started with two people who lived it, in Ellenton, Florida.',
   'It grows with every volunteer who trains,',
   'every family who speaks up,',
   'every story that refuses to be buried.'],
   shots:[{img:'marie_and_jeff.jpg', at:0}, {img:'jeff-marie-founders.png', at:1, fit:'contain'}, {img:'marie-st-pete.jpg', at:3}],
   titles:[
   {at:0, to:0, pos:'l', y:180, a:'type', h:'<div class="mono" style="color:#fff">Ellenton, Florida &nbsp;·&nbsp; founded by care partners</div>'},
   {at:1, to:3, pos:'l', y:-180, a:'rise', h:'<div class="bb l3">EVERY VOLUNTEER.</div>'},
   {at:2, to:3, pos:'l', y:-70, a:'rise', h:'<div class="bb l3">EVERY FAMILY.</div>'},
   {at:3, pos:'l', y:40, a:'rise', h:'<div class="bb l3 gold">EVERY STORY.</div>'}]},

 { ch:'', bg:'gold', lines:[
   'You do not need permission to fight for the person you love.',
   'You need a map.',
   'We built it.',
   'Now walk it with us.',
   'Cold Ischemia Foundation.',
   'Stop doing this alone.'],
   shots:[{img:'united_we_stand.jpg', at:0, blur:14}, {img:'hero-banner.jpg', at:4, blur:10, dim:.35, cut:1}],
   pres:{side:'r', from:0, to:3},
   titles:[
   {at:0, to:0, pos:'l', y:-60, a:'rise', h:'<div class="bb l3">YOU DON\'T NEED<br>PERMISSION.</div>'},
   {at:1, to:3, pos:'l', y:-170, a:'smash', hit:1, h:'<div class="bb l2">YOU NEED <span class="gold">A MAP.</span></div>'},
   {at:2, to:3, pos:'l', y:-20, a:'rise', h:'<div class="bb l3">WE BUILT IT.</div>'},
   {at:3, to:3, pos:'l', y:90, a:'rise', h:'<div class="bb l3 gold">NOW WALK IT WITH US.</div>'},
   {at:4, pos:'c', y:-250, a:'smash', hit:1.3, h:'<img src="cold-ischemia-logo-clear.png" alt="" style="height:300px"><div class="bb l3" style="margin-top:14px;letter-spacing:.08em">COLD ISCHEMIA FOUNDATION</div>'},
   {at:5, pos:'c', y:110, a:'rise', h:'<div class="serif" style="font-size:96px">Stop doing this <span class="gold">alone.</span></div><div class="mono" style="margin-top:34px;color:#fff;letter-spacing:5px">coldischemia.foundation</div><div class="mono" style="margin-top:16px;font-size:17px">Patient-led &nbsp;·&nbsp; Independent &nbsp;·&nbsp; Free tools &nbsp;·&nbsp; No pharmaceutical funding</div>'}]}
];

/* ------------------------------------------------------------------ TIMING */
var LINES = [], t = LEAD;
SCENES.forEach(function(sc, si){
  sc.L = [];
  sc.t0 = si === 0 ? 0 : t - 0.5;
  sc.lines.forEach(function(txt){
    var d = txt.split(/\s+/).length / WPS + 0.25;
    var ln = {text: txt, t0: t, t1: t + d, scene: si};
    LINES.push(ln); sc.L.push(ln); t += d + LINE_GAP;
  });
  t += SCENE_GAP;
});
SCENES.forEach(function(sc, si){ sc.t1 = si < SCENES.length - 1 ? SCENES[si + 1].t0 : DUR; });
window.CIF_FILM = {lines: LINES, scenes: SCENES};

/* ------------------------------------------------------------------ HELPERS */
function cl(x, a, b){ return x < a ? a : x > b ? b : x; }
function ss(a, b, x){ x = cl((x - a) / (b - a), 0, 1); return x * x * (3 - 2 * x); }
function eo(x){ return 1 - Math.pow(1 - cl(x, 0, 1), 4); }
function eexp(x){ x = cl(x, 0, 1); return x === 1 ? 1 : 1 - Math.pow(2, -10 * x); }
function hash(n){ n = Math.sin(n * 127.1 + 311.7) * 43758.5453; return n - Math.floor(n); }
function lineT(sc, i){ return sc.L[cl(i, 0, sc.L.length - 1)]; }
var $ = function(id){ return document.getElementById(id); };
var stage = $('stage'), shotsEl = $('shots'), titlesEl = $('titles');

/* build shots */
var SHOTS = [];
SCENES.forEach(function(sc, si){

  var minor = [[57, 60, 64], [53, 57, 60], [48, 55, 64], [55, 59, 62]];       /* Am F C G */
  var lift = [[53, 57, 60, 65], [55, 59, 62, 67], [57, 60, 64, 69], [48, 55, 60, 64]]; /* F G Am C */
  var turn = T(6);
  for (var bt = T(1) - BAR; bt < DUR - 6; bt += BAR * 2) {
    var idx = Math.round((bt - (T(1) - BAR)) / (BAR * 2)), chord = (bt < turn ? minor : lift)[idx % 4], si2 = sceneAt(bt), it = intensity[si2];
    chord.forEach(function(m, k){
      osc('sawtooth', mf(m), bt, BAR * 2 - .2, .06 + .05 * it, padB, 1.4, 1.6, 1100 + 2400 * it, -8);
      osc('sawtooth', mf(m), bt, BAR * 2 - .2, .06 + .05 * it, padB, 1.4, 1.6, 1100 + 2400 * it, 8);
      if (bt >= turn) osc('triangle', mf(m + 24), bt + .5, BAR * 2 - .8, .025, padB, 1.2, 1.5, 8000);
      if (k === 0) osc('triangle', mf(m - 12), bt, BAR * 2 - .1, .2 + .15 * it, lowB, .05, .8, 400);
    });
    /* pulsing eighths from chapter 2 */
    if (bt >= T(2) - BAR * 2) for (var e8 = 0; e8 < 16; e8++) {
      var nt = bt + e8 * BEAT / 2, m8 = chord[(e8 * (e8 % 3 === 0 ? 1 : 2)) % chord.length] + 12 + (e8 % 8 === 7 ? 12 : 0);
      osc('triangle', mf(m8), nt, .08, .1 + .12 * it, arpB, .004, .22, 2200 + 3000 * it);
    }
    /* drums build from chapter 5 */
    if (bt >= T(5) - BAR * 2) for (var b = 0; b < 8; b++) {
      var dt = bt + b * BEAT, sI = sceneAt(dt);
      if (b % 4 === 0 || (sI >= 6 && b % 2 === 0)) kick(dt, .55 + .3 * intensity[sI], 110);
      if (b % 4 === 2) noise(dt, .25, .25 * intensity[sI], drumB, 'highpass', 1800, 900);
      if (sI >= 7) noise(dt + BEAT / 2, .05, .07, drumB, 'highpass', 8000, 7000);
    }
  }
  /* final resolve: big C major chord under the end card */
  var endT = lineT(S[9], 4).t0 - .15;
  [36, 48, 55, 60, 64, 67, 72, 76].forEach(function(m){ osc('sawtooth', mf(m), endT, DUR - endT - 4, .07, padB, .4, 4, 2600, (m % 3) * 5 - 5); });
  osc('sine', mf(84), endT + 1, DUR - endT - 5, .05, padB, 2, 4, 9000);
  /* impacts and risers on every title hit */
  HITS.forEach(function(h){ if (h.big) { boom(h.t - .1, h.k); } else { kick(h.t - .08, .6 * h.k, 140); noise(h.t - .08, .5, .2 * h.k, hitB, 'lowpass', 5000, 400); } });
  [S[3].L[3].t0, S[4].L[4].t0, S[6].L[5].t0, endT].forEach(function(x){ riser(x - .1, 3.6); });
  /* sub drop + tail to silence */
  osc('sine', 40, DUR - 9, 5, .5, lowB, .01, 4, 200);
  return master;
}

/* ------------------------------------------------------------------ RENDER MODE (used by _tools/render-commercial.js) */
var Q = new URLSearchParams(location.search);
function fit(){
  var w = innerWidth, h = innerHeight, s = Math.min(w / 1920, h / 1080);
  stage.style.transform = 'translate(' + ((w - 1920 * s) / 2) + 'px,' + ((h - 1080 * s) / 2) + 'px) scale(' + s + ')';
}
addEventListener('resize', fit); fit();
function loadVoice(ctx){
  return fetch(VOICE, {cache: 'no-store'}).then(function(r){ if (!r.ok) throw 0; return r.arrayBuffer(); })
    .then(function(b){ return ctx.decodeAudioData(b); }).catch(function(){ return null; });
}
if (Q.has('render')) {
  document.body.classList.add('render');
  if (Q.get('cc') === '0') document.body.classList.add('nocc');
  window.__seek = function(tt){ render(tt); };
  window.__renderScore = function(){
    var sr = 48000, off = new OfflineAudioContext(2, sr * DUR, sr);
    return loadVoice(off).then(function(vb){
      buildScore(off, off.destination, 0, 0, vb);
      if (vb) { var src = off.createBufferSource(), vg = off.createGain(); vg.gain.value = 1; src.buffer = vb; src.connect(vg); vg.connect(off.destination); src.start(0); }
      return off.startRendering();
    }).then(function(buf){
      var L = buf.getChannelData(0), Rr = buf.getChannelData(1), n = L.length, ab = new ArrayBuffer(44 + n * 4), v = new DataView(ab);
      function ws(o, s){ for (var i = 0; i < s.length; i++) v.setUint8(o + i, s.charCodeAt(i)); }
      ws(0, 'RIFF'); v.setUint32(4, 36 + n * 4, true); ws(8, 'WAVEfmt '); v.setUint32(16, 16, true); v.setUint16(20, 1, true); v.setUint16(22, 2, true);
      v.setUint32(24, sr, true); v.setUint32(28, sr * 4, true); v.setUint16(32, 4, true); v.setUint16(34, 16, true); ws(36, 'data'); v.setUint32(40, n * 4, true);
      for (var i = 0, o = 44; i < n; i++, o += 4) { v.setInt16(o, cl(L[i], -1, 1) * 32767, true); v.setInt16(o + 2, cl(Rr[i], -1, 1) * 32767, true); }
      var bytes = new Uint8Array(ab), s = '', CH = 0x8000;
      for (i = 0; i < bytes.length; i += CH) s += String.fromCharCode.apply(null, bytes.subarray(i, i + CH));
      return btoa(s);
    });
  };
  render(Q.has('t') ? +Q.get('t') : 0);
  return;
}

/* ------------------------------------------------------------------ LIVE PLAYER */
var ctx = null, scoreOut = null, voiceEl = null, playing = false, t0wall = 0, pos = 0, raf = 0;
var big = $('big'), ui = $('ui'), pp = $('pp'), sk = $('sk'), tc = $('tc');
function clock(){ return playing ? (voiceEl && !voiceEl.paused ? voiceEl.currentTime : (performance.now() - t0wall) / 1000) : pos; }
function fmt(s){ s = Math.max(0, Math.floor(s)); return Math.floor(s / 60) + ':' + ('0' + s % 60).slice(-2); }
function tick(){
  var tt = clock();
  if (tt >= DUR) { stop(); pos = DUR; render(DUR - .01); big.hidden = false; big.querySelector('span').textContent = 'Watch again'; return; }
  render(tt); sk.value = tt; tc.textContent = fmt(tt) + ' / 3:00';
  raf = requestAnimationFrame(tick);
}
function stop(){
  pos = clock(); playing = false; cancelAnimationFrame(raf);
  if (scoreOut) { try { scoreOut.disconnect(); } catch (e) {} scoreOut = null; }
  if (voiceEl) voiceEl.pause();
  pp.textContent = 'Play';
}
function play(from){
  if (from != null) pos = from;
  if (!ctx) { var AC = window.AudioContext || window.webkitAudioContext; ctx = AC ? new AC() : null; }
  if (ctx && ctx.state === 'suspended') ctx.resume();
  if (scoreOut) { try { scoreOut.disconnect(); } catch (e) {} }
  if (ctx) scoreOut = buildScore(ctx, ctx.destination, ctx.currentTime + .05, pos, voiceEl && voiceEl.__ok);
  if (voiceEl && voiceEl.__ok) { voiceEl.currentTime = pos; voiceEl.play().catch(function(){}); }
  t0wall = performance.now() - pos * 1000; playing = true; pp.textContent = 'Pause';
  big.hidden = true; ui.hidden = false;
  cancelAnimationFrame(raf); raf = requestAnimationFrame(tick);
}
/* optional narration file */
voiceEl = new Audio(); voiceEl.preload = 'auto'; voiceEl.src = VOICE;
voiceEl.addEventListener('canplaythrough', function(){ voiceEl.__ok = true; });
voiceEl.addEventListener('error', function(){ voiceEl.__ok = false; });
big.addEventListener('click', function(){ play(pos >= DUR ? 0 : pos); });
pp.addEventListener('click', function(){ playing ? stop() : play(pos >= DUR ? 0 : pos); });
$('rs').addEventListener('click', function(){ stop(); play(0); });
sk.addEventListener('input', function(){ var was = playing; if (was) stop(); pos = +sk.value; render(pos); tc.textContent = fmt(pos) + ' / 3:00'; if (was) play(pos); });
$('cc').addEventListener('click', function(){ var on = document.body.classList.toggle('nocc'); this.setAttribute('aria-pressed', String(!on)); });
$('fs').addEventListener('click', function(){ var d = document.documentElement; if (document.fullscreenElement) document.exitFullscreen(); else if (d.requestFullscreen) d.requestFullscreen(); });
addEventListener('keydown', function(e){ if (e.key === ' ' && e.target === document.body) { e.preventDefault(); playing ? stop() : play(); } });
var idleT; addEventListener('pointermove', function(){ document.body.classList.remove('idle'); clearTimeout(idleT); idleT = setTimeout(function(){ if (playing) document.body.classList.add('idle'); }, 2500); });
render(Q.has('t') ? +Q.get('t') : 6.2);
})();
</script>
