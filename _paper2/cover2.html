<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:PF;src:url(../fonts/playfairdisplay-900-normal.woff2);font-weight:900}
@font-face{font-family:PFI;src:url(../fonts/playfairdisplay-400-italic.woff2);font-style:italic}
@font-face{font-family:BN;src:url(../fonts/bebasneue-400-normal.woff2)}
html,body{margin:0;width:1600px;height:2560px;overflow:hidden;background:#0d1b27}
.c{position:relative;width:1600px;height:2560px;color:#f6efe3;background:linear-gradient(180deg,#0f2433 0%,#143246 38%,#2a4a56 62%,#8a6a45 86%,#c98d4d 100%)}
.top{position:absolute;top:130px;width:100%;text-align:center;font-family:BN;letter-spacing:14px;font-size:40px;color:#f0c58a}
.t{position:absolute;top:210px;width:100%;text-align:center;font-family:PF;font-size:250px;line-height:.95;letter-spacing:4px;text-shadow:0 10px 40px rgba(0,0,0,.45)}
.sub{position:absolute;top:1960px;width:100%;text-align:center;font-family:PFI;font-size:50px;line-height:1.28;padding:0 120px;box-sizing:border-box;color:#f6efe3}
.stat{position:absolute;top:2205px;width:100%;text-align:center;font-family:BN;font-size:50px;letter-spacing:6px;color:#f0c58a}
.au{position:absolute;top:2320px;width:100%;text-align:center;font-family:BN;font-size:100px;letter-spacing:16px}
.fd{position:absolute;top:2450px;width:100%;text-align:center;font-family:BN;font-size:32px;letter-spacing:8px;color:#f0c58a;opacity:.9}
svg{position:absolute;left:0;top:0}
</style></head><body><div class="c">
<div class="top">TIME · DIGNITY · THE CARE STILL WORTH BUILDING</div>
<div class="t">WHAT<br>TIME<br>IS FOR</div>
<svg width="1600" height="2560" viewBox="0 0 1600 2560">
<defs><linearGradient id="beam" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffd9a0" stop-opacity=".85"/><stop offset="1" stop-color="#ffb866" stop-opacity=".12"/></linearGradient>
<linearGradient id="win" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffe3b3"/><stop offset="1" stop-color="#f4a95a"/></linearGradient>
<filter id="blur"><feGaussianBlur stdDeviation="6"/></filter></defs>
<!-- floor -->
<rect x="0" y="1700" width="1600" height="260" fill="#2b1f1a" opacity=".55"/>
<!-- window -->
<g transform="translate(250 1010)"><rect x="0" y="0" width="520" height="640" fill="url(#win)" stroke="#1b1410" stroke-width="22"/>
<line x1="260" y1="0" x2="260" y2="640" stroke="#1b1410" stroke-width="16"/><line x1="0" y1="320" x2="520" y2="320" stroke="#1b1410" stroke-width="16"/></g>
<!-- light on floor -->
<polygon points="250,1700 770,1700 1500,1960 840,1960" fill="url(#beam)" filter="url(#blur)"/>
<polygon points="260,1706 500,1706 1010,1960 640,1960" fill="#ffe0a8" opacity=".35" filter="url(#blur)"/>
<!-- chair silhouette (recliner) -->
<g fill="#10171e" transform="translate(880 1500)">
<rect x="0" y="40" width="190" height="320" rx="60" transform="rotate(-14 95 200)"/>
<rect x="20" y="250" width="360" height="110" rx="40"/>
<rect x="300" y="230" width="270" height="70" rx="34" transform="rotate(-9 435 265)"/>
<rect x="60" y="340" width="26" height="130" rx="10"/><rect x="320" y="340" width="26" height="130" rx="10"/>
<rect x="-6" y="290" width="40" height="95" rx="16"/>
</g>
<!-- machine and drip stand -->
<g fill="#10171e"><rect x="1330" y="1380" width="12" height="360"/><rect x="1290" y="1380" width="92" height="12"/><ellipse cx="1336" cy="1428" rx="26" ry="38"/><rect x="1250" y="1600" width="150" height="150" rx="14"/></g>
<!-- long shadow of chair -->
<polygon points="900,1960 1150,1960 1480,2060 1230,2060" fill="#0a0f14" opacity=".35" filter="url(#blur)"/>
</svg>
<div class="sub">A Human Account of Kidney Disease, Waiting,<br>and the Care Still Worth Building</div>
<div class="stat">1,092 HOURS A YEAR · ONE QUESTION</div>
<div class="au">JEFF PARKE</div>
<div class="fd">FOUNDER · COLD ISCHEMIA FOUNDATION</div>
</div></body></html>
