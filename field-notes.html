<template id="tpl-6"><p>Ask a room of physicians why a person’s blood carries oxygen and most
will say hemoglobin. Ask why hemoglobin outside a red cell fails at the
job, and the room grows quieter. The answer is a small molecule that
most clinicians met once in physiology class and forgot:
2,3-bisphosphoglycerate, usually abbreviated BPG or, in older texts,
DPG.</p>
<p>This essay is about that molecule, about its absence from a cow’s red
cells, and about how that absence turned bovine hemoglobin into the raw
material of choice for the oxygen carriers that reached the clinic. It
is a story about allostery, the way a protein changes shape in response
to something binding at a distant site, and it is one of the cleaner
examples I know of nature doing a favor to an engineer without meaning
to.</p>
<h2 id="the-problem-with-naked-human-hemoglobin">The problem with naked
human hemoglobin</h2>
<p>A red cell is a bag of hemoglobin at a concentration of roughly
thirty-odd grams per deciliter of cell contents, together with the
enzymes that keep the iron reduced and a bath of small molecules that
tune the protein’s behavior. The most important tuner in humans is BPG.
It binds in the central cavity of the deoxygenated hemoglobin tetramer,
wedging between the two beta chains, and stabilizes the low-affinity
form. The effect is to make hemoglobin release oxygen more readily.
Without BPG the protein clings.</p>
<p>The numbers make the point. Hemoglobin inside a normal human red cell
half-saturates with oxygen at a partial pressure, called the P50, of
around 26 to 27 millimeters of mercury. Take the same protein out of the
cell, put it in plasma, and the BPG washes away. The P50 falls to
something like 12 to 14 millimeters of mercury. That is a hemoglobin
that will load beautifully in the lung and then refuse to give its
oxygen up until the surrounding tissue is nearly anoxic. For a carrier
meant to feed starving tissue, this is a fatal design flaw.</p>
<p>There is a second problem. Outside the cell, the four-chain tetramer
can split into two-chain halves. These dimers are small enough to slip
through the kidney filter and out of the circulation, which shortens the
useful life of the protein and delivers a burden of free hemoglobin to a
delicate organ. So a successful carrier has to solve two problems at
once: fix the oxygen affinity, and glue the pieces together.</p>
<h2 id="the-early-workarounds">The early workarounds</h2>
<p>The first generation of engineers attacked the two problems by brute
chemical force applied to human hemoglobin.</p>
<p>One approach, pyridoxylation, attaches a small phosphate-bearing
group to mimic the effect of BPG and lower the affinity. Another, the
diaspirin cross-link used in the product known as HemAssist, bridges the
two alpha chains with a chemical clamp, locking the tetramer together
and, as a side effect, shifting the P50 up toward the thirties. A third,
polymerization with glutaraldehyde, stitches many tetramers into larger
assemblies, addressing the filtration problem, though it can also trap
the protein in a fixed conformation.</p>
<p>These interventions worked, more or less, in the sense that the
resulting molecules could hold together and give up oxygen. They also
carried consequences. The chemical modifications were sometimes crude,
and the final product was often a mixture. The trial history of the
class, which I have discussed in other posts, includes serious safety
signals, and it would be an oversimplification to blame any one design
decision. But it is fair to say that starting from human hemoglobin
meant starting from a protein whose native regulation had been taken
away, and rebuilding it by hand.</p>
<h2 id="the-cow-has-a-different-arrangement">The cow has a different
arrangement</h2>
<p>Now look at the ruminants. In cattle red cells, the concentration of
BPG is very low, far lower than in humans. Bovine hemoglobin has evolved
to work in a red cell that does not depend on BPG to tune its affinity.
Instead its oxygen affinity is regulated largely by chloride ions, which
are abundant in plasma at a concentration of about a hundred millimolar,
and by the ordinary effects of pH and carbon dioxide.</p>
<p>This is a startling fact when you first take it in. A protein that is
tuned by chloride is a protein that is already tuned when you put it
into plasma. Chloride does not wash away. It is the most common anion in
extracellular fluid. Bovine hemoglobin dissolved in a
chloride-containing solution therefore has a P50 in the neighborhood of
thirty or forty millimeters of mercury, which is in a physiologically
useful range, without any chemical addition.</p>
<p>Reviewers of the field have noted this advantage repeatedly: chloride
rather than BPG regulates affinity, giving bovine hemoglobin an edge
over the human protein in cell-free form. It is not the only reason the
bovine protein was chosen. Cattle are plentiful, slaughterhouses offer a
large and regulated supply of blood, and bovine hemoglobin has been
reported to be more thermally stable than the human protein. But the
allosteric difference is the most elegant one, because it means the
protein arrives at the manufacturer already behaving like a decent
oxygen transporter.</p>
<h2 id="gluing-the-halves-together">Gluing the halves together</h2>
<p>The chloride trick does not solve the dissociation problem. The
bovine tetramer still splits into dimers in dilute solution, and dimers
still leak through the kidney. The manufacturers of the two best-known
bovine products solved it with glutaraldehyde, a small molecule with an
aldehyde at each end that reacts with the amino groups of lysine
residues on the protein surface.</p>
<p>Treated correctly, glutaraldehyde does two things. It forms bridges
within a tetramer, holding it together, and it forms bridges between
tetramers, building polymers. The resulting mixture contains molecules
of many sizes. Both bovine products are named, in their formal
nonproprietary names, for their average molecular mass: the product
marketed for humans in some countries is hemoglobin glutamer-250
(bovine), and the veterinary product is hemoglobin glutamer-200
(bovine). The numbers refer, roughly, to average masses in kilodaltons.
A single human tetramer is around 64 kilodaltons, so these products
average three to four times heavier.</p>
<p>I emphasize the word average because it hides the interesting
engineering question. A polymerization reaction is statistical. It does
not produce a single molecular species. It produces a distribution, from
unpolymerized tetramer up through dimers of tetramers, trimers and
larger assemblies. The shape of that distribution matters enormously,
and it is the reason process chemists in this field are obsessed with
size-exclusion chromatography, the technique that sorts molecules by
size and lets them read the distribution like a bar chart.</p>
<h2 id="why-the-small-end-of-the-distribution-matters">Why the small end
of the distribution matters</h2>
<p>The reason is the two ends of the size curve. Molecules that are too
small leak through the kidney and slip out of the circulation into the
space beneath the endothelial lining of vessels, where free hemoglobin
scavenges nitric oxide and provokes vessel tone changes. That is one
mechanism proposed for the blood pressure elevation seen with earlier
products. Molecules that are too large increase the viscosity of plasma
and may behave differently in the microcirculation.</p>
<p>So a manufacturer wants to minimize the low end, and the
specifications reflect that. The process aims to reduce unpolymerized
tetramer and small oligomers to a low percentage through purification
steps after the reaction, commonly ultrafiltration or chromatographic
removal of the smallest species. I want to be careful here: the exact
release specifications for the two bovine products are proprietary in
part, and figures quoted in the literature vary. What can be said safely
is that a lower fraction of low-molecular-weight material was a
deliberate design goal, that the products were characterized by
size-exclusion analysis, and that the distribution is a critical quality
attribute.</p>
<p>A second critical attribute is the fraction of hemoglobin in the
oxidized form, methemoglobin. Ferric hemoglobin cannot bind oxygen, and
it also releases heme, which is toxic. A manufacturer measures it in
every lot and sets a ceiling, because it rises as the product ages. The
stability of the ferrous form during storage is a reason packaging and
storage conditions are chosen with such care. The engineering of shelf
life turns out to be an engineering of iron chemistry.</p>
<h2 id="the-tradeoff-hiding-in-the-p50">The tradeoff hiding in the
P50</h2>
<p>Now for a controversy that shows how much remains unsettled. Bovine
glutamer products have a P50 in the thirties, roughly like or slightly
above that of a person’s red cells. Is that ideal?</p>
<p>A school of thought associated with the microvascular hypothesis
argues that it is not. The argument runs as follows. In a healthy
circulation, oxygen leaves red cells while they are still in the
arterioles, the small upstream vessels, and the arteriolar wall senses
the oxygen level and constricts to protect downstream tissue from
excess. A carrier with a low affinity, like a bovine glutamer, releases
oxygen early, triggering that constriction reflex more strongly and
reducing flow. A carrier with a high affinity, which holds oxygen until
the last moment, would deliver it to the capillary bed with less
premature loss, avoiding vasoconstriction and preserving the perfusion
of small vessels. Under that logic, the best oxygen carrier for shock is
one with a P50 well below that of blood.</p>
<p>The opposing view points out that a high-affinity carrier delivers
oxygen only in tissue that is severely hypoxic, which is exactly where
you need it in shock but is a poor design for resuscitating a patient
who is anemic and otherwise stable. A carrier with a P50 in the thirties
will offload in a broader range of conditions. The disagreement is not
resolved. What is worth noticing is that the P50 of a bovine product is
not an accident of chemistry alone; it is a physiological bet, and the
bet can be argued either way.</p>
<p>For a foundation thinking about which indications to advocate for,
this matters. A carrier with a mid-range P50 sits comfortably in an
anemia niche, such as a patient who cannot receive blood. A carrier with
a very high affinity might sit better in an ischemic niche, where the
task is to reach the last few oxygen-starved cells. They are different
jobs, and they may call for different molecules.</p>
<h2 id="the-bohr-effect-and-the-co2-handshake">The Bohr effect and the
CO2 handshake</h2>
<p>One more piece of regulation deserves mention, because it is a
beautiful piece of physiology that a cell-free carrier keeps. Hemoglobin
releases oxygen more readily when the surrounding tissue is acidic and
rich in carbon dioxide. That is the Bohr effect. It is why exercising
muscle, which makes acid and carbon dioxide, gets extra oxygen delivered
exactly where it is needed.</p>
<p>The Bohr effect does not depend on BPG. It depends on the protonation
of particular amino acid side chains and on carbamate formation at the
ends of the chains. A cell-free bovine polymer retains it, at least in
part, though polymerization can dampen the response by restricting the
protein’s movement. This means that even outside a cell, the molecule
can respond to local acidity by releasing more oxygen, which is the
outcome you want in a tissue that is failing. The extent of the retained
response is a measurable property, and it varies among products and
among lots.</p>
<p>I mention it because it undermines a caricature. People sometimes
describe a BHOC as a dumb sack of hemoglobin that can only hold and
release oxygen according to one fixed curve. The truth is that it
inherits much of the responsiveness of its parent protein, dampened by
chemistry. That is a reason to take the design seriously, and a reason
to measure it carefully.</p>
<h2 id="reading-an-oxygen-curve-like-a-map">Reading an oxygen curve like
a map</h2>
<p>Physiologists draw the relation between oxygen pressure and
hemoglobin saturation as an S-shaped curve, and the P50 is simply the
pressure at the curve’s midpoint. It is more useful to think of the
curve as a map with three regions.</p>
<p>The upper flat region, above about sixty millimeters of mercury, is
the lung. Here the curve barely rises with pressure, so hemoglobin loads
to near-complete saturation even if the inspired air is thin. This
flatness is a safety margin: a person on a mountain at reduced pressure
still loads almost fully.</p>
<p>The steep middle region, between roughly twenty and sixty, is the
working zone of the tissues. A small drop in pressure produces a large
release of oxygen. A carrier’s usefulness depends on where its steep
region lies relative to the pressure of the tissue it feeds. Move the
curve to the left, as high-affinity molecules do, and the steep zone
slides toward the lower pressures, so the molecule gives up its cargo
only in the most oxygen-poor territory. Move it to the right and it
gives up cargo earlier.</p>
<p>The lower region, below about twenty, is the reserve. A carrier with
a curve that is too far to the left leaves much of its oxygen locked in
this region, and no amount of extra hemoglobin will help a tissue
sitting there. This is the arithmetic behind the early failure of
unmodified human hemoglobin in plasma. It was not that the molecule
carried too little oxygen, but that it declined to release it.</p>
<p>Seen this way, the choice between a bovine glutamer and a
high-affinity engineered molecule is a choice about which zone to serve.
And chloride, in the bovine case, simply put the curve in the middle of
the working zone by default.</p>
<h2 id="questions-worth-putting-to-a-developer">Questions worth putting
to a developer</h2>
<p>For readers who advocate for access, the chemistry converts into a
short list of questions that separate a serious program from a hopeful
one.</p>
<p>What is the P50 of the final product, measured in plasma-like
conditions at body temperature, and how much does it vary from lot to
lot?</p>
<p>What does the size-exclusion profile look like, and what fraction of
the material sits at the small end?</p>
<p>What is the methemoglobin content at release and at the end of the
labeled shelf life?</p>
<p>How much of the Bohr response survives polymerization?</p>
<p>None of these needs a doctorate to ask, and every serious
manufacturer has the numbers.</p>
<h2 id="what-the-accident-does-not-fix">What the accident does not
fix</h2>
<p>It would be a mistake to leave the impression that the chloride story
solves the problem. It solves one problem, the affinity problem, and
only partially.</p>
<p>It does not solve nitric oxide scavenging, which depends on the
availability of free hemoglobin to the vessel wall and on the size of
the molecule. It does not solve auto-oxidation, the tendency of the iron
to lose its electron and become useless. It does not solve
immunogenicity, since bovine hemoglobin remains a foreign protein. And
it does not solve the tension between a longer circulating half-life,
which favors bigger polymers, and viscosity and vascular effects, which
disfavor them.</p>
<p>What it does is remove a whole category of chemical modification from
the manufacturing process. A process that does not have to attach
anything to mimic BPG has fewer reactions, fewer side products and fewer
opportunities for variability. This is an unglamorous benefit, and in
pharmaceutical manufacturing the unglamorous benefits are frequently the
ones that decide whether a product survives scale-up.</p>
<h2 id="temperature-a-footnote-that-becomes-a-chapter">Temperature, a
footnote that becomes a chapter</h2>
<p>Every P50 quoted in a brochure is measured at body temperature, and
every P50 changes when the temperature does. Cooling shifts the curve to
the left: hemoglobin holds oxygen more tightly in the cold. For a
patient in shock or a surgical patient cooled on purpose, this is a
modest correction. For a donor organ resting in ice, it is a large one,
and it means that a molecule tuned for warm blood behaves like a
different molecule at four degrees. That is the subject of a later post,
but the seed is here. The chloride trick sets the default. It does not
make the curve immune to the thermometer.</p>
<h2 id="a-note-on-why-nobody-chose-the-pig">A note on why nobody chose
the pig</h2>
<p>Someone will ask why cattle, not pigs or horses. I do not have a
definitive published answer, and I would be suspicious of anyone who
claims one. The likely reasons are practical. Cattle produce a large
volume of blood per animal, there is an established slaughter and
inspection infrastructure, and the biochemistry of the bovine protein,
with its chloride regulation, is convenient. Porcine hemoglobin does not
offer the same allosteric advantage, as far as I know, and it introduces
cultural and religious considerations of its own, discussed in another
post on this site. The choice of species was probably made by a
combination of chemistry and logistics, and both pointed toward the
cow.</p>
<h2 id="what-to-remember">What to remember</h2>
<p>If you take one idea from this essay, take this. The success of the
bovine approach was never a triumph of design so much as a gift of
evolution accepted with gratitude. A cow’s red cell does not use BPG, so
a cow’s hemoglobin is tuned by something that plasma already contains.
Human hemoglobin needed to be repaired before it could be used outside
its cell. Bovine hemoglobin needed only to be held together.</p>
<p>That distinction should shape how patient communities talk about the
technology. The choice of a bovine source is not a curiosity of the
marketplace. It has a chemical reason, and the reason is one a
non-specialist can understand: the cow’s protein works in plasma because
it never needed the molecule that plasma lacks.</p>
<p>The rest of the story, the questions of safety, of vessel tone, of
oxidation and of immune response, remains open. The chloride, at least,
is settled.</p>
<h2 id="further-reading">Further reading</h2>
<p>Reviews of hemoglobin-based oxygen carriers describe chloride
regulation of bovine hemoglobin affinity, glutaraldehyde polymerization
and the naming of the glutamer products; one accessible open-access
review is titled Hemoglobin-Based Oxygen Carriers: Current
State-of-the-Art and Novel Molecules. Numeric values for P50 and
molecular weight distributions vary across sources and lots and should
be verified against product documentation before use.</p>

<template id="tpl-7"><p>Medicine likes to tell the story of its failed products as a story
about the products. The molecule was toxic, the trial was underpowered,
the mechanism was misunderstood. Those explanations are sometimes
correct. But they leave out a second story running in parallel, which is
about the organizations that made the molecules. Companies have
anatomies. They have capital structures, burn rates, single points of
failure and moments at which a bad quarter turns into an existential
one.</p>
<p>This essay reads the history of the oxygen-carrier industry as a
series of corporate autopsies. I will not pretend to a level of detail
that public sources do not support, and where I am uncertain I will say
so. The aim is not gossip. The aim is to identify the patterns that
repeat, because those patterns tell a patient community what has to be
different this time if a BHOC is going to be available in five years and
not merely promised.</p>
<h2 id="the-peculiar-economics-of-a-product-with-no-customers-yet">The
peculiar economics of a product with no customers yet</h2>
<p>Begin with the structure of the problem. A company that wants to sell
an oxygen carrier for human use has to do four expensive things in
sequence, and it has to pay for each before it earns a dollar.</p>
<p>First it has to build a manufacturing plant capable of producing a
sterile injectable from an animal or recombinant source, at a scale that
regulators will accept as representative of commercial supply. This is a
capital project measured in tens of millions of dollars. Second, it has
to run clinical trials in emergency and surgical settings, which are
among the most difficult and costly trials in medicine, with sites that
must screen patients in minutes and enroll them without consent. Third,
it has to survive regulatory review, which for a first-of-class product
with a troubled predecessor history is slow and unforgiving. Fourth, it
has to build a market in hospitals that already have a working
alternative in the blood bank.</p>
<p>The difficulty is that none of these steps is optional and none can
be shortened by cleverness. The fixed costs are borne before there is a
revenue stream to service them. In the financial vocabulary, the
business model demands long duration equity and offers a binary outcome.
Investors call this the valley of death, and it swallowed more than one
company in this field.</p>
<h2 id="five-stories-told-briefly">Five stories, told briefly</h2>
<p>The following sketches are drawn from public reporting and reviews.
They are intentionally brief and I have kept to facts I could
source.</p>
<p><strong>Baxter and the diaspirin hemoglobin.</strong> The best-known
early product from a major pharmaceutical firm was a human hemoglobin
cross-linked between its alpha chains, sold under the developmental name
HemAssist. A trauma trial published in the Journal of the American
Medical Association in 1999 reported that 24 of the 52 patients given
the product died within 28 days, 46 percent, against 8 of the 46
patients given saline, 17 percent. The program ended. What is notable is
that this was a large, well-financed company with regulatory expertise,
and the failure was scientific rather than financial. It set the tone
for the entire class in the eyes of regulators and journal editors, and
the memory of that trial is still invoked when new products are
discussed, even though the molecule is chemically different from a
bovine polymer.</p>
<p><strong>Hemosol and the raffinose-linked hemoglobin.</strong> A
Canadian company developed a human hemoglobin cross-linked with a
sugar-derived reagent. According to the same review, the program
advanced to late-stage trials and was discontinued in 2003 after
patients receiving the product experienced adverse cardiac events. The
company’s own finances deteriorated in the years that followed, and it
entered insolvency proceedings in the middle of the decade. Here,
financial death followed scientific death by a short interval, which is
the typical pattern for a company whose entire value is a single
product.</p>
<p><strong>Northfield and the polymerized human hemoglobin.</strong>
This Illinois company pursued the field’s most ambitious trial, the
prehospital trauma study discussed elsewhere on this site, which used an
exception from informed consent. The regulatory outcome was unfavorable
and the pooled safety analysis published in 2008 hurt further. The
company filed for bankruptcy in 2009. What distinguishes Northfield’s
case is that it was bold. It attempted the hardest indication first, in
a setting where the comparator was standard emergency care and the
endpoint was mortality. If it had succeeded, it would have transformed
emergency medicine. It did not, and there was no second product to fall
back on.</p>
<p><strong>Biopure and the bovine glutamers.</strong> The Massachusetts
company that developed the two bovine products, one for dogs and one for
people, is the most relevant case here, and its history is documented in
some detail. It was founded in 1984 and began by sourcing bovine blood
from regional slaughterhouses. In 1999 the Food and Drug Administration
and the European Commission approved the veterinary product for anemic
dogs. In April 2001 South Africa approved the human product for surgical
anemia. It was also approved in Russia. But the American regulator
placed a hold on a proposed trauma study in April 2003 and rejected an
application for use in orthopedic surgery in July of that year. Later
that year the stock fell sharply after the Securities and Exchange
Commission found misleading statements about the regulator’s stance, and
in 2005 the commission brought charges against the company’s chief
executive and other officers. In 2008 the pooled safety analysis
appeared. On July 16, 2009 the company filed for Chapter 11 bankruptcy
protection, and its assets were bought by a private entity that
September.</p>
<p><strong>The successor entities.</strong> The assets passed through
more than one owner. By 2014 the human product was being made available
through the regulator’s expanded access mechanism, and in 2022 a
successor company filed a registration statement seeking about 30
million dollars in an initial public offering, drawing a skeptical
response from at least one financial journalist who called the attempt a
long shot. I do not know how that filing ended, and I would rather say
so than guess.</p>
<h2 id="the-patterns">The patterns</h2>
<p>Read the five stories side by side and five patterns emerge.</p>
<p><strong>The single-product company.</strong> Every one of these
organizations was built around one molecule. When the molecule stumbled,
there was nothing to absorb the shock. Big pharmaceutical companies that
took on hemoglobin projects, like Baxter, could shelve the effort and
continue. A small company cannot. The lesson is not that small companies
should not try, but that a small company needs a structure that
separates its survival from any single trial result. Options include a
platform with several indications, a diversified funding base, or a
partnership in which a larger organization shares the downside.</p>
<p><strong>Judgment by class.</strong> When one product harmed patients,
regulators, reviewers and journalists learned to treat the whole class
with suspicion. The pooled analysis in 2008 was an example: it combined
trials of several different molecules and produced a single alarming
number. That is a fair scientific act, because the products shared a
mechanism of concern. It was also a commercial catastrophe for the
companies whose products differed. A bovine polymer is not chemically
the same as a cross-linked human dimer. But a company cannot argue its
way out of a class reputation in a single meeting. It has to generate
its own data, patiently, over years, and it has to be able to afford the
years.</p>
<p><strong>Improving comparators.</strong> The blood supply became safer
over the same period, in large part because of the diseases that first
motivated the search for substitutes. Screening for viruses improved,
leukoreduction became routine, and transfusion practice grew more
restrained. Every improvement raised the bar for a product whose main
pitch was safety from infectious disease. A product designed in the
1990s to offer protection against contamination that then became rare
had a shrinking advantage.</p>
<p><strong>Governance failures.</strong> The Biopure case includes an
element that no chemistry explains. The commission’s findings about
misleading statements to investors and the criminal charges against
officers destroyed trust in the company’s public communications. It is
difficult to overstate how corrosive this is. In a field where the
science is already contested, the credibility of the sponsor becomes a
scientific variable, because reviewers must decide how far to trust the
sponsor’s reading of its own data. A company that has been caught
shading its statements pays a tax on every subsequent claim.</p>
<p><strong>Survival through niches.</strong> And here is the most useful
pattern of all. The bovine product did not vanish. It survived, in a
battered form, because three small niches kept it alive: a veterinary
market that valued it, a handful of countries that had approved it, and
a compassionate access route for patients who could not receive blood.
None of these markets could support a company on its own, but together
they preserved the manufacturing know-how, the regulatory dossier and a
trickle of clinical experience. When a new owner acquired the assets, it
acquired something that a start-up could not have built: a product that
had already been made, shipped and used. The lesson for planners is that
niches are not a consolation prize. They are scaffolding. A niche that
pays even modestly keeps a validated process running, keeps trained
people employed and keeps a pharmacovigilance record accumulating, and
those three things are the hardest to rebuild once lost. An ephemeral
company can leave behind an enduring capability, provided someone is
diligent enough to preserve it through the wreckage.</p>
<h2 id="what-a-durable-model-might-look-like">What a durable model might
look like</h2>
<p>Suppose a patient organization were asked to design the funding and
governance structure for a BHOC program that could survive the next
fifteen years. What would it insist on?</p>
<p>I would begin with the customer. The natural early customers for an
oxygen carrier are not consumers or even hospitals, but institutions
that carry responsibility for people in places where blood cannot
follow. Military medical commands, remote-region health services,
disaster response agencies and organizations serving people who refuse
blood on grounds of conscience all fit. Such buyers can fund development
on contract, purchase in bulk and value a shelf-stable product for
reasons the blood bank market does not. Because they pay before the
commercial market matures, they reduce the valley.</p>
<p>Next comes the regulatory strategy. A rare-disease or orphan
designation, where it applies, offers incentives that improve the
economics of a small market. Expanded access, used carefully, generates
a record of real-world use and can be a modest revenue source, though a
regulator will not allow it to substitute for trials. Foreign approvals,
which have some precedent for this product, can open smaller markets and
produce clinical data, provided their standards of evidence are
transparent.</p>
<p>Third is manufacturing. A plant that can only make one product at one
scale is a fragile asset. Modular, smaller-scale facilities that can
produce clinical lots and low-volume commercial supply reduce the
capital at risk. I do not know which developers are pursuing this route,
and I would ask them.</p>
<p>Fourth is data discipline. The lasting damage to the field came from
unfulfilled promises and disputed interpretations. A program that
pre-registers its trials, publishes negative results and invites
independent analysis builds a kind of credit that money cannot buy. This
is not idealism. It is a strategy for lowering the tax on every future
claim.</p>
<p>Fifth is governance. A company whose communications have been audited
by an independent committee, whose disclosures are conservative and
whose leadership does not overstate its regulatory position offers an
investor something rare in this sector: predictability. A patient
organization has leverage here. It can decline to lend its name to
promotional claims that go beyond the data, and it can say so
publicly.</p>
<h2 id="the-arithmetic-of-the-valley">The arithmetic of the valley</h2>
<p>A worked example makes the structure vivid. The figures below are
invented for illustration and do not describe any real company, but the
shape is faithful to what the histories show.</p>
<p>Imagine a developer that needs 40 million dollars for a pilot plant,
25 million for two pivotal trials, and 8 million a year in overhead for
five years before a decision. The total before any revenue is roughly
105 million dollars. Suppose the chance that the first trial succeeds is
one in three, that regulators approve given success is one in two, and
that the first year of sales is small. The expected value of the
enterprise at the start is dominated by a one-in-six event. An investor
who understands that will demand a return of many times the money, and a
founder who understands it will be tempted to shade the
probabilities.</p>
<p>Now add the peculiar feature of this field. A failure of one trial
does not merely lose that trial’s cost. It changes the prior for the
whole class, so the probability of success for the next company falls
too. In economic language, each failure imposes a negative externality
on competitors. That is why capital in this sector has come in bursts
and then vanished for years: the informational damage of a failure
lingers long after the balance sheet is cleaned up.</p>
<p>The remedy is not obvious, but one piece is: reduce the amount that
has to be raised at the riskiest point. A program that can reach an
early human data point cheaply, through a small compassionate-use series
or an ex vivo organ perfusion study where the drug never enters the
patient’s bloodstream, spends a few million dollars to learn something
that would otherwise cost tens of millions. Cheap early information is
the most valuable asset a small developer can buy.</p>
<h2 id="leading-indicators-an-outsider-could-have-watched">Leading
indicators an outsider could have watched</h2>
<p>It is easy to write an autopsy after the death. The harder and more
useful task is to ask what an outside observer, such as a patient
organization, could have noticed while the patient was still alive.</p>
<p>Watch the ratio of announcements to publications. A developer that
issues frequent press statements and rarely publishes peer-reviewed data
is telling you something about where its evidence lives.</p>
<p>Watch the language used about the regulator. Confident statements
about what an agency has said or will say, unsupported by documents, are
a warning. The Biopure episode with the securities regulator turned on
exactly that kind of statement.</p>
<p>Watch the trial design. A first trial that tries to prove survival
benefit in the most severe emergency setting, without earlier smaller
studies, is an all-or-nothing wager. It may be brave. It is also how a
company puts its whole future on a single roll.</p>
<p>Watch the manufacturing. If the company cannot describe its process,
its lot release criteria and its supply redundancy in plain terms, its
plant is either immature or its story is.</p>
<p>Watch the cash runway. A company with fewer than eighteen months of
funding and a trial that will read out in twenty-four is a company that
will negotiate its next financing from a position of weakness.</p>
<p>None of these indicators is proof of failure. Together they are a
checklist that an advocacy group with access to public filings can
apply, and it is a checklist that would have raised flags in several of
the histories above.</p>
<h2 id="where-advocacy-fits-in-the-ledger">Where advocacy fits in the
ledger</h2>
<p>There is a temptation for advocates to see the industry’s failures as
an argument for more urgency and less caution. I think the history says
the opposite. Every failure in this field included a moment of
enthusiasm that outran the evidence: the early trial that was expanded
before the signal was understood, the announcement that reached
investors before regulators, the confidence that a favorable meeting
meant approval.</p>
<p>What advocacy can offer is something the market underprices: patient
legitimacy. A trial that patients trust enrolls faster and drops out
less. A program with a credible community voice is more likely to obtain
the community consultation that emergency research demands. An
organization that has read the history and can say what went wrong last
time is better placed to make sure it does not happen again.</p>
<p>It can also do something quieter. It can keep the record. The reason
I can write this essay at all is that other people, journalists,
regulators, reviewers, took the trouble to document how the companies
rose and fell. Without that record, each new generation of developers
would rediscover the same mistakes at the same cost. A patient
organization that maintains a plain-language archive of what happened,
product by product, is doing work the industry has no incentive to
do.</p>
<h2 id="the-uncomfortable-conclusion">The uncomfortable conclusion</h2>
<p>Five companies, three bankruptcies or insolvencies among them by my
count, and one cow protein that limped on. If you had to summarize the
pattern in a sentence, you could say that this field has been unusually
hard on its organizations and, oddly, kinder to its molecules. The
bovine glutamer outlived the company that made it.</p>
<p>That should reassure and warn in equal measure. It reassures because
it suggests the molecule is not the weak point; a product that keeps
finding a use after its sponsor collapses is doing something worth
doing. It warns because a molecule without a durable steward has no
future, however good it is. The next chapter will be decided less by
chemistry than by whether the people who care about it, including the
patients, insist on an organization worthy of the molecule.</p>

<template id="tpl-8"><p>There is a product in the oxygen-carrier family whose central design
feature will sound, on first hearing, like a mistake. It is a bovine
hemoglobin, chemically wrapped in polyethylene glycol, and it is
manufactured and stored with carbon monoxide already bound to its iron.
Carbon monoxide is the gas that kills people in garages and closed rooms
precisely because it takes the place of oxygen on hemoglobin. A medicine
that begins by filling every binding site with carbon monoxide seems to
be built backward.</p>
<p>The product is known as Sanguinate, a PEGylated carboxyhemoglobin
from bovine blood, developed by Prolong Pharmaceuticals. Reading how its
developers justify the design is one of the more instructive exercises
in this field, because it forces a rethinking of what an oxygen carrier
is for. This essay walks through the argument, states clearly which
parts are supported and which are hopeful, and draws the lessons that
matter for patients following the wider BHOC story.</p>
<h2 id="the-gas-we-mistake-for-only-a-poison">The gas we mistake for
only a poison</h2>
<p>Start with a fact that surprises many people. Your body makes carbon
monoxide continuously. An enzyme called heme oxygenase breaks down heme,
the iron-containing ring from old hemoglobin, and one of the products is
carbon monoxide, along with iron and a green-yellow pigment called
biliverdin. This is not a rare or pathological event. Every day a
healthy adult breaks down a substantial quantity of hemoglobin and
generates a small, steady flow of the gas.</p>
<p>Over the past few decades, physiologists have shown that this
endogenous carbon monoxide behaves as a signaling molecule. It relaxes
blood vessels, dampens certain inflammatory responses, and influences
how cells handle stress. It belongs to a small group of gaseous
transmitters, sometimes called gasotransmitters, along with nitric oxide
and hydrogen sulfide. The three share a history: each was known first as
a poison, and each was later found to be a messenger the body makes on
purpose. Readers of another post in this series will recognize hydrogen
sulfide from the deep-sea tubeworm, which uses a protein to carry it
safely.</p>
<p>The step from that science to a drug is a small one conceptually. If
carbon monoxide at low doses can calm inflamed, oxygen-starved tissue,
then a delivery system for small, controlled amounts of the gas might
help. Chemists developed several classes of carbon monoxide-releasing
molecules to test the idea. The Sanguinate design takes a different
route: it uses hemoglobin, the body’s own carbon monoxide carrier, as
the delivery vehicle.</p>
<h2 id="why-carboxyhemoglobin-is-a-good-storage-form">Why
carboxyhemoglobin is a good storage form</h2>
<p>There is a second, more prosaic reason to load hemoglobin with carbon
monoxide, and it is pure chemistry. Free hemoglobin is fragile. In the
oxygenated state it slowly loses an electron from its iron and turns
into methemoglobin, which cannot carry oxygen and which sheds toxic
heme. The oxygenated form is the most susceptible. In the deoxygenated
state the iron is reactive in other ways, including toward nitric
oxide.</p>
<p>Carbon monoxide bound to hemoglobin protects the iron. The carboxy
form is reported to be considerably more resistant to oxidation than the
oxy form, because carbon monoxide binds tightly and holds the iron in
its ferrous state. A manufacturer who stores the product as
carboxyhemoglobin therefore has a molecule that stays useful on the
shelf. When the product is infused, the carbon monoxide is gradually
displaced by oxygen in the lung and in tissue, since oxygen at high
concentration can compete with carbon monoxide, and the released carbon
monoxide can act as a signal. The gas is at once a preservative and a
payload.</p>
<p>Those are two independent justifications, one from stability
chemistry and one from pharmacology, that point to the same molecule.
When two independent arguments converge, it is worth paying attention,
though convergence is not proof that either is right.</p>
<h2 id="wrapping-the-molecule">Wrapping the molecule</h2>
<p>The second element of the design is the polyethylene glycol.
PEGylation attaches long, water-loving chains to the protein surface. It
has been used for decades to extend the circulation time of protein
drugs and to shield them from immune recognition. In the context of a
hemoglobin carrier, the chains do several things at once. They enlarge
the molecule’s effective size in solution, which reduces leakage through
the kidney. They add a hydration shell that increases viscosity and
colloid osmotic pressure without requiring a high concentration of
protein. And, as the developers argue, they lower the molecule’s
tendency to trigger vasoconstriction, which in earlier products was
linked to the scavenging of nitric oxide in the vessel wall.</p>
<p>PEGylation also changes oxygen affinity. Reports on this class of
PEGylated hemoglobins describe a high-affinity carrier, with a P50 well
below that of normal blood. That is the opposite of the bovine glutamer
products discussed in another post on this site. A high-affinity design
is consistent with the microvascular hypothesis: a carrier that holds
oxygen tightly delivers it only where tissue is severely hypoxic, and
does not trigger arteriolar constriction upstream. The developers
presented this as an advantage in conditions such as sickle cell crisis
and ischemia, where blood vessels have narrowed and red cells cannot
reach the tissue.</p>
<h2 id="three-gases-one-protein">Three gases, one protein</h2>
<p>It helps to line up the three gasotransmitters against the single
protein that meets all of them, because the comparison shows why
hemoglobin is both the problem and the opportunity.</p>
<p>Nitric oxide is made by the vessel lining and diffuses a short
distance to the smooth muscle around it, where it relaxes the muscle and
widens the vessel. Free hemoglobin in plasma is an avid scavenger of
nitric oxide, which is the root of the vasoconstriction that undermined
earlier carriers. The problem is that hemoglobin removes a gas the body
wants to keep.</p>
<p>Carbon monoxide is made in small amounts by heme breakdown, binds
hemoglobin about two hundred times more tightly than oxygen does, and
relaxes vessels by a different route, through the same enzyme that
nitric oxide activates and through potassium channels. Here the protein
holds a gas that the body may want to release. Loading it in advance
turns the scavenger into a depot.</p>
<p>Hydrogen sulfide is made by several enzymes, is toxic at high levels,
and in the tubeworm is carried on zinc sites of the protein without
harming the heme. It shows that a hemoglobin can be engineered, by
evolution, to carry a second gas safely.</p>
<p>Seen together, the three gases suggest a design vocabulary. A future
carrier might scavenge less nitric oxide, deliver a dose of carbon
monoxide, and shield its iron from sulfide. That is speculative. It is
also a coherent research program, and the PEGylated carboxy product is
its first tangible example.</p>
<h2 id="a-thought-experiment-about-dose">A thought experiment about
dose</h2>
<p>Because the safety argument depends on dose, a numerical thought
experiment is helpful. The numbers below are illustrative only and are
not drawn from any trial.</p>
<p>Suppose a patient has five liters of blood with a total hemoglobin of
ten grams per deciliter, so fifty grams circulating. Suppose an infusion
adds three grams of a carboxy carrier, six percent of the total. If
every molecule of the carrier were saturated with carbon monoxide, then
in the first moments the carboxy fraction of the patient’s total
hemoglobin would rise by about six percentage points from the carrier
alone. In practice the carbon monoxide begins to exchange almost at once
with oxygen in the lung, so the peak would be lower and the fraction
would decline over hours.</p>
<p>Compare this with a heavy smoker, who can have baseline
carboxyhemoglobin of five to ten percent, and with a person in a garage,
in whom levels above twenty or thirty percent produce headache,
confusion and collapse. Under this admittedly rough arithmetic, a small
dose sits in the range that a smoker tolerates daily, and a very large
one would approach the range of clinical concern. That is why the
protocol details matter, and why the honest summary has to include the
phrase depends on the dose.</p>
<p>The reason to go through this is not to reassure. It is to show the
kind of reasoning a reader can apply to any claim about safety. Ask for
the dose, ask what fraction of hemoglobin it represents, and ask how
that compares with a familiar exposure. Numbers turn a scary word into a
quantity.</p>
<h2 id="the-clinical-ambitions">The clinical ambitions</h2>
<p>The published descriptions of the product’s development list a set of
targets that reads like a map of the places where oxygen fails locally
rather than globally. The company obtained an orphan drug designation
from the United States regulator for sickle cell disease. The
designation was reported to be based on what the manufacturer described
as the product’s ability to reverse sickling in laboratory settings, and
it was cited in connection with complications including vaso-occlusive
crisis, acute chest syndrome, leg ulcers and stroke. Trials were
reported in other oxygen-deprivation conditions, including delayed
cerebral ischemia after bleeding around the brain and delayed function
in kidney grafts from donors. Early trials were also reported in
beta-thalassemia outside the United States.</p>
<p>There is also the use that made the product visible outside the
specialty literature: emergency compassionate use for patients with
life-threatening anemia who refused blood. These single-patient cases,
like others in this field, generated case reports rather than controlled
data.</p>
<p>I want to be exact about what I know and do not know. I have read the
developers’ summary papers and the regulator’s public designation
notice. I have not seen complete, peer-reviewed results of a randomized
trial showing that the product improves a clinical outcome in any of the
listed conditions, and I will not imply otherwise. Where a phase 2 trial
has been run, the responsible response is to consult the trial report
itself. My purpose in this essay is to examine the logic of the design,
not to certify its success.</p>
<h2 id="what-the-sickle-cell-rationale-actually-is">What the sickle cell
rationale actually is</h2>
<p>Sickle cell disease is worth a moment because its logic is a good
test of the whole idea. In sickle cell disease a mutation in the beta
chain makes deoxygenated hemoglobin polymerize inside the red cell,
deforming it into a rigid crescent that jams small vessels. The jam
causes a local oxygen deficit, which promotes more deoxygenation, which
promotes more sickling. It is a feedback loop.</p>
<p>The argument for a cell-free, high-affinity carrier is that it can
slip past the blockage. A red cell is a large, stiff object when sickled
and cannot squeeze through a partly closed vessel. A dissolved polymer
or a PEGylated protein moves with the plasma, and plasma still flows
through narrow channels that cells cannot enter. If the protein delivers
even a little oxygen to the tissue beyond the blockage, it might
interrupt the loop. The addition of carbon monoxide may contribute an
anti-inflammatory and vessel-relaxing effect that eases the vessel
narrowing.</p>
<p>This is a beautiful hypothesis. It is also a hypothesis, and a hard
one to test, because sickle cell crises are unpredictable, patient
reports of pain are subjective, and the natural course of a crisis is to
improve on its own. Trials in this area are difficult to design and easy
to misread. A modest positive signal in a small trial may be noise. A
negative one may reflect the wrong dose or the wrong timing. That does
not make the idea wrong. It means the honest summary is: interesting
mechanism, limited proof.</p>
<h2 id="the-measurement-puzzle">The measurement puzzle</h2>
<p>Anyone who has read the earlier post on measurement will see a
difficulty at once. If a product is loaded with carbon monoxide, the
instruments we use to read oxygenation become unreliable in a specific
way.</p>
<p>A standard finger pulse oximeter, which uses two wavelengths of
light, cannot distinguish oxyhemoglobin from carboxyhemoglobin; both
absorb red light similarly, so it reads a falsely reassuring saturation
when carbon monoxide is present. This is the same reason the instrument
fails in real carbon monoxide poisoning. A laboratory co-oximeter, which
measures at many wavelengths, can separate the two species, and so any
trial of a carboxyhemoglobin product has to specify that arterial
samples be analyzed on a co-oximeter and that finger readings not be
relied on.</p>
<p>Here is the rub. The total carboxyhemoglobin level in the blood after
an infusion of a carboxyhemoglobin product is a mixture of the product’s
own carbon monoxide and the patient’s native levels, and the
interpretation depends on the dose. A small dose adds a fraction of a
percent to the total carboxyhemoglobin fraction. A large one could raise
it to a level that in a smoker or a poisoned patient would prompt
concern. A careful protocol therefore has to define dose limits in terms
of the carbon monoxide delivered, monitor carboxyhemoglobin by
co-oximetry, and educate staff to disregard the pulse oximeter’s number.
Any of these steps can fail in a busy emergency department, and that is
a real operational hazard.</p>
<h2 id="the-safety-question-asked-fairly">The safety question, asked
fairly</h2>
<p>Is it safe to give carbon monoxide to a patient? The pharmacologist’s
answer is that dose determines the poison, as with most drugs. Carbon
monoxide is dangerous when it displaces a large fraction of the body’s
oxygen-carrying capacity, typically levels of carboxyhemoglobin well
into the double digits. The amount delivered by a modest infusion of a
carboxyhemoglobin carrier is a fraction of that, and it is diluted into
a patient who is receiving less than a full replacement of their
hemoglobin.</p>
<p>But the pharmacologist’s answer is incomplete for three reasons.</p>
<p>First, the patients most likely to receive the product are already
compromised. A sickle cell patient in crisis, a patient with a brain
bleed or a patient with a failing organ may have less reserve to
tolerate any reduction in usable hemoglobin. Second, carbon monoxide
binds not only to hemoglobin but also to other heme proteins, including
cytochromes in mitochondria, and its net effect on cellular respiration
depends on dose in ways that are still being mapped. Third, carbon
monoxide has a long history as an occupational and environmental hazard,
and the public and clinicians carry a strong prior against it. A
hospital pharmacy committee may struggle to approve a drug whose active
ingredient is a poison by common understanding, even if the pharmacology
is sound.</p>
<p>None of these objections is decisive. All of them are the kind of
question a regulatory reviewer would ask, and the public documents
suggest the developers took them seriously by monitoring
carboxyhemoglobin levels in their early trials. I will simply state that
a careful reader should treat the safety case as plausible but
incompletely established.</p>
<h2 id="what-the-design-teaches-about-the-whole-field">What the design
teaches about the whole field</h2>
<p>Step back from the product itself, because I think its importance is
broader than any one program.</p>
<p>The mainstream story of oxygen carriers is a story about
substitution: a molecule replaces a red cell, and success is measured by
whether it carries as much oxygen as blood. The carbon monoxide design
proposes a different category. The molecule is a dual-purpose object, an
oxygen transporter that is also a drug. It exploits the fact that
hemoglobin is the natural carrier of gaseous signaling molecules as well
as of oxygen, and it treats that as a feature.</p>
<p>If the idea is right, it opens a path for the whole family. A carrier
could be loaded with a therapeutic amount of a gas, or with nitric oxide
in a protected form to counter the scavenging problem, or with a
stabilizing ligand that extends shelf life. The bovine glutamers
discussed in another post carry oxygen and nothing else. A future
generation might carry oxygen and a dose of signal.</p>
<p>If the idea is wrong, it teaches something too. It would mean the
vessel-relaxing and anti-inflammatory actions of carbon monoxide at
these doses are too weak to matter, and that the protective value of the
PEG shield and the high affinity did the work. Either way, the
comparison of PEGylated carboxy products with unmodified bovine polymers
offers a natural experiment: two designs with related chemistry and very
different philosophies. A well-organized field would design its trials
to tell them apart.</p>
<h2 id="a-word-for-patient-communities">A word for patient
communities</h2>
<p>The lesson for advocates is largely about vocabulary. When someone
tells you a product is a bovine hemoglobin oxygen carrier, ask which
kind. The category contains molecules that differ in size, in oxygen
affinity, in what they carry besides oxygen, and in what disease they
aim to treat. A bovine glutamer of average mass around two hundred fifty
kilodaltons with a mid-range affinity is not the same object as a
PEGylated carboxyhemoglobin with a high affinity. Lumping them together,
as public discussion often does, makes evidence for one seem to apply to
the other, and makes the failure of one seem to condemn both.</p>
<p>It is equally important to be honest about the difference between
mechanism and outcome. A design can be clever and still fail. The
history of the field is littered with clever designs. What earns trust
is a patient, transparent record of trial results, and until that record
exists the appropriate stance toward any of these products is curiosity,
not conviction.</p>
<p>The poison bound to that iron is not a paradox. It is a proposition,
stated in chemistry: that the body’s oldest toxin, given in a controlled
dose and carried by its own transport protein, might be an ally. The
proposition has been made. The test is the trial data.</p>
<h2 id="further-reading">Further reading</h2>
<p>The developers’ summary of mechanism and clinical experience appears
in an Artificial Organs paper from 2017 on PEGylated carboxyhemoglobin
bovine. The regulator’s orphan designation for sickle cell disease was
reported in 2015. Background on carbon monoxide as an endogenous

I have not attempted to summarize.</p>

<template id="tpl-9"><p>The standard pitch for an oxygen carrier goes like this: blood is
scarce, perishable and dangerous, so give the patient something better.
It is a pitch that made sense in 1985, when the blood supply had been
shaken by a new virus and by a shortage of donors in a war zone. In 2026
it needs a more careful hearing, because the thing it claims to beat has
changed. Blood in the field is getting simpler, closer to the patient
and better studied. The competitor is no longer a hospital blood bank a
helicopter ride away. It is increasingly a cooler in the back of an
ambulance.</p>
<p>This essay is a stress test. It asks, with as little wishful thinking
as possible, where a BHOC still has a defensible place given what the
simpler alternatives can now do. I believe the answer is real and
narrower than promoters suggest, and that a patient organization gains
more from stating the narrow answer plainly than from repeating a broad
one that experienced clinicians will pick apart.</p>
<h2 id="the-competitor-learned-from-the-war">The competitor learned from
the war</h2>
<p>In the wars of the early twenty-first century, military medicine
relearned an old lesson. Patients who die of hemorrhage die early, often
within the first hour, and the intervention that changes their odds is
giving blood products promptly and in something like the proportions in
which they were lost. Whole blood, which contains red cells, plasma and
platelets together, fits that principle naturally.</p>
<p>Two developments then moved whole blood from the battlefield to the
civilian ambulance. First, the concept of low-titer group O whole blood
took hold. Group O red cells can be given to almost anyone. Group O
plasma contains antibodies against A and B antigens, which can harm
recipients of other groups, but if the antibody level is low the risk is
small. Blood banks began screening group O donors for low antibody
titers, with a common threshold in the trial described below being a
titer below 256, and issuing that blood as a near-universal product.
Second, small teams in helicopters and ground ambulances began carrying
it, along with portable refrigerators.</p>
<p>Meanwhile, plasma moved forward on a parallel track. A large
randomized trial of plasma given during air medical transport, known as
PAMPer and published in 2018, found lower mortality at 30 days in trauma
patients who received plasma early. In the trial’s control group,
mortality was about 33 percent, and in the plasma group roughly 23
percent. A post hoc analysis in a later paper suggested that the benefit
was concentrated in patients whose transport time was longer than about
20 minutes. Dried plasma, which can be stored at room temperature and
reconstituted with sterile water, offered a way to bring the same
principle to places without refrigeration.</p>
<h2 id="the-trial-that-complicated-the-story">The trial that complicated
the story</h2>
<p>The most recent large study of prehospital whole blood, called TOWAR,
was published in the New England Journal of Medicine in May 2026. It
enrolled 1,020 patients across 44 air medical bases and 11 trauma
centers, between May 2022 and June 2025, using a design in which bases
were randomly assigned, two to one, to carry whole blood or the usual
component therapy. The primary outcome was death within 30 days.</p>
<p>The result surprised many people who expected a benefit. According to
the published summary, mortality at 30 days was 25.9 percent in the
whole blood group and 20.5 percent in the component group, an adjusted
odds ratio of 1.24 with a confidence interval running from 0.87 to 1.76,
and a p-value of 0.24. In plain language, the trial did not show that
whole blood helped, and the point estimate leaned the other way, though
the uncertainty was wide enough that a benefit or a harm remained
possible. The authors noted limitations: crossover between arms,
variable volumes, an inability to mask the clinicians and limited data
on coagulation. They also noted that overall mortality in the trial,
24.3 percent, was lower than in the earlier trial, which suggests that
modern trauma systems have become better at controlling bleeding and
delivering blood quickly.</p>
<p>I mention this trial for two reasons. First, it should humble anyone,
including a BHOC advocate, who assumes that a physiologically attractive
product will beat the alternative. Whole blood is about as
physiologically attractive as a product can be, and in a rigorous test
it did not win. Second, it shows what the bar looks like. A modern
trauma system, delivering component therapy quickly, achieves a
mortality figure around a fifth to a quarter in a severely injured
population. A new product that hopes to demonstrate a mortality
advantage in the same setting faces a very large sample size and a very
narrow margin.</p>
<h2 id="the-three-things-a-competitor-cannot-do">The three things a
competitor cannot do</h2>
<p>If the civilian trauma pathway is increasingly well served by blood,
where is the gap? I would organize the answer around three functions
that human blood products, however good, cannot perform. These are the
defensible territory for a BHOC.</p>
<p><strong>The first is to reach patients who will not accept
blood.</strong> For patients whose conscience forbids transfusion, blood
products are not competitors at all. They are unavailable by the
patient’s own decision. For those patients the relevant comparison is
between a BHOC and no oxygen-carrying support other than what their own
bodies can manage, which may mean life-threatening anemia treated with
iron, erythropoietin, oxygen and hope. This is the setting in which
emergency compassionate access has been most often sought, and it is the
one where the ethical case is strongest. The population is small, but
the need in each case is acute.</p>
<p><strong>The second is to reach patients who cannot be
matched.</strong> Some patients have developed antibodies against many
red cell antigens, through repeated transfusions or pregnancies, so that
compatible blood is hard or impossible to find. Some have rare blood
types. In such a patient, a product with no red cell antigens and no
need for cross-matching is not a marginal convenience but the only
feasible option. The number of such patients is again modest, and their
situation often unfolds slowly enough that the search for compatible
blood can continue while a bridge is given.</p>
<p><strong>The third is to survive where the cold chain cannot.</strong>
Whole blood is stored at refrigerator temperature, and in the trial
discussed above the shelf life was up to 21 days. Dried plasma travels
better, but it supplies clotting factors and volume without red cells.
Neither delivers oxygen-carrying capacity in a stable room-temperature
form. A BHOC, on the other hand, has been described in product
literature as storable at room temperature for years. There are places,
remote clinics, disaster zones, small vessels at sea, long-range
military patrols, where a cooler with a monitored temperature is a
logistical burden that cannot be met. For those places, a shelf-stable
oxygen carrier is not a substitute for blood so much as a way to keep a
patient alive until blood can be reached.</p>
<h2 id="the-pack-mule-arithmetic">The pack-mule arithmetic</h2>
<p>Logistics is a matter of grams and degrees, and a short calculation
shows why the room-temperature niche is more than sentiment. The figures
are illustrative round numbers and do not describe any specific product
or unit.</p>
<p>A medic on foot can carry perhaps a few kilograms of resuscitation
supplies among everything else. A unit of refrigerated whole blood
weighs roughly half a kilogram before packaging, and the insulated
container and cold packs required to keep it between one and six degrees
Celsius can multiply that several times over. The container must be
opened rarely, monitored, and replaced when the ice runs out. A patrol
that lasts three days in a hot climate has to plan for the ice.</p>
<p>A bag of a room-temperature carrier of comparable volume weighs about
the same as the blood, without the container, and can ride in a pack
beside the bandages. It also has no expiry that arrives in three weeks.
If the patrol does not need it, it comes home and goes back on a shelf.
Whole blood that was not used may be wasted or returned with its clock
running down.</p>
<p>None of this makes the carrier better clinically. It makes it lighter
and more forgiving, and in logistics that is sometimes the entire
argument. Military planners talk about the burden of weight and the
burden of refrigeration in the same breath, and any advocate who wants
to be taken seriously by them will speak in those units.</p>
<h2 id="the-blood-banks-view">The blood bank’s view</h2>
<p>It is instructive to imagine how a hospital blood bank director hears
the BHOC pitch. Her whole professional life is organized around the
safety of a product that is difficult to keep safe: matching, screening,
storage, expiry, tracing. She is proud of the record, and she should be.
She hears a proposal to add a new product to the shelf, made from
another species, with a troubled history and a large question mark over
its cardiac safety.</p>
<p>What would persuade her? Not a claim about the future of medicine.
She would want four things. A defined list of patients for whom she can
use it, so that her staff have a protocol and not a judgment call. A
monitoring plan for the laboratory tests that a plasma pigment will
disturb, so that chemistry results are not misread. A clear statement of
who owns the decision to use it, and who documents consent. And a supply
that does not run out, since a product that vanishes after she has
written it into her protocols is worse than no product.</p>
<p>This is a useful test for a patient organization: if you cannot
answer those four questions in a page, you are not ready to ask a blood
bank director for anything. If you can, you are speaking her language,
and she is likely to listen. Blood bankers are, for the most part,
people who would like their patients to have more options, provided the
options are safe and the paperwork is honest.</p>
<h2 id="where-the-pitch-overreaches">Where the pitch overreaches</h2>
<p>It is just as useful to name the claims that a fair-minded clinician
will not accept.</p>
<p>The claim that a BHOC can replace blood in general trauma is
unsupported. The history of the field, including the pooled analysis
published in 2008, gives reasons to be cautious, and the modern
comparator has improved.</p>
<p>The claim that a BHOC is safer than blood because it lacks infectious
risk is weaker than it was. The modern blood supply is screened for the
known viruses, and the residual risks are very small. The bovine product
introduces its own risks, addressed in another post in this series.</p>
<p>The claim that a BHOC is a universal solution to blood shortage is
unrealistic. Shortages are real, but they are chronic and regional, and
the oxygen-carrying capacity of a few units of a carrier is a small
fraction of what a bleeding patient needs. A carrier has a half-life
measured in hours to a day, and it does not replace clotting factors or
platelets. A patient bleeding from a torn vessel needs the bleeding
controlled and clotting support, and a BHOC provides neither.</p>
<p>That last point is worth dwelling on, because it changes the framing.
Hemorrhage is a problem with three parts: stop the bleeding, restore
clotting, restore oxygen delivery. The literature of the past two
decades has shown that the first two have the greatest effect on
survival, and that blood products address all three at once. A BHOC
addresses only the third. It is a component, and a good use for it is as
a bridge alongside other measures.</p>
<h2 id="combination-not-competition">Combination, not competition</h2>
<p>Here is a different way to see it. Suppose that the future of forward
resuscitation lies in a combination of products chosen for their
logistical properties. Dried plasma provides clotting factors and
volume. A hemostatic agent controls bleeding. Whole blood, where cold
chain exists, provides everything. And a shelf-stable oxygen carrier
provides the oxygen-carrying capacity that plasma lacks when blood is
unavailable.</p>
<p>The Army has published thinking about a lyophilized product strategy
along these lines, combining freeze-dried plasma with a freeze-dried red
cell or platelet component. That work is aimed at closing the gap
between what a medic can carry and what a patient needs. In that
architecture a BHOC is one of several possible oxygen components, and
the question is whether it wins on weight, stability, cost and safety
against the other candidates.</p>
<p>Stated that way, the comparison is more tractable and more honest. A
BHOC does not have to beat blood. It has to beat the nearest alternative
in a specific place. In a helicopter with a fridge, the alternative is
blood. In a village three days’ walk from a road, the alternative is
nothing.</p>
<h2 id="the-evidence-that-would-settle-it">The evidence that would
settle it</h2>
<p>If a patient organization wanted to press the case in the sensible
territory, what evidence would it ask for?</p>
<p>For the conscience-based population, a registry of every emergency
access case, recorded consistently, with outcomes at discharge and
follow-up, safety events, dose, hemoglobin measured both in plasma and
in red cells, and the reasons for choosing the product. These cases are
already occurring. Without a common form, the information is scattered
across case reports.</p>
<p>For the unmatched population, a similar registry, together with a
defined pathway under which a hospital blood bank can request the
product when compatible blood cannot be found within a set time.</p>
<p>For the cold-chain-limited setting, a field-feasibility study: stock
the product at remote sites, train staff, track storage conditions and
use, and measure whether it is used appropriately and whether patients
survive to reach definitive care. This is not a randomized trial, but it
produces something regulators and funders need, which is proof that the
logistics work.</p>
<p>For each, the outcome should be defined ahead of time and the
comparator should be honest. Where the comparator is no oxygen-carrying
therapy, a historical or registry control is acceptable if openly
described. Where blood is available, the comparison should be to
blood.</p>
<p>One more distinction protects everyone from confusion. Saying that a
BHOC belongs where blood cannot go is different from saying that blood
should not be used where it can. A patient who is bleeding in a
well-equipped hospital should receive what the best evidence supports,
which is blood in the right proportions. Nobody serves the field by
suggesting otherwise, and nobody in the field who is honest with
themselves believes it.</p>
<h2 id="the-strategic-point">The strategic point</h2>
<p>There is a temptation to answer the whole-blood trial by dismissing
it, arguing that it was underpowered or that the population differed.
The sounder response is to accept it and adjust. A field that has spent
decades trying to beat blood in a general population has spent decades
on the hardest version of the question. The easier version, and the one
in which a BHOC has a clear reason to exist, is to reach the people that
blood cannot reach.</p>
<p>That reframing also improves the ethics. A product aimed at patients
who have no alternative has a favorable risk-benefit calculation even if
its safety is imperfect, because the alternative is worse. A product
aimed at patients who could receive blood must clear a higher bar. Being
clear about which is which protects patients and protects the
credibility of the advocates.</p>
<p>It also protects the science. If the only trials ever run are large
trials against blood in trauma, the likely result is another
disappointment, and the class will suffer for it. If the trials are
designed around the populations with no alternative, the likely result
is a clear signal, one way or the other, at a manageable sample
size.</p>
<h2 id="what-i-would-say-to-a-skeptical-trauma-surgeon">What I would say
to a skeptical trauma surgeon</h2>
<p>Imagine that a trauma surgeon who has read the recent trial asks why
anyone still cares about a cow protein. A fair answer might go like
this. You are right that in your system, with a helicopter, a blood bank
and a cooler, the case for a carrier is weak. But you do not treat all
the patients. Some refuse blood, some cannot be matched and some are in
places your system does not reach. For those patients your options are
thinner than you would like. A stable, unmatched, room-temperature
product that keeps someone alive until blood is possible is worth
having. I am not asking you to replace your cooler. I am asking you not
to let the better answer for most patients become the enemy of a
workable answer for the rest.</p>
<p>I think a surgeon might accept that. I think many would.</p>
<h2 id="closing">Closing</h2>
<p>The simpler competitor has raised the bar, and in doing so it has
clarified the mission. The story of the last fifteen years is not that
oxygen carriers lost. It is that blood got better, and the space that
remained is the space where blood cannot go. That space is smaller than
the promoters once imagined, and it is real. Every person in it has a
name and a family, and every one of them is a reason to do the work
properly.</p>
<p>A cow protein will not rescue the general trauma patient. It might
rescue the patient who has no other door. That is a modest ambition, and
it happens to be the one the evidence can support.</p>
