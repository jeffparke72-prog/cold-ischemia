is one of the few variables in the whole process that a human being can
shorten, and it is the reason that every organ is packed in ice and
rushed in a cooler.</p>
<p>This essay is about the physics and biochemistry of that interval and
about a question that follows from it. If oxygen carriers are to help a
donor organ, they must work at temperatures far below the ones for which
they were designed. Does a molecule tuned for the warmth of a living
body behave sensibly at four degrees? The answer turns out to be
interesting, partly counterintuitive and central to how one might build
a preservation product around a BHOC.</p>
<h2 id="what-the-cold-buys-and-what-it-costs">What the cold buys and
what it costs</h2>
<p>Cooling an organ is a bargain with biochemistry. Metabolic reactions
slow as temperature falls, following a rule of thumb that rates drop by
a factor of roughly two to three for every ten degrees Celsius. By the
time a kidney or liver sits at about four degrees, its energy demand is
a small fraction of what it was at body temperature; figures around a
tenth or less are commonly quoted, though the exact fraction differs
among tissues and conditions. The organ is not dead. It is in a kind of
suspended animation.</p>
<p>The bargain has a cost. Even at low demand, the cells still consume
some energy, and in the absence of blood flow they have no oxygen to
make it with. They burn through their stores of adenosine triphosphate,
the molecule that powers pumps and repairs. The pumps that keep sodium
and calcium in balance falter. Cells swell. Mitochondria, the small
structures that make energy, begin to accumulate metabolic
intermediates. The longer the interval, the more of this damage
builds.</p>
<p>One of the most striking discoveries in this area concerns a molecule
called succinate. During ischemia, mitochondria in many tissues
accumulate succinate, a compound normally consumed in the
energy-producing cycle. When blood flow returns and oxygen floods back,
the built-up succinate is oxidized rapidly and drives a burst of
reactive oxygen species from the mitochondria. That burst is thought to
be a major driver of the injury that occurs on reperfusion, the moment
the organ is reconnected. In other words, the damage is not simply from
being without oxygen. It is from the way oxygen returns.</p>
<p>This changes the question. The problem is not only how to keep cells
alive in the cold. It is how to prepare them for the moment of
reconnection so that the return of oxygen is orderly rather than
explosive.</p>
<h2 id="the-counterintuitive-physics-of-oxygen-in-the-cold">The
counterintuitive physics of oxygen in the cold</h2>
<p>Now consider oxygen itself. Two physical facts collide at low
temperature.</p>
<p>The first is that gases dissolve better in liquids when the liquid is
cold. Oxygen is more soluble in water at four degrees than at
thirty-seven, by a factor that is significant though not enormous. So a
cold perfusion fluid can hold more dissolved oxygen at a given pressure.
Combined with a lower metabolic demand, this means that the dissolved
oxygen in a properly oxygenated cold solution may suffice, without any
carrier, to supply an organ at rest.</p>
<p>The second is that hemoglobin binds oxygen more tightly in the cold.
Cooling shifts the oxygen-binding curve to the left, lowering the P50,
the pressure at which half the hemoglobin is saturated. The shift is
substantial. A hemoglobin with a P50 in the thirties at body temperature
has a much lower P50 at four degrees, so that it holds onto its oxygen
until the surrounding pressure is very low. Physiologists know this
effect from cold-water diving and from animals that let their
extremities cool.</p>
<p>Put these two facts together and the picture is odd. In the cold,
dissolved oxygen is more abundant and hemoglobin is more reluctant. A
carrier that was designed to release oxygen at a moderate pressure in a
warm body becomes, in ice, a molecule that grips its cargo. That is not
necessarily fatal for the approach, because the organ needs so little
oxygen and because the perfusate can be oxygenated to a very high
pressure. But it means the role of a carrier in cold preservation is not
a copy of its role in the body. It has to be reconsidered from first
principles.</p>
<h2 id="what-the-clinical-evidence-shows-about-oxygen-alone">What the
clinical evidence shows about oxygen alone</h2>
<p>Before asking what a carrier adds, it helps to know how much oxygen
alone accomplishes. Here the clinical evidence is unusually good, at
least for the liver.</p>
<p>A randomized trial published in the New England Journal of Medicine
in 2021 compared livers from donors after circulatory death that were
preserved by static cold storage, the ice-cooler method, with livers
that received a period of hypothermic oxygenated machine perfusion
before implantation. The perfusion machine circulated an oxygenated
solution through the liver at low temperature. Without going beyond what
I could confirm, I recall that the trial found a substantially lower
rate of symptomatic bile duct strictures in the perfused group, roughly
6 percent against roughly 18 percent. A careful reader should confirm
those figures in the original report, but the direction and rough size
of the effect are widely cited.</p>
<p>The important point is what the machine did not use. It did not
circulate red cells. It did not use a hemoglobin carrier. The oxygen was
dissolved in a cold, acellular fluid. That is a demonstration that in
the cold, with a resting organ, dissolved oxygen can be enough to change
outcomes. The proposed mechanism is that supplying oxygen during the
cold interval lets mitochondria restore some of their energy stores and
clear the succinate that would otherwise fuel the burst on
reperfusion.</p>
<p>Any argument for a carrier in cold preservation must therefore start
with humility. The baseline is not ice alone. The baseline is a machine
that already delivers oxygen well, at least in the liver. The carrier
would have to show a benefit beyond it.</p>
<h2 id="where-a-carrier-might-still-add-value">Where a carrier might
still add value</h2>
<p>There are at least four situations in which a carrier could plausibly
earn its place.</p>
<p><strong>The first is static cold storage with an additive.</strong>
Many organs, especially kidneys in many centers, travel in a cooler with
no machine at all. Machines cost money, need staff and are not available
at every donor hospital. A preservation solution that included an oxygen
carrier could give a slow supply of oxygen to an organ sitting in a bag,
without any pump. A developer of a lugworm-derived giant hemoglobin has
pursued exactly this idea, and reported a first-in-human use in a kidney
in France in 2016. The evidence base is small and largely from the
developer, and I would treat it as suggestive.</p>
<p><strong>The second is the warmer end of the range.</strong> Between
the cold of four degrees and the warmth of body temperature lies a zone,
roughly twenty to thirty degrees, that some groups use for what they
call subnormothermic perfusion. At those temperatures the organ has
substantial metabolic demand but dissolved oxygen alone falls short, and
a carrier’s affinity shift is smaller. This is the region where a
carrier’s properties fit the task best.</p>
<p><strong>The third is the normothermic machine.</strong> At body
temperature, machines that perfuse an organ for hours use red cells as
the carrier, and those red cells must come from donated blood. A
cell-free carrier that could replace them would remove a dependence on
blood supply, ease logistics and, in principle, allow perfusion to be
offered in places without blood banks. This is perhaps the most
straightforward application, because the temperature matches the body,
and the molecule is working in conditions it was designed for.</p>
<p><strong>The fourth is the reperfusion moment.</strong> If a carrier
could be present in the perfusate at the moment the organ is
reconnected, it might buffer the return of oxygen. This idea is more
speculative, but it matches the mechanism: the injury comes from a
burst, and a carrier could in theory smooth it.</p>
<h2 id="the-advantage-nobody-mentions-enough">The advantage nobody
mentions enough</h2>
<p>One argument in favor of using a carrier in an isolated organ is
powerful and deserves more attention than it gets. The history of oxygen
carriers in the bloodstream is a history of systemic side effects: blood
pressure elevation, effects on the heart, effects on the kidney, effects
arising from the scavenging of nitric oxide in the vessel wall. Those
effects are what stopped several programs.</p>
<p>An organ on a machine is outside the body. The carrier circulates
through the organ and back to a reservoir. If the organ is flushed
before it is connected to the recipient, most of the carrier is washed
out, and the recipient receives little of it. In effect the drug is
administered to the organ, not to the patient. The exposure that harmed
trial subjects in the past is largely avoided.</p>
<p>I want to be careful. The claim is that systemic exposure is reduced,
not eliminated. Some carrier remains in the small vessels and tissue,
and its fate after reperfusion needs to be studied. The organ’s own
vessel lining, exposed to a hemoglobin solution, may show local effects.
But as a way of reintroducing an oxygen carrier to medicine while
limiting its risk, the ex vivo setting is one of the most sensible I
know. Ask the right question of any program: how much carrier remains in
the organ after flush, how was it measured, and what happened to the
recipients?</p>
<h2 id="a-day-in-the-life-of-a-kidney">A day in the life of a
kidney</h2>
<p>Abstractions are easier to judge against a concrete timeline. The
following sequence is a composite for illustration, not a record of any
real case.</p>
<p>The donor is declared, and the kidneys are recovered in an operating
room while the donor is still on support. Cold preservation fluid is
flushed through the vessels until the organ blanches, then the kidney is
trimmed, bagged in sterile layers and packed in a cooler with ice. From
that moment the clock of cold ischemia is running.</p>
<p>The kidney travels. It may go by road to an airport, by air to
another state, by road again to a hospital. Each handoff is a chance for
delay: a missed connection, a weather hold, a courier who cannot find
the loading dock. Meanwhile, at the receiving hospital, a recipient is
called in, tested and prepared, and a surgical team is assembled. If the
recipient turns out to be unsuitable at the last minute, the kidney is
redirected, and the clock keeps running.</p>
<p>When the kidney arrives it is inspected, and someone decides whether
it looks well enough to use. That decision, made under time pressure, on
appearance and a few numbers, is a place where a lot of quality and a
lot of anxiety meet. Then comes the surgery, during which the kidney is
warmed by the body and stitched into place, and finally the clamps come
off and blood flows. That moment of reconnection, the reperfusion
described earlier, is when the injury from the cold interval expresses
itself.</p>
<p>Nothing in that sequence gives the organ oxygen. If a preservation
system could add even a modest supply of oxygen during the transport, in
a cooler with no pump, it would touch every stage of the journey without
asking the couriers to do anything differently. That is why the static
cold storage additive is, to my eye, the most attractive application of
a carrier, even though the evidence is thinnest there.</p>
<h2 id="kidneys-are-not-livers">Kidneys are not livers</h2>
<p>A last caution concerns generalizing from the liver trial. Organs
differ in their metabolism, their vascular architecture and their
sensitivity to cold. The liver is a metabolically busy organ with a dual
blood supply, and its injury pattern after preservation involves the
bile ducts, which are exquisitely sensitive to oxygen deprivation. The
kidney has a different profile. Its tubules consume large amounts of
energy to reabsorb salts, and its characteristic post-preservation
problem is delayed function, when the organ is slow to begin working.
Machines for kidneys have been studied for years, and randomized trials
have found reductions in delayed function with hypothermic machine
perfusion compared with ice storage, although the size of the benefit
varies among studies and the machines used are usually not
oxygenated.</p>
<p>The upshot is that a carrier for kidneys would be entering a field
with a well-established machine comparator, in which the addition of
oxygen itself is still being tested. A prudent developer would design a
kidney study with both questions in view: does oxygen help, and does a
carrier add anything to oxygen delivered by simpler means? An advocate
should want both questions asked, because a positive answer to the
second would be far more persuasive than a positive answer to the first
alone.</p>
<h2 id="the-instrument-problem-again">The instrument problem, again</h2>
<p>A cold perfusion carrier raises measurement problems that echo an
earlier post. Clinicians assess a machine-perfused organ by looking at
it. Color, texture and the way it blanches and refills are used as signs
of quality, and an experienced surgeon judges viability partly by eye. A
solution full of red-brown hemoglobin changes the look of the organ and
may change those judgments. Perfusate chemistry tests, such as lactate
or enzymes released from damaged cells, are used to judge injury, and a
pigment can interfere with colorimetric assays.</p>
<p>The remedy is not to avoid carriers but to validate the assessments
in their presence, and to agree on markers that do not depend on color.
This is the sort of unglamorous protocol work that decides whether a
technology is adopted.</p>
<h2 id="the-choice-of-molecule">The choice of molecule</h2>
<p>If I were advising a developer about preservation in the cold, I
would ask which molecule and why.</p>
<p>A carrier with a very high affinity would be a poor unloader at four
degrees. A carrier with a moderate affinity at body temperature may
become high-affinity in the cold, which is acceptable if the organ needs
little oxygen but is wasteful if the goal is delivery. A carrier with a
large size, such as a giant worm hemoglobin, stays in the vessels and
may show good antioxidant behavior, which suits reperfusion. A bovine
polymer sits between. It has a long track record of manufacturing and
human use, a middling affinity and a modest size distribution.</p>
<p>There is also the option of a cold-tuned design, a carrier engineered
so that its affinity at low temperature is closer to what the organ
needs. Whether such a design is feasible is an open question. I raise it
because the cold has been treated as a constraint to be endured rather
than a design parameter to be used.</p>
<p>The choice of comparator deserves a sentence of its own. A carrier
study that compares against nothing but ice will look better than one
that compares against a simple oxygenated machine, and sponsors will be
tempted by the easier comparison. Patients are better served by the
harder one, because the harder one tells them whether the carrier is
worth the added complexity, cost and regulatory burden.</p>
<h2 id="why-this-matters-to-patients">Why this matters to patients</h2>
<p>For a patient waiting for a donor organ, the cold interval is
invisible. It happens to somebody else’s organ, in a cooler, on a road
or a runway, and is measured in hours nobody sees. Yet its length and
quality shape how long the organ works after it arrives, and whether it
works at all. A meaningful share of organs that are recovered are never
used, for reasons that include concern about quality. Improved
preservation is one of the few interventions that could widen the supply
without asking a single additional person to donate.</p>
<p>That is the reason a foundation devoted to the cold interval should
follow oxygen carriers closely and demand clear evidence. It should also
be a wary audience. The strongest current data show that oxygen,
delivered by a machine in a simple fluid, already helps. The carrier’s
role is to extend that benefit to places without machines, to warmer
perfusion and to the moment of reconnection. Those are worthwhile goals,
but each requires its own evidence.</p>
<h2 id="what-a-good-study-would-look-like">What a good study would look
like</h2>
<p>To close, imagine the study I would want to see. It would take organs
from donors of comparable type, randomize them to standard preservation
or to preservation with a defined carrier, and record the time in the
cold. It would measure the carrier remaining in the organ before
implantation. It would follow recipients for function of the organ,
injury markers, delayed function, complications and survival of the
graft at one year. It would report all results, positive and negative,
and it would be overseen by an independent committee.</p>
<p>It would not be a large study at first. A small, careful, transparent
study of that kind would be worth more than a dozen glowing case
reports. And it would be a study a patient community could support
without hesitation, because it asks a modest question: does adding
oxygen to the cold help?</p>
<h2 id="further-reading">Further reading</h2>
<p>The randomized trial of hypothermic machine perfusion in liver
preservation appeared in the New England Journal of Medicine in 2021,
and follow-up and review articles discuss the mechanism. The role of
succinate accumulation and reperfusion injury was described in work by
Chouchani and colleagues in 2014. The developer of a lugworm-derived
carrier has published descriptions of its preservation use. Quantitative
claims about temperature effects on metabolism and hemoglobin affinity
are approximate and should be checked in physiology references.</p>

<template id="tpl-11"><p>Nobody designs a blood substitute by looking at a Himalayan village,
and that is the first mistake. Every chemist working on hemoglobin-based
products carries an assumption so deep that it rarely gets stated: more
oxygen-carrying capacity is better. If a patient is anemic, add
hemoglobin. If tissue is starved, add hemoglobin. If the first product
fails, make a more concentrated one. The assumption feels like
arithmetic.</p>
<p>Populations who have lived for thousands of years at four thousand
meters, and animals that dive for an hour on a single breath, have been
running a much longer experiment on that assumption, and their answer is
more complicated. In several of them, evolution pushed hemoglobin
concentration down, not up. In others it pushed the storage of oxygen
out of the blood altogether. Reading their results carefully does not
give a designer a blueprint. It gives a set of warnings and a set of
questions, and I think that is the more useful thing.</p>
<h2 id="two-mountains-two-answers">Two mountains, two answers</h2>
<p>Consider two large human populations who have lived at high altitude
for a long time. The Tibetan plateau sits above four thousand meters,
and the high Andean altiplano is similar. The air at those altitudes
contains the same fraction of oxygen as at sea level, but the pressure
is roughly forty percent lower, so each breath delivers correspondingly
less. Every resident faces the same physical problem.</p>
<p>Their solutions differ. Andean highlanders tend to respond the way
lowlanders do when they climb: their bodies make more red cells, and
hemoglobin concentration rises, in some individuals to very high values.
This is an adaptation of a kind, since more hemoglobin means more oxygen
per liter of blood. Tibetans do something else. A review of the research
on hemoglobin at altitude summarizes their pattern as a relatively low
erythropoietic response with a correspondingly low hemoglobin
concentration. Tibetans living on the plateau have hemoglobin values
that are strikingly close to those of people at low elevation, or only
modestly higher.</p>
<p>If you had to bet before looking at the data, you would have bet on
the Andean strategy. It is the one a physician would recommend. The
puzzle is that the Tibetan strategy appears to work better.</p>
<h2 id="the-price-of-thick-blood">The price of thick blood</h2>
<p>The explanation begins with a property of blood that clinicians know
but rarely feel: viscosity. Blood is a suspension of cells, and as the
fraction of cells rises, the fluid thickens, slowly at first and then
steeply. Thicker blood is harder to pump, flows more sluggishly through
small vessels, and can reduce delivery to tissues even though it
contains more oxygen per milliliter.</p>
<p>The relation between cell fraction and oxygen delivery therefore has
a peak. Below the peak, adding cells helps, because capacity dominates.
Above it, adding cells hurts, because viscosity dominates. Physiologists
have estimated where the optimum falls in various circumstances, and it
is lower than most people expect, and it moves with conditions.</p>
<p>The Andean pattern can overshoot. Chronic mountain sickness is a
syndrome of excessive red cell production at altitude, and it brings
headaches, fatigue, blue lips, and an increased risk of stroke and heart
attack. The review I mentioned reports that among Peruvian Andean males
the condition can reach rates as high as 18 percent, while among
Tibetans it is around 1 percent. In other words, the population that
made the intuitively sensible response paid for it in disease, and the
population that held back did not.</p>
<p>This is not a story about one group being better than the other.
Genetic and developmental factors differ, and Andeans have other
adaptations, including changes in blood vessel function. It is a story
about the shape of a curve: there is a range where more is better, and
beyond it there is a range where more is worse. That shape is the first
instruction the mountain gives.</p>
<h2 id="the-gene-that-turned-the-dial-down">The gene that turned the
dial down</h2>
<p>The molecular story is unusually clear for a human adaptation. A gene
called EPAS1 encodes a protein known as HIF-2 alpha, a transcription
factor that helps cells respond to low oxygen, and among its targets is
the erythropoietin gene, the master regulator of red cell production.
Tibetans carry variants of EPAS1 that appear to reduce its activity. The
review states that these variants function as loss-of-function alleles
that downregulate the protein product, and that they reach a frequency
of roughly 72 percent in Tibetan populations.</p>
<p>The origin of the variant was a surprise. In 2014 researchers
reported that the Tibetan version of the gene sits within a stretch of
DNA that closely resembles the genome of Denisovans, an extinct group of
ancient humans known from a cave in Siberia. The finding suggests that a
variant useful for surviving on the plateau was inherited through
interbreeding with an archaic population and then favored by natural
selection in the mountains.</p>
<p>The ironic part is worth stating clearly. A gene variant that reduces
the body’s response to low oxygen was selected for in people living
where oxygen is scarce. That sounds paradoxical until you recognize that
the body’s response to low oxygen is a blunt instrument. Ramping up red
cell production in response to every dip in oxygen level is a strategy
that suits a short trip to altitude, and can be counterproductive over a
lifetime.</p>
<h2 id="what-else-the-tibetan-body-does">What else the Tibetan body
does</h2>
<p>If Tibetans do not compensate by adding hemoglobin, they must
compensate some other way, and the research points to several. Their
resting ventilation tends to be high, they show relatively strong oxygen
delivery through increased blood flow to certain tissues, and studies
have reported higher levels of nitric oxide in their circulation than in
lowlanders at the same altitude, which would dilate vessels and improve
flow. Some evidence suggests differences in how they use oxygen within
cells.</p>
<p>I would not lean too hard on any single item on that list; the field
is active and the picture is still being filled in. What the collective
evidence suggests is that the Tibetan strategy favors delivery through
flow and efficiency rather than through capacity. It keeps blood thin,
keeps vessels open, and makes each molecule of oxygen count.</p>
<p>For a designer of oxygen carriers, this is instructive. The tissue
does not need more hemoglobin. It needs oxygen delivered at the right
place, at the right rate, through vessels that stay open. Those are
three separate targets, and adding hemoglobin addresses only the
first.</p>
<h2 id="the-diving-animals">The diving animals</h2>
<p>Move now from mountains to the sea. A Weddell seal can dive for tens
of minutes on one breath, and some whales can dive for far longer, while
a human freediver, with training, can reach several minutes. The seals
do not have magical lungs. In fact, diving mammals often carry
relatively little oxygen in their lungs, because compressed air in the
chest is a hazard at depth. They carry it elsewhere.</p>
<p>They store oxygen in three places. First, they have unusually large
blood volume relative to body size. Second, their blood is rich in
hemoglobin, and in some seals a contracting spleen squeezes a reservoir
of packed red cells into the circulation during a dive, raising the
concentration temporarily, a mechanism that lets the animal hold thin
blood at rest and thick blood when it is needed. Third, and most
strikingly, their muscles contain very high concentrations of myoglobin,
the single-chain relative of hemoglobin that stores oxygen inside muscle
cells. Seal and whale muscle is nearly black from it.</p>
<p>The design principle is different from that of the mountain dweller.
Here the animal maximizes stored oxygen, and it does so by putting the
storage where it is used, inside the muscle, so that the oxygen does not
have to travel. The blood serves as a supplemental reservoir and a
transport line, but the emergency supply sits at the point of need.</p>
<h2 id="why-storage-matters-to-a-carrier-designer">Why storage matters
to a carrier designer</h2>
<p>Storage and transport are usually confused in discussions of oxygen
carriers, and the confusion has practical consequences.</p>
<p>A transport system moves oxygen from where it is plentiful to where
it is needed. Its value depends on flow. If flow stops, the transport
system delivers nothing, however full its carriers.</p>
<p>A storage system holds oxygen where it is needed. Its value depends
on how much it holds and how fast the tissue draws on it. If flow stops,
the store lasts until it is empty.</p>
<p>Human blood evolved as a transport system with a modest reserve. The
venous blood returning to the lungs is still about three-quarters
saturated at rest, which is a reserve, but not a large one. When flow
stops, as in a cardiac arrest or a clamped vessel, the reserve is spent
within minutes.</p>
<p>A cell-free carrier is also a transport system, and its main
potential contribution is to reach places that red cells cannot. But it
is worth asking whether there are situations in which a carrier could
act more like storage. An organ held cold on a machine is one. If the
preservation fluid holds a high dissolved oxygen content in the form of
a carrier, the tissue has a small reserve to draw on even without flow.
A tissue starved by a blockage, briefly, could use the same reserve. I
raise this not as a claim about existing products but as a conceptual
tool: when you evaluate a carrier for a particular use, ask whether the
job is transport or storage, because the answer changes what properties
matter.</p>
<h2 id="affinity-revisited-from-the-rooftop-of-the-world">Affinity,
revisited from the rooftop of the world</h2>
<p>Another lesson from altitude concerns oxygen affinity, the tightness
with which hemoglobin grips oxygen. In another post I described how the
P50 is the pressure at which hemoglobin is half saturated, and how the
tissue’s needs favor different values in different jobs.</p>
<p>Animals at altitude show the effect in a beautiful way. The
bar-headed goose migrates across the Himalayas at altitudes that would
incapacitate most birds, and its hemoglobin is reported to have a higher
oxygen affinity than that of lowland geese, a difference traced to
changes in the amino acid sequence. Llamas, adapted to the Andes, also
carry hemoglobin with higher affinity than other mammals of their size.
The logic is plain: at low pressure, a hemoglobin that grips harder
loads more completely in the lung, and the tissue still receives what it
needs because the pressure drop from lung to tissue is steep.</p>
<p>Humans at altitude do something related. A shift in the
oxygen-binding curve toward higher affinity is seen in some highland
populations and in pregnant women, and in the fetus, whose hemoglobin
has a higher affinity than an adult’s so that it can extract oxygen
across the placenta.</p>
<p>The design implication runs against the intuitions of a first-time
designer. The best affinity is not fixed; it depends on the environment.
A product intended for a patient breathing thin air in an ambulance at
altitude, or a patient with a lung problem that impairs loading, might
want a higher affinity than one intended for a patient with a normal
lung and a starved limb. There is no single right P50. The mountain
tells you that the answer depends on where you live.</p>
<h2 id="the-lesson-about-dilution">The lesson about dilution</h2>
<p>There is a further link, and it involves a therapy that emergency
physicians know well: hemodilution. When a patient loses blood and
receives fluid, the remaining red cells are diluted. The patient’s
hematocrit falls, and blood becomes thinner. It is easy to think of this
as pure harm, and if it goes too far, it is.</p>
<p>But moderate dilution improves flow through small vessels by reducing
viscosity, and the body compensates for the lower capacity by pumping
more blood. There is a range of hematocrit, lower than normal, in which
delivery is about as good as or better than at normal values. The
Tibetan pattern, seen from this angle, is a permanent version of
controlled hemodilution.</p>
<p>An oxygen carrier dissolved in plasma is a way to have it both ways.
It adds oxygen capacity without adding cells, so it raises capacity
while leaving viscosity low. In principle, it lets a patient be
thin-blooded and well-supplied. This is the deepest of the arguments for
the whole class of products, and the mountain reinforces it. The
corresponding risk is that the dissolved carrier brings its own
problems, discussed elsewhere on this site, including the scavenging of
nitric oxide, which is exactly the molecule that the Tibetan body
appears to keep at higher levels. The highlander’s physiology and the
dissolved carrier pull in opposite directions on that one variable.</p>
<h2 id="a-worked-example-of-the-peak">A worked example of the peak</h2>
<p>A small calculation makes the shape of the curve concrete. The
numbers are illustrative simplifications and should not be read as
physiological constants.</p>
<p>Suppose oxygen delivery is proportional to two things multiplied
together: the oxygen content of a liter of blood, which rises in direct
proportion to the fraction of cells, and the flow rate the heart can
sustain, which falls as viscosity rises. Take a hematocrit of forty-five
percent as the baseline, with an oxygen content of 1.0 in arbitrary
units and a flow of 1.0. At a hematocrit of thirty, the content falls to
about 0.67, but the flow rises, because thinner blood moves more easily.
If the flow improves by, say, thirty percent, the product is 0.87, a
modest loss. At sixty percent, the content rises to 1.33, but if flow
drops by forty percent because the blood has thickened badly, the
product is 0.80. Both extremes are worse than the middle.</p>
<p>The exact peak depends on the vessel, the heart and the person, so
this is only an outline. But it shows why a physician who sees a low
hemoglobin should not automatically see a problem, and why a physician
who sees a very high hemoglobin should not automatically see an
advantage.</p>
<h2 id="the-athletes-shortcut">The athlete’s shortcut</h2>
<p>The sport of endurance racing supplies a second natural experiment,
and an uncomfortable one. Athletes have long known that training at
altitude raises red cell mass, and some have used shortcuts, including
transfusion of their own stored blood and injections of erythropoietin,
to raise hematocrit further. These practices are banned in sport for
good reasons, including fairness and safety.</p>
<p>The safety story is a direct illustration of the viscosity problem.
Endurance athletes who pushed their hematocrit beyond natural limits
were reported in the 1990s to have suffered serious cardiovascular
events, and the sport introduced hematocrit limits, initially as a
health measure. The lesson is the same as the mountain’s: raising
capacity by making blood thicker has a ceiling, and exceeding it can be
lethal.</p>
<p>The athlete’s case also points at a design opportunity. If capacity
can be raised without thickening the blood, the ceiling moves. That is
precisely what a dissolved carrier promises, and precisely why the
sporting world has watched such products with anxiety. Some carriers
have appeared on lists of prohibited substances, as they were used or
considered for use in sport, and their detection is a live topic in
anti-doping laboratories. It is an unexpected reminder that the same
property that might help a bleeding patient could distort a race.</p>
<h2 id="cautions-from-the-mountain">Cautions from the mountain</h2>
<p>It would be irresponsible to end on the note that nature has shown
the way. It has shown several ways, and some of them do not
translate.</p>
<p>Populations differ from patients. A highlander’s body has been shaped
over hundreds of generations to match its environment. A patient in
shock has had minutes. Adaptation is not the same as resuscitation.</p>
<p>The observations are correlational. We see a low hemoglobin and a low
rate of chronic mountain sickness, and we infer a link, but many other
differences accompany the pattern, from diet to lung size to genetics
elsewhere in the genome. The gene story is stronger than most, because
the variant has been mapped and its effect on hemoglobin quantified, but
even here the wider consequences are still being studied.</p>
<p>Finally, extrapolating from a healthy population to a sick one is a
classic source of error. A lower hemoglobin is adaptive in a healthy
Tibetan with intact vessels and lungs. It may be dangerous in a person
with heart disease.</p>
<h2 id="what-i-would-carry-into-a-design-meeting">What I would carry
into a design meeting</h2>
<p>If I were sitting with a group of developers, I would bring four
questions from the mountain and the sea.</p>
<p>Is your target patient limited by capacity, by flow, or by loading? A
product that raises capacity does little for a patient whose problem is
a blocked vessel, and a product that improves flow does little for a
patient who is simply low on hemoglobin.</p>
<p>Where on the curve of viscosity and capacity does your patient sit? A
patient already thin-blooded may gain little from added capacity, and
one already thick-blooded, for example after a long stay at altitude or
with a blood disorder, may be harmed by it.</p>
<p>What affinity does the environment call for? A single value for all
uses is a compromise, and the compromise should be stated.</p>
<p>Are you transporting or storing? If the answer is storing, the
product might look more like myoglobin than like blood.</p>
<p>The mountains do not answer those questions. They teach how to ask
them.</p>
<h2 id="further-reading">Further reading</h2>
<p>The comparison of hemoglobin concentration across highland
populations is reviewed in a 2025 article in the American Journal of
Human Biology on adaptive hemoglobin concentration at high altitude. The
Tibetan EPAS1 variants were reported in a 2010 paper in the Proceedings
of the National Academy of Sciences, and the Denisovan-like origin of
the variant in a 2014 paper in Nature. Values quoted for disease
prevalence come from the 2025 review and vary by study and definition.
Statements about diving mammals reflect standard comparative physiology
and should be confirmed in a specialist source before use.</p>

<template id="tpl-12"><p>A hemoglobin-based carrier is a chemical solution to a physical
problem. Oxygen barely dissolves in water, so blood evolved a molecule
that binds it. Everything about the BHOC story, from the affinity curve
to the iron chemistry to the trouble with nitric oxide, follows from
that fact.</p>
<p>There is another way to carry oxygen, and it involves no binding at
all. Certain synthetic liquids, chains and rings of carbon in which
nearly every hydrogen has been replaced by fluorine, dissolve oxygen the
way a sponge soaks up water. They are called perfluorocarbons, and they
have a long and peculiar history as oxygen carriers. This essay lays out
how they work, where they fit, and what the comparison teaches about the
hemoglobin products that dominate the conversation on this site.</p>
<h2 id="the-rule-of-the-sponge">The rule of the sponge</h2>
<p>When oxygen dissolves in a liquid, the amount that dissolves is
proportional to its partial pressure. This is Henry’s law, and it is one
of the simplest relationships in physical chemistry. Double the pressure
and you double the dissolved oxygen. In ordinary plasma, the solubility
is low: at the pressure of arterial blood, a deciliter of plasma holds
only a fraction of a milliliter of dissolved oxygen.</p>
<p>A perfluorocarbon liquid dissolves far more, on the order of twenty
times more than water by the figures usually quoted, and a pure liquid
of this type can hold something like forty or fifty milliliters of
oxygen per hundred milliliters when exposed to pure oxygen at
atmospheric pressure. I offer those as rough figures from the
literature, and they vary by compound.</p>
<p>But the rule is a straight line. Hemoglobin follows an S-shaped
curve: it loads almost fully at the pressure of ordinary lung air and
then holds its oxygen tightly until the pressure falls near that of the
tissue. A perfluorocarbon does neither. It picks up oxygen in proportion
to how much is around and gives it up in proportion to how much is
missing. The consequence is the defining feature of the whole class: to
load a perfluorocarbon with a useful amount of oxygen, you need a high
oxygen pressure. The patient must breathe oxygen-enriched air or oxygen.
That is what I mean by needing a mask.</p>
<p>This is not a small caveat. It is the opposite of hemoglobin’s
design. A hemoglobin carrier can be loaded by breathing room air. A
perfluorocarbon carrier needs an oxygen supply and a delivery apparatus
in addition to the infusion, which is a logistical and clinical
complication in the very settings where a carrier is most wanted.</p>
<h2 id="turning-a-liquid-into-an-injectable">Turning a liquid into an
injectable</h2>
<p>Perfluorocarbons are hydrophobic and lipophobic, meaning they mix
with neither water nor oil. You cannot inject them as they are. Making
an intravenous product requires turning the liquid into a fine emulsion,
tiny droplets suspended in water with the help of an emulsifier. The
droplets in these products are on the order of a fifth of a micrometer
across, smaller than a red cell by a factor of about thirty.</p>
<p>That small size is what allows the droplets to travel through
capillaries, and in principle to reach tissue that red cells cannot. It
is the same rationale that motivates the hemoglobin carriers, achieved
by a different route.</p>
<p>The emulsions carry their own problems. Emulsions can be unstable,
and the early ones had to be stored frozen, and thawed before use. The
droplets are removed from the blood by cells of the reticuloendothelial
system, mainly in the liver and spleen, so the product has a half-life
measured in hours to days and leaves behind a burden of fluorinated
material that is slowly exhaled over weeks to months. Recipients of
early products commonly experienced flu-like symptoms, a reaction
thought to be related to uptake of the droplets by macrophages and the
release of inflammatory signals.</p>
<h2 id="a-product-that-reached-the-market">A product that reached the
market</h2>
<p>The most notable perfluorocarbon product was called Fluosol,
developed in Japan and approved in the United States around 1989 for use
in a specific setting: protecting heart muscle during balloon
angioplasty, when a vessel is briefly blocked. The idea was clever.
During the few minutes that a balloon was inflated in a coronary artery,
blood could not pass, but the small droplets could squeeze past the
balloon through collateral channels, and if the patient was breathing
high concentrations of oxygen, they carried a useful amount to the
starved heart tissue.</p>
<p>The product was subsequently withdrawn from the market. The reasons
were commercial and practical as well as clinical: it needed to be
stored frozen, prepared with several components before use, and required
oxygen breathing, while advances in angioplasty equipment, such as
balloons that allow blood to flow past, reduced the need for it. The
details of its commercial life deserve better sourcing than I have
gathered here, so I will keep to the shape of the story. It was
approved, it was used, and it faded.</p>
<p>A later generation of emulsions, made with a different compound and
stabilized with a phospholipid, reached late-stage clinical trials in
surgical patients. One of them, developed under the name Oxygent, was
tested in surgery to reduce the need for blood transfusion, and the
program encountered safety concerns in a trial and did not reach the
market. I mention these to make a general point about the class. A
physically elegant idea did not translate into a successful product. The
reasons were mostly practical, and practical reasons are where the field
lives.</p>
<h2 id="what-hemoglobin-has-that-the-sponge-lacks">What hemoglobin has
that the sponge lacks</h2>
<p>Set the two designs side by side and each shows what the other
lacks.</p>
<p>Hemoglobin gives a lot of oxygen capacity at low oxygen pressure. A
concentrated hemoglobin solution holds many times the oxygen of an equal
volume of plasma at ordinary arterial pressure, without needing the
patient to breathe enriched oxygen. That is the great advantage of
chemistry over physics.</p>
<p>The perfluorocarbon droplets, by contrast, hold oxygen in a way that
responds smoothly to local conditions. In the lung, when the patient
breathes oxygen, the droplets load; in the tissue, where pressure is
low, they release. Because the relationship is linear, a perfluorocarbon
delivers a large fraction of its oxygen in the tissue range, while
hemoglobin at high affinity may not. In tissue that is very low in
oxygen, the sponge gives up cargo readily.</p>
<p>The perfluorocarbon has no iron and therefore no oxidation problem.
It does not scavenge nitric oxide, so it does not cause the
vasoconstriction associated with free hemoglobin. It is not a biological
protein, so it does not raise concerns about foreign proteins or prions.
It can be stored, if the emulsion is stable, at room temperature.</p>
<p>The hemoglobin, meanwhile, has the S-curve, the ability to load in
ordinary air, a greater carrying capacity per unit volume in the
relevant pressure range, and the cooperative behavior that has been
refined over hundreds of millions of years.</p>
<p>I find the pairing instructive because it shows that the problems of
hemoglobin carriers are not properties of oxygen carrying in general.
They belong to a specific chemistry. If a patient community worries that
all oxygen carriers cause vasoconstriction, the perfluorocarbon record
is a counterexample. If it worries that all oxygen carriers require a
breathing apparatus, the hemoglobin record is a counterexample. The
properties that define a class are chemical.</p>
<h2 id="a-worked-example-of-how-little-a-sponge-carries">A worked
example of how little a sponge carries</h2>
<p>The straight-line rule can be turned into arithmetic, and the
arithmetic is sobering. The figures below are round numbers chosen for
illustration, not values for any product.</p>
<p>Start with ordinary blood. Hemoglobin at 12.5 grams per deciliter,
fully saturated, holds about 17 milliliters of oxygen per deciliter,
using the usual figure of 1.34 milliliters per gram. Plasma, by
dissolved oxygen alone, adds about 0.003 milliliters per deciliter for
each millimeter of mercury of pressure, so at an arterial pressure of
100 it adds roughly 0.3. Tissues normally extract about 5 milliliters
per deciliter on a single pass.</p>
<p>Now suppose we infuse a perfluorocarbon emulsion until it makes up a
tenth of the blood volume, and that the emulsion is 30 percent
perfluorocarbon by volume, so that 3 percent of the blood is the liquid
itself. Take a liquid that dissolves about 45 milliliters of oxygen per
100 milliliters at one atmosphere of pure oxygen. While the patient
breathes room air, with an arterial pressure near 100 millimeters of
mercury, the perfluorocarbon adds about 0.18 milliliters per deciliter.
That is smaller than the oxygen dissolved in plasma and negligible
against the 17 in hemoglobin.</p>
<p>Now let the patient breathe pure oxygen, raising arterial pressure to
about 600. The perfluorocarbon load climbs to roughly 1 milliliter per
deciliter. That is a six-fold increase, and it is meaningful for a
patient whose hemoglobin has fallen very low. But it is still a small
fraction of what healthy blood carries. The sponge does its best work
when the patient has almost no red cells left, or when the flow is so
poor that a little extra oxygen makes the difference.</p>
<p>The arithmetic explains both the appeal and the disappointment. It
shows why perfluorocarbons were tried as a bridge for patients who
refused blood, and why the amounts involved could never replace a large
hemoglobin deficit. It also shows why the concentration of the emulsion
and the volume infused mattered so much, and why doses large enough to
matter tested the limits of what patients tolerate.</p>
<h2 id="the-frozen-product-and-the-thaw">The frozen product and the
thaw</h2>
<p>There is a practical detail of the first commercial emulsion that
illustrates how much clinical adoption depends on mundane things. The
product was supplied frozen, and it had to be thawed, combined with
additional solutions, and prepared shortly before use. Hospital
pharmacists and perfusionists had to schedule the preparation around the
procedure. A drug that requires a checklist and a countdown is a drug
that is used only when someone has planned for it.</p>
<p>The comparison with a room-temperature bovine hemoglobin bag makes
the point vividly. A shelf-stable product can be grabbed and hung. It
does not depend on a pharmacy. Convenience is not a footnote in
emergency medicine. It is often the deciding factor between a product
used and a product admired.</p>
<h2 id="the-oxygen-mask-paradox">The oxygen-mask paradox</h2>
<p>Now the paradox that gives the essay its title. If a patient in shock
is already receiving high-flow oxygen through a mask, as is standard in
emergency care, then a perfluorocarbon may load in the lung and be
effective. The need for supplemental oxygen is not an extra burden in a
patient who would receive it anyway.</p>
<p>The complication arises in the field. A soldier or an accident victim
in a remote place has no oxygen cylinder, or has only a limited supply.
The very setting that argues for a room-temperature, shelf-stable
carrier, the field, is the setting where the extra requirement is
hardest to meet. And in a patient who breathes room air, the droplets
add little.</p>
<p>There is a second complication in the opposite direction. High
concentrations of oxygen are not benign. Prolonged breathing of very
high oxygen levels can injure the lungs, and it changes the balance of
reactive oxygen species in tissue. A treatment plan that depends on a
high inspired oxygen fraction inherits those risks.</p>
<p>The paradox teaches something about how to evaluate any carrier. Ask
what the carrier requires in order to work. Hemoglobin requires that the
lung function and that the iron remain reduced. Perfluorocarbons require
enriched oxygen. Encapsulated hemoglobin requires that the vesicle
remain intact. Each dependency is a potential failure point in a
particular setting.</p>
<h2 id="a-different-niche-where-oxygen-pressure-is-already-high">A
different niche: where oxygen pressure is already high</h2>
<p>The oddest and most encouraging uses of perfluorocarbons have been in
places where the mask problem does not arise, because the oxygen is
delivered directly.</p>
<p>One is organ preservation. In some preservation methods, an organ is
stored in a two-layer arrangement in which a perfluorocarbon layer at
the bottom is bubbled with oxygen and the organ, usually a pancreas,
floats at the interface, receiving oxygen by diffusion. The
perfluorocarbon acts as an oxygen reservoir, with no need for a patient
to breathe anything. This method has been studied in pancreas
preservation for islet cell isolation, and the results have been
described as encouraging in some studies and modest in others. I raise
it because it demonstrates a use in which the sponge is well suited: an
organ at low temperature and low metabolic demand, in a bath oxygenated
from outside. This is exactly the scenario described in a companion
essay on cold oxygen, and it shows that the perfluorocarbon approach
might have a natural home in preservation.</p>
<p>Another is eye surgery, where certain perfluorocarbon liquids are
used as a temporary tool to flatten a detached retina. That use has
nothing to do with oxygen carrying, and it is a reminder that these
compounds are chemically inert and safe enough for direct contact with
delicate tissue.</p>
<p>A third, more speculative, is liquid ventilation, in which the lungs
are partially filled with an oxygenated perfluorocarbon liquid. It was
tested in premature infants and adults with lung injury, and it has been
a favorite of science fiction. The clinical trials did not show the
benefit that supporters hoped for. It nonetheless shows how far the
field was willing to go.</p>
<h2 id="the-sponge-in-cold-storage">The sponge in cold storage</h2>
<p>Return to the cold. The physics of dissolved oxygen changes with
temperature, and the change favors the sponge. Gas solubility in liquids
increases as temperature falls. A perfluorocarbon at four degrees
dissolves more oxygen than at body temperature. Hemoglobin, in contrast,
grips oxygen more tightly in the cold, which makes it a poorer donor. In
the cold, then, the relative merits reverse: the sponge gets better and
the chemical carrier gets worse.</p>
<p>That observation, which follows directly from Henry’s law and the
temperature dependence of hemoglobin affinity, deserves attention from
anyone thinking about preservation products. It suggests that a
preservation fluid for an organ in the cold might do better with a
physical carrier than a chemical one, or with a mixture in which each
does the job it is best at.</p>
<p>I would go further. The most interesting design for a warm perfusion
might combine both: a bovine hemoglobin carrier for capacity at ordinary
oxygen pressures, and a perfluorocarbon component to buffer oxygen in
the microvessels. I am not aware of such a combination being tested in
the clinic, and I mention it as a question rather than a proposal.</p>
<h2 id="why-the-story-matters-to-the-patient-reader">Why the story
matters to the patient reader</h2>
<p>There are three points to take away for a patient audience.</p>
<p>First, oxygen carrying is not synonymous with hemoglobin. When
someone says a BHOC is the only way to carry oxygen without red cells,
they are wrong, and the history of perfluorocarbons is the proof. That
matters because it places the BHOC in a competitive landscape. An honest
advocate says which of the alternatives it is meant to beat, and on
what.</p>
<p>Second, the history is a lesson in the difference between physical
elegance and clinical success. Perfluorocarbons had beautiful physics
and an ugly logistics profile. Hemoglobin has an ugly set of side
reactions and a beautiful mechanism. Neither won. A patient community
that understands both stories is less likely to be dazzled by a single
clever property.</p>
<p>Third, it shows how much depends on the setting of use. Every one of
the perfluorocarbon successes was a niche with special conditions: a
balloon in a coronary artery, a bath for a pancreas, an eye. The
general-purpose blood substitute remains unsolved. This does not mean
that niche uses are failures. On the contrary, they may be the only path
by which a technology reaches patients at all. A BHOC that finds a
defensible niche, whether organ preservation, patients who cannot
receive blood, or remote care, stands a better chance than one that aims
at replacing blood.</p>
<p>One more observation belongs here, because it is easy to miss. The
perfluorocarbon record is a reminder that regulators and clinicians
judge a product by the whole system it lives in: the frozen box, the
thaw, the oxygen tank, the mask, the monitoring. A carrier that is
chemically brilliant and operationally clumsy loses to one that is
chemically ordinary and operationally easy. That is worth remembering
when the BHOC story is told in terms of molecules alone. The molecule is
one part of the product. The bag, the label, the storage temperature and
the training of the person who hangs it are the rest.</p>
<h2 id="questions-to-ask-about-any-carrier">Questions to ask about any
carrier</h2>
<p>Borrowing from the comparison, I would suggest a short list for any
product.</p>
<p>What does the patient have to breathe, and what does the site need to
supply?</p>
<p>What is the carrier’s half-life, and what happens to it when it
leaves the circulation?</p>
<p>What is the physical form: a solution, an emulsion, a particle, and
how stable is it on the shelf?</p>
<p>What does the product do to the tissues that clear it, since every
carrier is cleared by something?</p>
<p>And what is the honest niche, the place where the property that
limits the product is not limiting?</p>
<p>Those are ordinary engineering questions, and the perfluorocarbon
field, for all its disappointments, taught the community to ask
them.</p>
<h2 id="further-reading">Further reading</h2>
<p>Reviews of perfluorocarbon-based oxygen carriers, including a 2010
review of products and trials and a review that traces the field from
physics to physiology, describe oxygen solubility, emulsion properties
and clinical experience in detail. Figures for solubility, droplet size
and half-life vary by compound and formulation and are quoted here as
rough orders of magnitude. The history of Fluosol’s approval and
withdrawal and of the Oxygent trial deserves confirmation in primary
sources before it is repeated.</p>

<template id="tpl-13"><p>Every hemoglobin-based oxygen carrier that has reached a clinic is a
bare protein. Whether the protein is cross-linked, polymerized, or
wrapped in polymer chains, it floats free in plasma with nothing between
it and the vessel wall. That design carries the direct exposure that
produced the troubles of the class, and a persistent minority of
researchers has argued that the way forward is to take a step back: put
the hemoglobin in a package again.</p>
<p>A red cell is not a bag of hemoglobin. It is a machine. A membrane
keeps the protein in and the plasma out, a set of enzymes keeps the iron
reduced, a bath of small molecules tunes oxygen affinity, and a flexible
skeleton lets the whole thing fold through a capillary narrower than
itself. Recreating any of that outside the body is difficult. Three
programs, each aiming at a different piece of the machine, have advanced
far enough to teach us something. This essay describes them, and it puts
them beside the bovine polymers to ask a fair question: what is a
packaged carrier for?</p>
<h2 id="the-case-for-a-membrane">The case for a membrane</h2>
<p>Start with the logic of the package, because it is the same logic
that evolution followed. A membrane does four jobs for a red cell.</p>
<p>It keeps hemoglobin away from the vessel wall. Free hemoglobin
scavenges nitric oxide, a gas the wall uses as a relaxing signal. A cell
keeps the scavenger inside, at a distance.</p>
<p>It keeps hemoglobin away from the kidney. A protein small enough to
leak through the filter is lost, and can be toxic there. A package that
is much larger than the filter’s pores cannot leak.</p>
<p>It supports a chemical environment. Inside a cell, enzymes and small
molecules keep iron in the working form and regulate affinity. Inside a
synthetic package, at least some of those functions can be included by
adding the right compounds.</p>
<p>And it controls the concentration. A packaged carrier can hold
hemoglobin at the same high concentration as a red cell, so the oxygen
capacity per particle is large, while the fluid in which it travels
stays thin.</p>
<p>These are real advantages. They have to be weighed against the costs
of a package: it must be made, it must be stable, and it must not
trigger the immune system or clog the very vessels it hopes to
reach.</p>
<h2 id="program-one-the-hemoglobin-vesicle">Program one: the hemoglobin
vesicle</h2>
<p>The most advanced packaged carrier is the hemoglobin vesicle,
developed over decades by research groups in Japan. It consists of a
highly concentrated hemoglobin solution enclosed in a bilayer of
phospholipids, the same class of molecule that forms a cell membrane.
The particles are small spheres about a quarter of a micrometer across,
roughly thirty times smaller than a red cell. The surface is decorated
with polyethylene glycol to reduce recognition by the immune system and
to prevent the particles from sticking to one another.</p>
<p>The hemoglobin inside is purified from outdated donated human red
cells, and the vesicles are formulated with additional compounds that
mimic the small-molecule environment of a cell, including a molecule to
tune oxygen affinity and reducing agents to protect the iron. The
developers have reported that the product can be stored for long
periods, and have described it as a candidate for emergency use where
blood is unavailable. A first-in-human phase 1 trial was published in
2022 in a hematology journal. It enrolled a small group of healthy
volunteers, gave them single doses, and reported on safety and
tolerability. I have not been able to confirm its detailed results, and
I would treat any claim about its performance in patients as
unproven.</p>
<p>The design has a few clear attractions. It is built from human
hemoglobin and lipids, so it introduces no animal proteins. The particle
size is well above the range that escapes the kidney. The iron is
protected inside a packaged environment. And its behavior in animals has
been extensively studied, including the observation, reported in
rodents, that injection did not cause the anaphylactic reactions that
some lipid-based particles are known to provoke.</p>
<p>The design has clear drawbacks too. The raw material is human blood,
so it depends on the same donor supply it hopes to supplement, although
it is made from expired units that would otherwise be discarded. Lipid
particles are cleared by the reticuloendothelial system, the same
scavenger cells that take up perfluorocarbon emulsions, and this
clearance limits the half-life and raises questions about long-term
effects on those cells. And manufacturing a uniform lipid particle at
scale is a specialized process.</p>
<h2 id="program-two-synthetic-cells-from-the-ground-up">Program two:
synthetic cells from the ground up</h2>
<p>A second approach attempts to build the package from synthetic
materials, with no cells and no donor blood in the loop. One design in
this family uses hemoglobin held in a nanoparticle with a polymer shell,
together with molecules that mimic the enzymes and affinity regulators
of the red cell, and a formulation that can be freeze-dried into a
powder. The stated goal is a product that can be stored at room
temperature and reconstituted with water in the field.</p>
<p>I want to be very careful about how I describe this. It is a research
program from a small number of laboratories, with published animal data
and a strong narrative but no completed large human trial that I could
verify. I mention it because it shows the direction in which the idea is
being pushed: from a natural package to an engineered one, with each
function of the red cell replaced by a designed component. The appeal is
obvious. If a synthetic package works, it removes the dependence on
blood entirely. The uncertainty is equally obvious. Each added component
adds an interaction to be tested, and complex particles have a history
of surprising behavior in the body.</p>
<p>Here is a way to think about the difference between the two programs.
The vesicle is a conservative design: it keeps nature’s blueprint, the
phospholipid bilayer, and works to stabilize it. The synthetic
nanoparticle is a radical design: it keeps the function and replaces the
structure. Conservative designs tend to fail slowly and modestly.
Radical designs tend to succeed dramatically or fail quietly. Neither
can be judged in advance.</p>
<h2 id="program-three-growing-the-real-thing">Program three: growing the
real thing</h2>
<p>The third approach avoids substitutes entirely. Instead of building a
package, grow a genuine red cell in the laboratory. Blood stem cells,
taken from donors, can be coaxed in culture to mature into red cells,
which are then harvested and transfused.</p>
<p>A study in the United Kingdom took this beyond the bench. In a trial
conducted in the early 2020s, healthy volunteers received small volumes
of laboratory-grown red cells that had been tagged so their survival
could be measured against the volunteers’ own cells. The aim was not
therapy but a demonstration that the cells could circulate and survive
in a human. Reports described it as the first trial of its kind in the
world, and the results were being analyzed at the time I gathered this
material. I cannot give a verified account of the findings, and I will
not guess.</p>
<p>The theoretical attraction is immense. A cultured cell has the
membrane, the enzymes, the affinity regulation and the flexibility,
because it is a red cell. If cultured cells could be made in volume,
they could supply patients whose blood types are rare or who have
developed antibodies against common types, a group for whom compatible
blood is hard to find.</p>
<p>The practical obstacle is scale and cost. A single unit of red cells
contains on the order of a trillion cells. Producing that number in
culture, with the nutrients and growth factors required, and doing so
sterilely and reproducibly, is orders of magnitude beyond what current
laboratory methods deliver. The realistic near-term use is small-volume,
high-value: rare-type patients, not trauma. For emergency oxygen, a
cultured cell is not a competitor to a shelf-stable bag. It is a
complementary tool for a different job.</p>
<h2 id="the-arithmetic-of-a-trillion-cells">The arithmetic of a trillion
cells</h2>
<p>Scale deserves a worked example, because it is the point at which
many elegant ideas quietly die. The numbers here are round figures for
illustration.</p>
<p>A unit of donated red cells, roughly 300 milliliters, contains on the
order of two trillion cells. A single bleeding adult may need several
units, so the raw count for one patient runs to ten trillion or more.
Now suppose a culture system can expand one starting stem cell into a
hundred thousand mature red cells, a generous assumption. To make one
unit, you would need twenty million starting cells. To make a hundred
units, two billion. Those are numbers a bioreactor can handle in
principle, but each of those cells needs weeks of nutrients, growth
factors and sterile handling, and the cost of the growth factors alone
can run into thousands of dollars per unit at laboratory prices.</p>
<p>The point is not that the arithmetic makes the idea impossible. It is
that it sorts applications by value. A unit that costs thousands of
dollars to grow makes sense for a patient with a rare blood type who
would otherwise go untreated. It makes no sense for a trauma patient who
needs six units in an hour. That is why I placed cultured cells beside
the shelf-stable carriers as a complement and not a competitor.</p>
<p>The same reasoning applies to vesicles and synthetic particles, in a
different form. Their cost is not in growth factors but in purified
hemoglobin, in lipids of pharmaceutical grade, and in the yield of a
multi-step manufacturing process. A packaged carrier that costs many
times as much as a bare polymer per gram of hemoglobin has to earn the
difference through a benefit that patients and payers can see.</p>
<h2 id="what-an-animal-study-cannot-tell-you-about-a-package">What an
animal study cannot tell you about a package</h2>
<p>Packaged carriers pose a particular challenge for preclinical
testing. The reason is that many of their problems depend on the immune
system and on the cells that clear particles, and these differ between
species.</p>
<p>Consider complement activation. Some lipid and polymer particles
trigger a chain of proteins in the blood that can cause flushing, chest
tightness, breathing difficulty and a drop in blood pressure within
minutes of the first infusion. The reaction does not require prior
exposure, and it does not involve the antibodies of classical allergy.
Its strength varies enormously among species. Pigs are notoriously
sensitive, and rodents are far less so. A finding of no reaction in mice
is therefore reassuring only up to a point.</p>
<p>Consider clearance. The scavenger cells that take up particles are
more or less abundant in different species, and their capacity to handle
repeated doses is uncertain. A single injection in a rodent cannot tell
you what a series of injections in a person will do.</p>
<p>Consider size and shape. A particle that passes easily through a
rodent capillary may behave differently in a human vessel, and rigid
particles may be filtered by the lung.</p>
<p>The upshot is that the first human doses are a genuinely informative
experiment, more so than for a simple protein, and the design of that
experiment deserves care: small starting doses, slow infusion,
monitoring of complement markers and of inflammatory signals, and staged
escalation.</p>
<h2 id="the-ethics-of-the-first-vial">The ethics of the first vial</h2>
<p>The mention of healthy volunteers in the vesicle and cultured cell
trials invites a question worth asking. Why test an emergency product in
people who are not in an emergency?</p>
<p>The reason is safety. Before a carrier is given to a critically ill
patient, in whom side effects are hard to separate from the disease, it
is given to healthy people so that its effects can be seen cleanly. This
is standard practice for new drugs. But an oxygen carrier is a
particular case, because its most likely side effects, changes in blood
pressure, in organ function and in laboratory tests, are exactly the
ones that a healthy volunteer will experience without benefit.</p>
<p>The ethics therefore turn on transparency and on choosing an
appropriate dose. Volunteers must be told clearly that they will receive
an unapproved product, that it will not help them, and that measurements
will be taken to look for harm. The doses should be low enough to make
serious injury very unlikely and high enough to be informative. Some
carriers turn the urine or plasma a strange color, and volunteers should
be prepared for that. And follow-up should last long enough to catch
delayed effects, particularly for products that are cleared slowly by
scavenger cells.</p>
<p>There is a further consideration that applies to patient advocacy.
When a foundation supports a trial, it should ask who is being enrolled,
how they are paid, and whether the payment is proportionate. A volunteer
trial that recruits from vulnerable groups because they need money is
ethically different from one that recruits broadly, and the difference
shows up in the quality of the consent.</p>
<h2 id="what-each-package-does-to-the-hemoglobin-problem">What each
package does to the hemoglobin problem</h2>
<p>It helps to line the three programs up beside a bovine polymer, on
the problems that the whole field cares about.</p>
<p>On nitric oxide scavenging, the package helps: a membrane keeps the
protein away from the wall. The polymer relies on size and chemistry to
reduce the effect, and only partly succeeds. The cultured cell solves it
completely.</p>
<p>On kidney leakage, all the packaged particles are large enough to
avoid filtration. The polymer manages by raising its average size, with
the small end of the distribution as a lingering risk.</p>
<p>On iron oxidation, the package can carry protective enzymes and
reducing agents. The polymer is exposed and depends on the manufacturing
chemistry and on storage conditions.</p>
<p>On immune recognition, the vesicle and the nanoparticle use
polyethylene glycol to reduce it, while the bovine polymer relies on the
protein’s chemistry and on the fact that hemoglobin is a familiar
molecule. The cultured cell is the most natural but requires blood group
matching.</p>
<p>On shelf life and convenience, the vesicle and the freeze-dried
nanoparticle aim at room temperature. The polymer already achieves it.
The cultured cell is the least convenient.</p>
<p>On maturity, the polymer leads by decades of human data. The vesicle
is at the start of human testing. The nanoparticle and the cultured cell
are earlier still.</p>
<p>That last line is the crux. The bare polymer is the least elegant
design and the most tested one. It has been given to thousands of
patients, manufactured at scale, sold in three markets, and used in
emergencies. The elegant packages have not.</p>
<h2 id="why-the-bovine-polymer-still-matters">Why the bovine polymer
still matters</h2>
<p>I want to resist the temptation to conclude that a package is simply
better. It may prove to be, in the long run. But a patient reading this
in the near term should recognize two things.</p>
<p>First, the packaged carriers inherit a new set of problems, which are
not zero. The immune system is especially wary of lipid and polymer
particles, and there is a known reaction to some such particles, in
which complement activation produces a sudden, sometimes dangerous
response on first exposure. Animal studies with hemoglobin vesicles have
found no anaphylactic reactions in rodents, which is encouraging but
does not settle the question in humans. The reticuloendothelial system
may be burdened by repeated doses of particles. The long-term fate of
the lipids is not fully described.</p>
<p>Second, the timeline is different. A bovine polymer exists. It can be
manufactured today and was administered to patients on a compassionate
basis. A packaged carrier is a development program whose completion is
measured in years. For a patient who needs an option now, the difference
is decisive.</p>
<p>There is a reasonable middle view. The bare polymer may be the
bridge. It occupies the space until something better arrives, and the
experience gained with it, in manufacturing, in regulation, in trial
design, in measurement, in the ethics of emergency access, will be
inherited by whatever succeeds it. Every technology in this essay will
draw on the path that the polymer cleared, or failed to clear.</p>
<h2 id="what-to-watch">What to watch</h2>
<p>For a reader who wants to follow this field with a critical eye, here
are the markers I would track.</p>
<p>For the vesicle: results of larger human trials, data on repeat
dosing, and the identity of a manufacturer with the capacity to produce
at scale.</p>
<p>For the synthetic nanoparticle: published human data of any kind, and
independent replication of the animal results.</p>
<p>For cultured cells: the yield per donor cell, the cost per unit, and
the number of patients treated outside a trial.</p>
<p>For the polymer: the outcome of any new trial, the continuity of
manufacturing and the pattern of adverse events in expanded access.</p>
<p>None of these will arrive quickly. All of them will be visible in the
public record if someone is paying attention.</p>
<h2 id="closing-thought">Closing thought</h2>
<p>Evolution solved the oxygen problem by putting hemoglobin in a cell,
and most of what has gone wrong in the history of oxygen carriers can be
read as the consequences of taking it out. The three programs here
attempt to put it back in some form. It is entirely possible that the
future of the field lies in a package, and equally possible that the
bare polymer, refined and used in the right niche, will serve for
decades. The prudent position for patients is to support the science
that tests both, and to insist that each be judged on the same terms:
what it does, in whom, compared with what.</p>
<h2 id="further-reading">Further reading</h2>
<p>The hemoglobin vesicle work is described in reviews by its
developers, including a 2022 article on storable, ready-to-use
artificial red blood cells for emergency medicine and a first-in-human
phase 1 report in Blood Advances the same year. A study of hemoglobin
vesicle injection in rodents reported an absence of anaphylactic
reactions. Programs on synthetic and cultured red cells are described in
the recent literature and in press releases from the research groups
involved. Claims about progress in these programs should be checked
against primary publications, since I have not verified trial results
for any of the three.</p>
