<template id="tpl-14"><p>There is a sentence in the press materials of nearly every company
that has tried to sell a bovine hemoglobin oxygen carrier: it is
approved in such-and-such a country. The sentence is true. It is also
one of the most misunderstood facts in the field, because an approval is
not a universal certificate of quality. It is a decision made by one
regulator, under one set of rules, on one body of evidence, for one
specified use, at one moment in time.</p>
<p>This essay is about that map. It describes how approval, restriction
and exceptional access differ, what the pattern for BHOC products
actually looks like, and how a patient community should read a claim of
approval elsewhere. I will try to be careful about what I can and cannot
confirm, because the details vary with the source and this is a subject
on which loose language does real harm.</p>
<h2 id="what-an-approval-is">What an approval is</h2>
<p>An approval is a regulator’s judgment that a product’s benefits
outweigh its risks for a defined population under defined conditions.
Each part of that sentence hides a variable.</p>
<p>The judgment depends on the evidence submitted. A regulator in a
small market may accept data from trials done elsewhere, may require
local studies, or may weigh a company’s dossier differently from a
regulator in a large market with a long history of assessing similar
products.</p>
<p>The benefit-risk balance depends on what alternatives exist. A
product that would be marginal where safe blood is plentiful may be
valuable where it is scarce. Regulators in different countries face
different alternatives, and they legitimately reach different
conclusions.</p>
<p>The defined population and conditions matter enormously. An approval
to treat anemia in adult surgical patients does not authorize use in
trauma, in children, or in pregnancy. The label is a fence.</p>
<p>And an approval is a snapshot. It can be revised, restricted or
withdrawn. It says nothing about how the product has fared since.</p>
<p>When a reader sees the phrase approved in a country, each of those
questions is still open.</p>
<h2 id="the-record-for-the-bovine-products">The record for the bovine
products</h2>
<p>Here is what I can state with reasonable confidence, drawing on a
company’s own description and on published histories, and flagging where
these sources differ.</p>
<p>The veterinary product, Oxyglobin, was approved in the United States
and Europe in the late 1990s, and its current owner describes it as
approved for over twenty years, with more than 240,000 units sold and
off-label use in about thirty species. That is a company statement, not
an independent audit, but it is consistent with the general history.</p>
<p>The human product, Hemopure, was approved in South Africa in 2001 for
the treatment of acute anemia in adult surgical patients. That approval
is reported consistently across sources. It was also approved in the
Russian Federation. The company’s website gives the year as 2010 and
describes the indication as acute, all-cause anemia. A published
historical review states the same approval without giving a year, and
one encyclopedic source reports the approval in a slightly different
way. I mention the discrepancy because it illustrates a point: even the
basic facts of approval are recounted with variations, and a careful
writer should cite the regulator’s own record, which I have not
seen.</p>
<p>In the United States, Hemopure has never been approved for human use.
The Food and Drug Administration placed a hold on a proposed trauma
trial in 2003 and did not approve an application for orthopedic surgery
that year. Since then the product has been available under the agency’s
expanded access mechanism, used to treat patients with life-threatening
anemia who cannot receive blood. A registered expanded access protocol
exists for that purpose.</p>
<p>I am not aware of any approval of a bovine hemoglobin carrier for
human use in the European Union, though I would not be surprised to
learn of specific national authorizations or named-patient arrangements,
and I have not searched for them exhaustively.</p>
<p>Two features of this map stand out. It is small: two countries, one
indication. And it was not built through the largest, most demanding
regulators. That does not make the approvals meaningless. It means they
carry a particular kind of evidence.</p>
<h2 id="why-small-market-approvals-happen">Why small-market approvals
happen</h2>
<p>There are several reasons a company might pursue approval in a
smaller market first, and none of them is sinister.</p>
<p>The regulatory path can be shorter and cheaper. A company running
short of money has a strong incentive to reach any market where it can
start to earn revenue and gather data.</p>
<p>The need can be greater. In a country with a limited blood supply and
a high burden of trauma or of diseases that cause anemia, the argument
for an alternative is stronger, and a regulator can reasonably weigh it
that way. South Africa, with both a high rate of trauma and constraints
on blood availability, is a plausible example, although I would want to
see the regulator’s own reasoning before saying so.</p>
<p>Some regulators have procedures for products that meet an unmet need,
allowing conditional or provisional authorization on less complete
evidence than the largest agencies require, with post-marketing
obligations to gather more.</p>
<p>A first approval can provide a base for further trials. The product
can be used in a real health system, adverse events can be recorded, and
a supply chain can be tested. In principle, that is valuable. In
practice, the value depends on whether the data are actually collected
and published.</p>
<h2
id="what-an-approval-elsewhere-does-and-does-not-tell-a-regulator-here">What
an approval elsewhere does and does not tell a regulator here</h2>
<p>A frequent question from patient groups is why the United States does
not simply accept an approval from another country. The answer is that a
regulator’s obligations are to its own population and its own
standards.</p>
<p>An approval abroad is a piece of evidence. It shows that another
agency reviewed the product and found the benefits to outweigh the risks
in its context. If the reviewing agency is rigorous, and the data are
complete, and the trial population resembles the domestic one, the
approval carries weight. American law permits foreign clinical data to
support an application under certain conditions, principally that the
data come from well-conducted studies and apply to the American
population.</p>
<p>But the approval is not a substitute for the application. The
regulator here will ask about the same issues it would ask about any
product: the quality of the manufacturing, the completeness of the
safety database, the adequacy of the trials, and above all the
comparison with the standard of care. If the standard of care in the
reviewing country differs from the standard here, the comparison may not
transfer.</p>
<p>There is also history. The class of products has a record that
includes trials with excess deaths and a pooled analysis that raised
alarms. A regulator looking at a new application inherits that memory
and will look harder at the data than for a product from a class with a
cleaner history. This is prudent, not vindictive.</p>
<h2 id="the-exceptional-routes">The exceptional routes</h2>
<p>Between approval and prohibition lies a range of exceptional access
mechanisms, and understanding them is essential for a patient community,
because most people who receive an unapproved oxygen carrier do so
through one of them.</p>
<p>In the United States the agency’s expanded access framework,
sometimes called compassionate use, permits a patient with a serious or
life-threatening condition, and no satisfactory alternative, to receive
an investigational product outside a clinical trial. There are several
forms. An individual patient request is made by a treating physician,
who obtains the manufacturer’s agreement to supply the product and
submits a request to the agency. In a true emergency the agency can
authorize use by telephone and the paperwork follows. Larger forms cover
intermediate-size groups of patients and broader treatment
protocols.</p>
<p>Each form requires the agreement of several parties: the manufacturer
must be willing to supply, the physician must be willing to take on the
responsibility of oversight, the hospital’s ethics committee generally
must review, and the patient or a surrogate must consent. Any of them
can say no, and the product is not owed to anyone.</p>
<p>Other countries have their own arrangements, with names like
named-patient supply, special access and authorization for unlicensed
medicines. Their rules differ in what they require and how fast they
move. In some, a physician can import a product for a single patient
with relatively light paperwork. In others, the process is closer to a
formal application.</p>
<p>From a patient’s point of view, the key features of these routes are
speed, cost and certainty. They can be fast, but only if everyone
involved knows what to do. They can be expensive, because the
manufacturer may charge and the hospital may bear administrative costs.
And they are uncertain, because the answer is discretionary.</p>
<h2 id="the-evidence-problem-in-exceptional-use">The evidence problem in
exceptional use</h2>
<p>Here is the difficulty that connects the map back to the science. The
more a product is used through exceptional routes, the less it is
studied.</p>
<p>Expanded access is not designed to generate evidence. Patients are
not randomized, outcomes are not standardized, follow-up is uneven, and
reporting is voluntary. A collection of case reports, however moving,
cannot show that a product works. Patients who receive the product are,
by definition, in desperate circumstances, and some will die whatever is
given. Others will survive for reasons that have nothing to do with the
treatment.</p>
<p>A registry that recorded each case in a common format would make the
record more useful. It would specify what was collected, in whom, and
how outcomes were defined, and it would be reported in aggregate. The
FDA has encouraged data collection from expanded access, and companies
sometimes publish series of cases, but the result is a scatter rather
than a dataset.</p>
<p>I raise this as a reason for patient groups to think of exceptional
access as a responsibility as well as a right. A group that helps a
patient obtain a product under expanded access might also help ensure
that the case is recorded, with consent, in a way that can be pooled
with others.</p>
<h2 id="the-trial-that-crosses-a-border">The trial that crosses a
border</h2>
<p>One event in the recent record shows how the map can be used
constructively. A press release announced that a trauma trial in the
prehospital setting would be sponsored by the United States Department
of Defense and coordinated by Stellenbosch University in South Africa,
evaluating a bovine hemoglobin carrier. The arrangement is instructive
on its face: an American funder interested in military applications, a
South African academic center with experience in trauma care and a
product already approved there, and a trial design that could produce
data relevant to both.</p>
<p>I have not found a completed report of that trial in the sources I
could reach, and I will not describe results I cannot cite. What I can
say is that the structure of it is sensible. An approved product in one
jurisdiction can be tested under the local approval, in a setting with a
genuine need, generating data that might eventually support an
application elsewhere. It is a model that other programs could follow,
and one a patient organization could encourage.</p>
<h2 id="a-note-on-language">A note on language</h2>
<p>Words on this map are slippery, and patient communications should be
exact.</p>
<p>Approved should be followed by a country, an indication, and a year,
and by the source of the statement. Available under expanded access
should not be shortened to available. Used in South Africa should not be
turned into proven safe. Studied in a Department of Defense trial should
not be translated into endorsed by the military.</p>
<p>When a company says a product has been used in many patients, ask how
many, in what setting, under what protocol and with what follow-up.
Numbers without denominators and without outcomes are not evidence.</p>
<p>And when a sentence begins with the phrase the FDA has not approved,
it is worth completing it with what the FDA has actually done: held a
trial, declined an application, or permitted use under expanded access.
Each of those is a different fact.</p>
<h2 id="what-a-good-map-would-show">What a good map would show</h2>
<p>If I were drawing the ideal map for the community, it would have six
columns for each product and each country: the regulator’s name, the
year, the indication, the legal status, the type of evidence relied on,
and a link to the regulator’s own document. It would be maintained by
someone with no stake in the outcome. It would state what is
unknown.</p>
<p>Such a map does not exist in one place. Building it would be a
service to patients, clinicians and journalists alike, and it is well
within the capacity of an advocacy organization with the patience to
read regulatory records. It would also protect the community against a
common failure of the field, which is repeating a favorable sentence
until it becomes a belief.</p>
<h2 id="what-is-inside-a-dossier">What is inside a dossier</h2>
<p>It helps to picture what a regulator actually reads, because the word
approval compresses a mountain of paper into one syllable. A submission
for a biologic product typically has four large parts.</p>
<p>The first covers quality and manufacturing. It describes the source
material, the herd or the donor pool, the steps of the process, the
tests done on every batch, the limits set for impurities, and the
evidence that the process is consistent from one batch to the next. For
a bovine product this is where the animal-health documentation lives,
and where the viral and prion clearance studies described in another
post are submitted. Many products that are scientifically interesting
founder here, because a process that works in a laboratory must be shown
to work the same way every time at scale.</p>
<p>The second part is nonclinical: studies in animals and in the
laboratory that show what the product does, how long it lasts, which
organs it reaches, and what happens at doses well above the intended
one. Regulators look especially at the kidney, the heart and the vessels
for a hemoglobin product, given the history.</p>
<p>The third is the clinical section, the trials in people. For a
product aimed at emergencies it is rarely as tidy as for a drug taken
daily for a chronic condition. Trials may be small, may enroll a mixture
of patients, and may use comparators that reflect local practice.</p>
<p>The fourth is the proposed labeling and the plan for monitoring after
approval: what the leaflet will say, who may use the product, and what
data the company promises to collect once it is on the market.</p>
<p>Each part can pass or fail on its own. A company can have persuasive
clinical data and be refused because its manufacturing was inconsistent.
It can have clean manufacturing and be refused because the trials could
not distinguish benefit from chance. When a regulator says no, the
reason can be found in the response letter, and a patient advocate who
reads it learns more about the state of the product than from any press
release.</p>
<h2 id="a-checklist-for-reading-a-claim-of-approval">A checklist for
reading a claim of approval</h2>
<p>Suppose you receive a message, a brochure or a news story that says a
product is approved somewhere. Here are the questions I would ask, in
order.</p>
<p>Who approved it? The name of the regulator, not just the country.
Some agencies issue approvals that other authorities regard as thorough.
Others act more quickly on less.</p>
<p>For what? The indication as written on the label, in the label’s own
words. Anemia in surgery, anemia from any cause and trauma are different
claims.</p>
<p>For whom? Adults or children, hospital or field, with or without
blood available.</p>
<p>When? A decade-old approval may predate newer information, and an
approval can be quietly allowed to lapse when a company stops supplying
a market.</p>
<p>On what evidence? Randomized trials, uncontrolled series, or a
decision based on prior approval elsewhere.</p>
<p>With what conditions? Some approvals come with obligations to run
further studies. Did the studies happen?</p>
<p>Is it actually available? A product may be approved and yet not be
manufactured, not be stocked, or not be affordable. Approved on paper
and available in a hospital are two separate states.</p>
<p>What has happened since? Have there been safety communications,
restrictions or withdrawals?</p>
<p>None of these questions requires expertise. Each one converts a
comforting phrase into a set of specifics, and the specifics either hold
up or they do not.</p>
<h2 id="why-fragmentation-costs-patients">Why fragmentation costs
patients</h2>
<p>I want to end the substantive part of this essay on a practical
worry. A fragmented map has a cost that falls on patients and that no
single regulator is responsible for.</p>
<p>When each country decides independently, developers must repeat work.
Trials are designed to satisfy different agencies, files are prepared in
different formats, and small companies exhaust their resources on
parallel submissions. In a field already short of capital, duplication
is lethal.</p>
<p>Regulators in different countries do have mechanisms to cooperate,
including shared inspections, mutual reliance on each other’s reviews in
some circumstances, and international guidelines for the content of
dossiers. These tend to work best among large, well-resourced agencies,
and less well for the small markets where a niche product might first be
approved.</p>
<p>A patient organization cannot rewrite these systems. It can help in
two ways. It can push for common data standards, so that the outcome of
an emergency use in one country can be read in another. And it can
support trials whose designs are acceptable to more than one regulator,
so that a single study can serve several applications. Neither of these
is glamorous. Both would reduce the number of patients who wait while
paperwork repeats itself.</p>
<h2 id="closing">Closing</h2>
<p>Approval is a door, not a verdict. A product that has passed through
one door has not thereby passed through all of them, and a product that
has not passed through the largest one has not thereby failed. The fair
way to read the map is as a set of partial answers to the same
underlying question, asked by different people with different
stakes.</p>

<template id="tpl-15"><p>A foundation that campaigns for a medical technology holds a strange
kind of power. It does not make the product, it does not regulate it,
and it does not prescribe it. What it does is shape the sentences that
patients, families, clinicians and legislators repeat to one another.
Those sentences travel further than any trial report. They decide who
becomes curious, who becomes frightened, and who decides the topic is
not worth a phone call.</p>
<p>This essay is about the craft of those sentences. It is aimed at
anyone writing about BHOC for a general audience: advocates, volunteers,
journalists and the patients who post about it. It is practical, and it
makes an argument that some readers will find uncomfortable: that the
most effective way to advance a promising but unproven technology is to
be visibly, boringly, consistently honest about what is not yet
known.</p>
<h2 id="why-the-words-matter-more-here-than-usual">Why the words matter
more here than usual</h2>
<p>Three features of the BHOC field raise the stakes of language.</p>
<p>First, the history is bad. Products in this class have been
associated with harm in trials, and a pooled analysis in 2008 combined
sixteen trials of several products and found a higher risk of death and
of heart attack in treated patients. Any reader who has heard about that
history arrives with suspicion. Careless enthusiasm confirms the
suspicion.</p>
<p>Second, the audience is vulnerable. People who search for an oxygen
carrier are often people or families in trouble: someone who cannot
receive blood, someone in a long illness, someone frightened. They are
inclined to hear hope in any sentence that offers it. That inclination
puts a moral duty on the writer.</p>
<p>Third, the science is subtle. Terms like oxygen affinity, cell-free
hemoglobin and vasoconstriction have precise meanings, and their casual
use creates false impressions. A word like artificial blood, for
instance, suggests a complete replacement for something that a bovine
hemoglobin solution is not.</p>
<h2 id="the-three-tier-rule">The three-tier rule</h2>
<p>The simplest tool I know for honest communication is to sort every
claim into one of three tiers and to mark the tier in the sentence.</p>
<p>Tier one is what is established. Things that have been measured, in
humans, reproducibly, and reported in the peer-reviewed literature. For
example: a bovine hemoglobin carrier has been approved for anemic dogs,
and has been approved for human surgical anemia in South Africa. Those
are facts with sources.</p>
<p>Tier two is what is plausible. Claims that follow from mechanism or
from animal data or from small studies, and that have not been confirmed
in humans. For example: a cell-free carrier might reach tissue that red
cells cannot when a vessel is narrowed. It is a reasonable hypothesis,
supported by physiology and by experiments, and it is not proven as a
clinical benefit.</p>
<p>Tier three is what is hoped. Aspirations about what the technology
might one day do. For example: a shelf-stable carrier might someday
allow emergency oxygen delivery in remote places. That is a goal, and it
should be written as one.</p>
<p>The rule is that no sentence may present a tier-two or tier-three
claim in the grammar of a tier-one claim. The words that carry the tier
are small: is, may, might, has been shown, is hoped. Their precision is
the whole point. A page that swaps them casually, turning may into does,
has crossed from advocacy into promotion.</p>
<h2 id="numbers-that-mislead-and-numbers-that-inform">Numbers that
mislead and numbers that inform</h2>
<p>Patients are asked to reason about risk, and the way numbers are
presented can push their reasoning in either direction.</p>
<p>Take the 2008 pooled analysis. It is often summarized as showing a
thirty percent increase in the risk of death and nearly a threefold
increase in the risk of heart attack. Those are relative risks. A
relative risk is a ratio, and a ratio alone says nothing about how many
people are affected. If the baseline risk of an event is one in a
thousand, tripling it gives three in a thousand: a large relative
increase and a small absolute one. If the baseline is one in ten,
tripling it gives three in ten, which is a catastrophe.</p>
<p>The honest presentation gives both numbers: the relative change and
the absolute counts, in the same population, over the same time.
Statisticians who study risk communication have found that people
understand natural frequencies, such as three out of a thousand, much
better than percentages or probabilities. A sentence like out of every
thousand patients treated, this many more had a heart attack is clearer
than a hazard ratio.</p>
<p>The same care applies to favorable numbers. A company may report that
most patients receiving a carrier survived. Most compared with what? A
group of patients who could not receive blood, treated under expanded
access, will have a survival rate that reflects the severity of their
condition and the selection of who was chosen. Without a comparison
group, survival numbers are not evidence of benefit. They are
descriptions.</p>
<p>I would propose a plain rule: any number about outcomes should be
accompanied by its denominator, its comparison, and its source, in the
same sentence or the next one. If any of the three is unavailable, say
so.</p>
<h2 id="the-vocabulary-problem">The vocabulary problem</h2>
<p>Some words are especially treacherous.</p>
<p>Artificial blood. The product is not blood, and it does not do what
blood does. It carries oxygen, and little else. It does not clot, it
does not fight infection, and it does not last. Blood substitute has the
same problem. Oxygen carrier or oxygen therapeutic is more accurate.</p>
<p>Safe. A word to avoid. Safe compared with what, at what dose, in
whom, and for how long? A product can be reasonably safe for a defined
use and unsafe for another. Say what was observed.</p>
<p>Approved. As described in another post, this needs a regulator, a
country and an indication.</p>
<p>Miracle, breakthrough, revolutionary. Words that belong on a
marketing page, not a fact sheet. They cannot be verified, and they
attract exactly the reader you are trying not to mislead.</p>
<p>Cure. A carrier treats a condition, at best. It does not cure anemia
or a disease of the vessels, and calling it a cure is untrue.</p>
<p>Natural. Bovine hemoglobin comes from an animal. It is purified and
chemically modified. The word invites assumptions about safety that the
science does not support, and it is irrelevant to whether the product
works.</p>
<p>Not a word but a habit: the passive voice that hides who found what.
It has been shown that is weaker than a 2021 randomized trial in the New
England Journal of Medicine found that. The reader deserves to know who
said it.</p>
<h2 id="conflicts-of-interest-said-early">Conflicts of interest, said
early</h2>
<p>An advocacy organization that works with a developer, receives
support from a company or shares goals with one, has an obligation to
say so at the start of every relevant communication, not at the bottom
of a page.</p>
<p>The obligation is not about wrongdoing. Collaboration is normal and
often essential. It is about giving readers what they need to weigh what
they are told. A sentence like this organization is working with the
developer on outreach and has not received payment for its statements,
or has received support, is short and settles a question that would
otherwise linger.</p>
<p>Readers are more forgiving of a disclosed relationship than of a
discovered one. In fields with a history of financial misstatement, as
this one has, credibility is a scarce resource and disclosure is how it
is earned.</p>
<h2 id="writing-for-the-frightened-reader">Writing for the frightened
reader</h2>
<p>Some of your readers will be people in crisis. They need a different
register from an analyst.</p>
<p>Lead with what they can do. If you are describing a route to access,
put the practical steps first: whom to ask, what documents are needed,
what the physician must do. Then give the context.</p>
<p>Be gentle about prognosis. You do not know their case. Avoid
statements that predict, and refer to the treating team for anything
specific.</p>
<p>Avoid pressure. Never suggest that a patient should demand a specific
product. The decision belongs to the patient and the clinician together,
and the person on the other end of the page may have a doctor who knows
things you do not.</p>
<p>Say plainly that the product is not available everywhere, may not be
appropriate, and carries risks. A short paragraph of this kind, placed
high on the page, is not a legal disclaimer. It is respect.</p>
<h2 id="writing-for-the-skeptical-reader">Writing for the skeptical
reader</h2>
<p>Others will be doctors, scientists, reporters and officials who have
seen bright promises fail. They read looking for the overreach.</p>
<p>Give them sources. A claim followed by a reference can be checked. A
claim without one is a tell.</p>
<p>Give them the bad news yourself. Name the 2008 analysis, the trials
that failed, the companies that collapsed. Do it before they do. A page
that acknowledges the record earns the right to be heard on the
rest.</p>
<p>Give them the gaps. State what is not known. An honest description of
the missing evidence is more persuasive to a skeptic than a stack of
encouraging anecdotes.</p>
<p>And leave out the adjectives. A skeptical reader treats adjectives as
noise.</p>
<h2 id="a-model-fact-sheet">A model fact sheet</h2>
<p>To make this concrete, here is the structure I would use for a
one-page fact sheet, described in words so that it can be adapted.</p>
<p>Begin with a single sentence that says what the product is and what
it is not. Follow with a short paragraph on where it stands: which
regulators have acted, in which countries, for what use, and its status
in the country of the reader. Then a paragraph on what the evidence
shows, tier by tier, with sources. A paragraph on the known risks and
unknowns. A paragraph on how a patient might access it, if at all, and
what to ask a clinician. A line of disclosure about the relationship of
the publisher to any developer. And a date, because the facts
change.</p>
<p>Keep it to a page. If it is longer, most readers will not finish it,
and the ones who do not finish it will remember the first paragraph.</p>
<h2 id="one-result-told-three-ways">One result, told three ways</h2>
<p>An example makes the difference tangible. Imagine a small study of a
carrier given to twenty patients who could not receive blood, of whom
fifteen survived to hospital discharge. This is invented for
illustration and does not describe any real study.</p>
<p>The promotional telling: Seventy-five percent of patients survived
thanks to the carrier, a breakthrough for people who cannot receive
blood. Every clause is either unsupported or misleading. Thanks to
implies a cause the study cannot show. Breakthrough is a verdict, not a
finding.</p>
<p>The cautious but empty telling: A small study reported some survivors
and some deaths, and more research is needed. Nothing false, and nothing
a reader can use.</p>
<p>The honest telling: In a series of twenty patients who could not
receive blood and who were given the carrier under expanded access,
fifteen were alive at discharge and five died. The study had no
comparison group, so it cannot show whether the carrier changed the
outcome. Patients differed widely in the cause and severity of their
anemia. The authors reported the following adverse events. The series
suggests the product can be given in this setting; it does not show that
it saves lives.</p>
<p>The third version is longer, and every sentence in it is one a
journalist, a clinician or a regulator can check. It is also the version
that survives a hostile question. Writing it takes discipline, but the
discipline is mechanical: state the number and the denominator, state
what is missing, state what the result does and does not show.</p>
<h2 id="when-you-do-not-know-the-answer">When you do not know the
answer</h2>
<p>Advocates get asked questions they cannot answer. Is it safe for my
father? Will insurance cover it? Should I ask the surgeon for it
tomorrow?</p>
<p>The temptation is to say something reassuring. The better response
has three parts. Say what you do know, briefly. Say what you do not know
and cannot know from where you sit. And say who can help: the treating
physician, the hospital ethics service, the manufacturer’s medical
information line for an expanded access request.</p>
<p>There is nothing shameful in the second part. People who ask hard
questions in hard moments usually know that no one can give them
certainty. What they resent is being handled. A plain statement of the
limits of your knowledge is a form of respect, and it is remembered.</p>
<p>It helps to prepare a short list of the questions you cannot answer
and the referrals for each, and to keep it where every volunteer can see
it. Consistency matters: two volunteers giving different answers to the
same question is worse than either giving a modest one.</p>
<h2 id="the-short-form-problem">The short-form problem</h2>
<p>Social media compresses. A post of two hundred and eighty characters
or a short video cannot hold a three-tier evidence framework. Yet it is
where many readers first meet the topic.</p>
<p>I would suggest a few rules. Do not make a claim in a post that you
would not make in a fact sheet. Link the sentence to the sheet, and say
in the post itself that the link has more detail. Prefer questions to
declarations: What would it take for a cell-free oxygen carrier to be
tested in people who cannot receive blood? invites readers in without
promising anything. Avoid superlatives and avoid the word safe. And
never share a testimonial as evidence. A patient’s story can be told
with compassion, but it should be labeled as a story, not a result.</p>
<p>When a post turns out to be wrong, correct it visibly and quickly. A
short reply that says we got this wrong, here is the correct figure, and
here is the source, costs a little pride and buys a lot of trust.
Deleting quietly costs the trust and saves the pride, and it usually
leaks.</p>
<h2 id="the-correction-habit">The correction habit</h2>
<p>Every organization that communicates about science makes errors. The
measure of quality is not the absence of errors but what happens after.
I recommend a few habits.</p>
<p>Keep a public corrections note. Date each entry, state what was wrong
and what is right.</p>
<p>Date every page. A statement that was accurate a year ago may not be
now, and readers deserve to know how old a claim is.</p>
<p>Assign someone to check citations. A second pair of eyes catches
transposed numbers and misremembered years, the two most common errors
in this kind of writing, and I have made both in the course of preparing
these essays.</p>
<p>Invite outside review. A clinician, a statistician and a patient
reading your draft before it goes out will each catch different
things.</p>
<h2 id="a-word-on-tone">A word on tone</h2>
<p>A last point, not about accuracy. The tone of a page carries
information. Anger reads as certainty; a steady, curious voice reads as
reliability. Patients have good reasons to be angry about the state of
care, and advocacy is often born from that anger. It is a legitimate
fuel. But when the goal is to convince a regulator or a clinician, the
anger is best kept in the motivation and out of the prose.</p>
<p>This does not mean blandness. Vivid, specific writing, a real
patient’s story told with consent, a well-chosen number, a clear picture
of a mechanism, is the opposite of bland. It means that force should
come from precision, not volume.</p>
<h2 id="what-good-communication-buys">What good communication buys</h2>
<p>I have been arguing for restraint, and I should say what restraint
gets you.</p>
<p>It gets credibility, which is the only thing that lets an advocacy
organization be invited into rooms where decisions are made. Regulators,
clinicians and legislators talk to groups that they trust not to
embarrass them.</p>
<p>It gets better participation in trials. Patients who understand what
a trial can and cannot offer enroll with realistic expectations, drop
out less and report more accurately.</p>
<p>It gets protection. When something goes wrong in a field, as in any
field, the organizations that overpromised are the ones that face the
anger. The ones that were honest can say we told you this was uncertain,
and mean it.</p>
<p>And it gets a longer life for the whole enterprise. The history of
oxygen carriers is partly a history of enthusiasm outrunning evidence,
followed by disillusionment and withdrawal of support. A field where
advocates keep their claims small and their sources visible is a field
less likely to boom and bust.</p>
<p>A final practical suggestion is to test your own materials on a
reader who has no stake in the cause. Hand a fact sheet to a friend who
is a nurse, a teacher or a mechanic, ask them to explain it back in
their own words, and listen for the places where their version drifts
from yours. Those are the sentences that need rewriting, and no amount
of expertise substitutes for the discovery.</p>
<h2 id="closing">Closing</h2>
<p>The paradox of advocacy is that the strongest statement is often the
most modest. A sentence that says here is what we know, here is what we
do not, and here is what we are doing to find out is not a weak
sentence. It is the one that can survive contact with a skeptical reader
on a bad day.</p>
<p>Words move patients. They can move them toward a decision they will
regret or toward one they will understand. That responsibility does not
go away because the cause is good. It grows.</p>
<h2 id="further-reading">Further reading</h2>
<p>Guidance on communicating risk with natural frequencies and on
presenting absolute and relative changes together is available from the
risk communication literature, including work by Gerd Gigerenzer and
colleagues. The 2008 pooled analysis of hemoglobin carrier trials was
published in the Journal of the American Medical Association. Readers
preparing public materials should also consult their regulators’
guidance on communications about investigational products, which
restrict claims of safety and effectiveness.</p>

<template id="tpl-16"><p>The history of oxygen carriers is usually told as a sequence of
products: this one failed, that one was withdrawn, another went
bankrupt. That telling is accurate and misses what is most useful about
the past, which is the sequence of ideas. Each generation of researchers
believed it understood why its predecessors had failed. Each was partly
right and partly wrong, and the wrong part turned out to be the one that
mattered. This essay follows the ideas rather than the companies, and it
pays attention to the moments at which a mistaken explanation held a
field in place for a decade.</p>
<p>I will be careful throughout about what the sources establish. The
history here draws on a narrative review of hemoglobin-based oxygen
carriers and on accounts of the Army’s research program, and where dates
or numbers matter I give them as those sources do.</p>
<h2
id="the-first-thought-hemoglobin-is-the-oxygen-so-give-hemoglobin">The
first thought: hemoglobin is the oxygen, so give hemoglobin</h2>
<p>The idea appears early, and it is easy to see why. Hemoglobin is the
molecule that carries oxygen in blood, and red cells are the awkward
package that holds it. If a patient is bleeding and blood is
unavailable, why not extract the hemoglobin and inject it?</p>
<p>The first recorded attempts date to the end of the nineteenth
century. A German physician, von Stark, gave hemoglobin under the skin
to anemic patients in 1898 and could not obtain a stable preparation. In
the years before and during the First World War, researchers refined the
preparations. A pair of American physicians, Sellards and Minot, infused
hemoglobin solutions into thirty-three subjects, in volumes of a few
milliliters up to about thirty. Every recipient passed hemoglobin in the
urine, a visible sign that the kidney was clearing it. Yet thirty
reported no overt harm. It was an encouraging result for the wrong
reason: the doses were tiny, and the kidney’s reaction was mistaken for
tolerance.</p>
<p>The first idea was thus simple and incomplete. It treated hemoglobin
as a fuel and neglected the vessel, the organ and the immune system
through which it would pass.</p>
<h2 id="the-case-that-should-have-taught-more">The case that should have
taught more</h2>
<p>In 1949 a group led by Amberson published one of the most sobering
cases in the whole literature. A woman had suffered a postpartum
hemorrhage, compatible blood could not be found, and the physicians gave
her a stroma-free hemoglobin solution, hemoglobin purified from red
cells with the membrane fragments, the stroma, removed. The review I am
following describes what happened: the patient improved initially, then
developed oliguria, a sharp fall in urine output, and died of renal
failure.</p>
<p>It is a haunting account because it holds both halves of the story.
The hemoglobin worked: it raised her oxygen-carrying capacity while
nothing else was available. It also destroyed her kidneys. The same
observation would be made again, in animals and in people, for the next
fifty years, and the explanation would change three times.</p>
<h2 id="the-second-idea-it-is-the-stroma">The second idea: it is the
stroma</h2>
<p>After the war, researchers noticed that the injury to the kidney
seemed worse when the hemoglobin preparation was crude. The obvious
suspect was the debris from broken red cells. Fragments of membrane are
known to activate clotting and cause damage to small vessels, and a
solution containing them could plausibly injure the kidney.</p>
<p>The idea produced a program of purification. Researchers in the
1960s, including Rabiner, showed in dogs that a well-purified,
stroma-free hemoglobin could serve as an oxygen-carrying replacement in
hemorrhagic shock and could sustain animals through exchange
transfusions. The review describes his results as showing the solution
to be lifesaving in dogs undergoing exchange transfusion. It looked as
though the problem had been identified and solved.</p>
<p>Then came the human data. In the late 1970s, studies by Savitsky and
colleagues gave purified stroma-free hemoglobin to healthy volunteers.
The review is direct about the results: all developed oliguria with
reduced creatinine clearance; two reported abdominal pain; seven
developed a slow heart rate and high blood pressure. The kidney was
affected even though the stroma were gone. The second idea was wrong, or
at least incomplete.</p>
<h2 id="the-third-idea-it-is-the-dimer">The third idea: it is the
dimer</h2>
<p>The next explanation came from chemistry. A hemoglobin molecule
outside a red cell is not stable as a four-chain unit. In dilute
solution it splits into two-chain halves, called dimers, and the dimers
are small enough to pass through the filter of the kidney. Once in the
tubules they can precipitate, and they were held responsible for the
kidney injury.</p>
<p>That explanation led directly to the chemical modifications that
defined the next generation. If the tetramer could be prevented from
splitting, the dimers would never form. Chemists therefore developed
ways to cross-link the four chains together, and to polymerize several
tetramers into larger assemblies. The diaspirin cross-link, which
bridges the two alpha chains, was one of these. Glutaraldehyde
polymerization, used in the bovine products, was another.</p>
<p>The third idea was much closer to the truth, and it produced the
products that reached the clinic. But it too had an incomplete part.
Cross-linking prevented the kidney injury from dimers, and yet the new
products still raised blood pressure. The hypertension would need a
fourth explanation.</p>
<h2 id="the-army-laboratory">The Army laboratory</h2>
<p>At this point in the history a particular institution enters. The
United States Army had a strong interest in a blood substitute that
could be carried to a battlefield, stored without refrigeration, and
given without typing. It supported research at the Letterman Army
Institute of Research and elsewhere, and its scientists helped develop
the diaspirin cross-linked hemoglobin. The review describes that program
as a collaborative effort between the pharmaceutical company Baxter and
the Army, and says that Baxter later continued alone.</p>
<p>A published account from the Letterman program bears a title that
summarizes the state of the field as it stood: a review of modified
hemoglobin research at Letterman, attempts to delineate the toxicity of
cell-free tetrameric hemoglobin. The word delineate is honest. The
researchers were trying to separate the effects of the molecule into
parts, to say what came from the kidney, what from the vessels and what
from contamination. They were doing what a good research program does,
and it is instructive that after so many years they still framed the
task as delineating toxicity.</p>
<h2 id="the-fourth-idea-it-is-the-nitric-oxide">The fourth idea: it is
the nitric oxide</h2>
<p>The explanation for hypertension arrived in the 1990s and was, in
retrospect, elegant. The lining of blood vessels makes nitric oxide, a
gas that relaxes the smooth muscle in the vessel wall and keeps the
vessel open. Free hemoglobin binds nitric oxide with extraordinary
avidity, several orders of magnitude tighter than oxygen binds. When
hemoglobin is loose in plasma, it can slip through gaps in the vessel
lining, capture the nitric oxide near its source, and remove it. Without
the gas, the vessels constrict, the pressure rises and blood flow to
organs falls.</p>
<p>This account explained the hypertension, the reduced flow to some
organs, the abdominal pain from constriction of the gut vessels, and
much else. It also suggested a design principle: make the hemoglobin too
big to leave the vessel lumen, and it will not reach the source of the
gas. The bovine glutamers and the PEGylated products can be read as
attempts to apply that principle.</p>
<p>Yet the fourth idea also turned out to be an incomplete story. Even
large molecules seemed to produce some vasoconstriction, and it became
clear that the gas is present in the lumen and not just in the wall. The
hypothesis remains a leading explanation, and it is discussed elsewhere
in this series. What I want to note here is the pattern: each
generation’s insight was real, and each was mistaken in believing it
complete.</p>
<h2 id="what-the-human-trials-showed">What the human trials showed</h2>
<p>Meanwhile, human trials proceeded, and their results were disturbing.
The review reports the outcome of the trauma trial of the diaspirin
product published in 1999: within twenty-eight days, twenty-four of the
fifty-two patients who received the product had died, forty-six percent,
against eight of forty-six, seventeen percent, who received saline. A
trial of a polymerized human hemoglobin in trauma, published years
later, reported thirty-day mortality of thirteen percent in the treated
group against ten percent in the control group, a difference that did
not reach conventional significance but pointed in an unfavorable
direction. A pooled analysis in 2008, combining sixteen trials, reported
increased risks of death and of heart attack.</p>
<p>These results have been analyzed to exhaustion. I want only to
observe how they interacted with the ideas. Each product had been
designed on the basis of the explanation then current. Each failed for
reasons that the explanation had not anticipated. The pattern suggests
that the theory was always a step behind the biology.</p>
<h2 id="the-fifth-idea-still-forming">The fifth idea, still forming</h2>
<p>The field today holds a set of hypotheses rather than a single
explanation. Nitric oxide scavenging is one. Oxidation of the iron,
which produces free heme and reactive species, is another. The
interaction of free hemoglobin with the endothelium and with platelets,
the effect on the immune system, the role of oxygen affinity in
triggering the arteriolar constriction described elsewhere on this site,
the assay interference that clouds measurement, and the heterogeneity of
the polymer mixtures are all in play.</p>
<p>What distinguishes the present from the past is the tools.
Researchers can now measure nitric oxide directly in tissue, they can
characterize polymer distributions precisely, they can image
microvessels, and they can compare molecules head to head in
standardized animal models. None of these guarantees success, but they
raise the odds that the next explanation will be tested before it is bet
on.</p>
<h2 id="the-lessons-of-the-sequence">The lessons of the sequence</h2>
<p>I draw four lessons from the history, and I offer them as instruction
to anyone entering the field now.</p>
<p>Distrust the complete explanation. Every theory in the sequence was
partial. The moment an explanation is presented as sufficient, it stops
being examined, and the unexplained residue becomes the next
disaster.</p>
<p>Human data corrects animal data. The dog results of the 1960s were
sound and did not predict the human response. Species differ in kidney
handling, in vascular reactivity and in immune response. A compound that
behaves well in animals has passed the first exam, not the last.</p>
<p>Small doses mislead. The early human studies used doses that were too
small to show harm and gave a false comfort. Toxicity that appears at
high doses was not visible at low doses, and the doses that matter
clinically are the high ones.</p>
<p>Institutions matter. The Army’s interest was a driver of the
research, and its willingness to pursue the problem over decades
produced knowledge that a commercial firm alone might not have
generated. It also shows that a strong sponsor is not a guarantee of
success. Both statements are true.</p>
<h2 id="a-note-on-the-war-that-started-it">A note on the war that
started it</h2>
<p>The title of this essay refers to trenches because the impulse behind
the field has always come from war. Sellards and Minot worked in the era
of the First World War, when the question of what to give a soldier who
had lost blood at the front was pressing. The Army’s laboratory programs
of the late twentieth century were driven by the same question. The
current Department of Defense interest in prehospital trials is its
descendant.</p>
<p>That lineage carries a moral. The people who wanted a battlefield
oxygen carrier were not chasing a curiosity. They were trying to keep
young people alive who otherwise would die. A century of failures has
not reduced the strength of that motive, and it explains why the effort
has continued through so many discouraging results. The history should
discourage credulity and should not discourage persistence.</p>
<h2 id="what-the-past-asks-of-the-present">What the past asks of the
present</h2>
<p>If the pattern holds, the next generation of researchers will
discover that today’s explanations were incomplete. The question is how
to be ready for that. I would suggest three practices drawn from the
sequence above.</p>
<p>Design studies that can detect harm early, with adequate sample
sizes, independent monitoring and pre-specified stopping rules.</p>
<p>Keep the mechanisms open. Do not treat any single explanation as the
answer, and measure more than one candidate cause in every study.</p>
<p>Preserve the record. Much of the knowledge in this essay comes from a
handful of review articles, and it is fragile. A patient community that
supports an archive of the field’s history, with the original reports
accessible, protects the next generation from repeating the last
one.</p>
<h2 id="why-the-early-doses-misled">Why the early doses misled</h2>
<p>It is worth pausing on the arithmetic of caution. A few milliliters
of hemoglobin solution is a trivial fraction of what a hemorrhaging
adult needs. The blood volume of an adult is roughly five liters, and a
resuscitation that hopes to replace a meaningful share of lost oxygen
capacity must deliver quantities that are orders of magnitude larger
than the early experiments used. When the dose rises by a factor of a
hundred, effects that were invisible at the low end can become dominant.
The kidney can clear a small load without difficulty and may be
overwhelmed by a large one. A vessel that shrugs off a trace of nitric
oxide scavenging may clamp down when the scavenging is sustained.</p>
<p>This is a general feature of pharmacology, and it is easy to forget
when a field is young and eager. The lesson for readers of the
historical record is to ask, of any early safety claim, what dose it
applied to and what dose the eventual use would require. A finding of no
harm at a tenth of the intended dose is a finding about the tenth.</p>
<h2 id="the-problem-of-names">The problem of names</h2>
<p>A second difficulty in reading this history is terminological. The
same substance has been called stroma-free hemoglobin, cell-free
hemoglobin, modified hemoglobin, hemoglobin solution, blood substitute
and oxygen therapeutic, and the field has argued at length over which
label is honest. A blood substitute implies that the product does
everything blood does, which none of them do. An oxygen carrier implies
a narrower and more accurate claim. In this series the term is BHOC when
the source is bovine and the discussion is of the class, and the older
names are used only where they belong to a particular historical
report.</p>
<p>The naming matters because names shape expectations. Patients,
physicians and regulators who hear substitute expect a replacement and
are disappointed by a bridge. Those who hear carrier expect a limited
tool and judge it accordingly. Much of the disillusionment recorded in
the literature came from expectations set too high by the
vocabulary.</p>
<h2 id="what-the-archives-make-easy-to-miss">What the archives make easy
to miss</h2>
<p>Reading the review literature, one is struck by how much of the
history depends on a few sentences repeated from paper to paper. The
account of the 1949 case is short. The account of the volunteer studies
is shorter still. It is entirely plausible that details have been lost
or simplified in retelling, and a careful reader should treat every
secondhand summary, including the ones in this essay, as an invitation
to consult the original.</p>
<p>There is also a survivorship problem in the record. Programs that
ended quietly, with a few disappointing animal experiments and no
publication, left almost no trace. What we know is weighted toward the
programs that reached humans or generated controversy. The true history
includes many unpublished dead ends, and the reader should assume that
the ideas visible in the literature are only the ones that were pursued
far enough to be written down.</p>
<h2 id="the-patient-inside-the-history">The patient inside the
history</h2>
<p>It is easy, in a narrative of ideas, to forget that each entry in the
record was a person. The woman in 1949 had a baby and a hemorrhage and a
physician who reached for the only thing available. The volunteers in
the 1970s agreed to an experiment and lay in a laboratory while their
urine output fell. The trauma patients in the 1990s were enrolled under
an exception to informed consent, because they were too injured to
agree, and the community consultation that accompanied such trials is a
subject of its own.</p>
<p>Keeping those people in view changes the tone of the analysis. It
becomes harder to speak of a failed generation as if it were a set of
errors on a chart. The investigators were, on the whole, serious people
trying to save lives, and the participants gave something real. The best
way to honor both is to extract from the record everything it can teach,
and to say so plainly.</p>
<h2 id="a-short-chronology-for-orientation">A short chronology, for
orientation</h2>
<p>For readers who want the sequence in one place, here is the outline,
as the sources give it. In 1898 hemoglobin was first tried in anemic
patients. In the era of the First World War, Sellards and Minot infused
small volumes into a group of subjects. In 1949 the postpartum case
ended in renal failure. In the 1960s dogs survived exchange transfusion
with purified hemoglobin. In the late 1970s human volunteers developed
oliguria with the stroma-free preparation. Through the 1980s and 1990s,
chemical modification produced cross-linked and polymerized products,
with Army and industry collaboration. In 1999 the diaspirin trauma trial
reported its mortality difference. In 2008 the pooled analysis appeared.
Bovine products meanwhile reached veterinary use and limited human
approval in two countries. Each of these dates is drawn from the reviews
cited below, and the reader is encouraged to verify them.</p>
<h2 id="further-reading">Further reading</h2>
<p>The history of hemoglobin-based oxygen carriers is reviewed in a
narrative article published in Annals of Blood, on which the dates and
case details above are based. The Army program is described in a report
titled Review of Modified Hemoglobin Research at Letterman, published in
Artificial Cells, Blood Substitutes, and Biotechnology. The 1999 trauma
trial of the diaspirin cross-linked product appeared in the Journal of
the American Medical Association, and the pooled analysis in the same
journal in 2008. Figures quoted are from the review and should be
checked against the original reports.</p>

<template id="tpl-17"><p>Nobody who works on bovine hemoglobin can avoid the question
eventually. A skeptic at a conference, a journalist, a hospital
administrator, or a patient’s relative will ask it plainly: how much
cattle does this take? It sounds like a joke and is not one. The
question contains three separate inquiries, which are technical (how
much hemoglobin is in a cow, and how much of it can be recovered),
economic (what does the raw material cost and who controls it), and
moral (is it right to use an animal this way, and does the answer change
if the use saves human lives). This essay works through the first
honestly, gestures at the second, and treats the third with the
seriousness it deserves.</p>
<p>A warning about method. I am going to build an illustrative
calculation from round numbers. The numbers are assumptions chosen to be
plausible and are labeled as such, and none should be read as a
measurement of any real manufacturing process. The purpose is to teach
the shape of the reasoning, so that a reader can substitute better
numbers and see how the answer moves.</p>
<h2 id="the-basic-bookkeeping">The basic bookkeeping</h2>
<p>Start with the animal. An adult beef animal weighs several hundred
kilograms. Blood makes up a small percentage of body weight, and I will
assume, for illustration, that a full-grown animal carries on the order
of tens of liters of blood. I will also assume that cattle blood
contains hemoglobin at a concentration broadly similar to human blood,
in the neighborhood of a dozen grams per hundred milliliters. Real
values vary with breed, age, health and the way blood is collected, and
a reader with access to a veterinary physiology text should replace
these with better ones.</p>
<p>Not all of that blood can be collected. At slaughter, a substantial
fraction is retained in the carcass and organs, and only part flows out
during bleeding. So the collectable volume per animal is less than the
total, perhaps by a large factor. Then the blood must be processed: red
cells separated from plasma, washed, lysed, the hemoglobin purified from
the debris, cross-linked and polymerized, filtered and formulated. Each
step loses material. A realistic yield, from collected hemoglobin to
finished product, might be well under one hundred percent, and I will
treat it here as an unknown fraction, call it y.</p>
<p>Now the demand side. A product dose is measured in grams of
hemoglobin. The one bovine product with human approval in two countries
has historically been supplied in bags of a couple of hundred
milliliters at a concentration of roughly thirteen grams per deciliter,
which is a few tens of grams per bag, according to the company’s
published descriptions. A patient who needs the product over a course of
treatment may receive one bag or several. A veterinary dose is scaled to
body weight and is typically a fraction of a bag.</p>
<p>Put the pieces together and the shape emerges. If one animal yields,
after all losses, a quantity of finished hemoglobin equal to some number
of bags, and a treatment course uses a few bags, then each animal
supports a handful of treatments. That is the honest order of magnitude:
not one animal per patient, and not a thousand patients per animal, but
somewhere in a range that depends on the yield and the dose, and that a
reader can compute for themselves once the assumptions are fixed.</p>
<h2 id="where-the-number-really-lives">Where the number really
lives</h2>
<p>The calculation above is sensitive to two quantities more than any
others. The first is the collection fraction. If blood is collected
under conditions designed for the purpose, with anticoagulant, clean
handling and controlled temperature, more can be recovered per animal
than in ordinary slaughter, where blood is a byproduct of little value
and is handled accordingly. The second is the process yield, which
depends on the chemistry and on how much of the purified hemoglobin ends
up in the target polymer size range. A process that discards the
undesired fractions wastes more raw material than one that recycles
them.</p>
<p>Both quantities are improvable, and both have been the subject of
engineering effort. A manufacturer that doubles the yield halves the
number of animals per patient. That is why the supply question is not a
fixed feature of the technology. It is a function of process
engineering, and the engineers have every incentive to improve it.</p>
<p>There is a further complication that a reader should keep in mind:
the raw material must meet safety standards that ordinary slaughter
blood does not. Earlier essays in this series discussed the sourcing
regime for cattle, the herd controls and the regulatory limits set in
response to prion disease. Those requirements restrict which animals can
be used and therefore restrict supply independently of the arithmetic of
hemoglobin content. A herd that meets the standard may be small, and a
product that depends on it inherits the size.</p>
<h2 id="a-comparison-that-is-easy-to-get-wrong">A comparison that is
easy to get wrong</h2>
<p>The natural comparison is with blood donation. A donor gives a unit
of whole blood at a session, and a unit of red cells contains a quantity
of hemoglobin that is in the same general range as a few bags of the
oxygen carrier. One might therefore conclude that an animal is a rough
equivalent to a number of donors. That comparison is misleading in two
ways.</p>
<p>First, a donor is renewable. A healthy adult can give again after a
couple of months, and a population of donors supplies a continuous
stream. An animal is used once. The comparison should therefore be
between the donor population’s annual output and the herd’s annual
turnover, not between one donor and one animal.</p>
<p>Second, the product and the donation are not equivalent clinically. A
unit of red cells carries oxygen inside cells that last weeks and
interact with the vasculature in the way nature designed. The carrier is
a temporary bridge with a short circulating life. One does not simply
exchange the units one for one. The relevant question is what the
patient needs during the window in which blood is not available, and
that is usually a much smaller quantity of hemoglobin than a full
replacement.</p>
<h2 id="the-scale-of-the-herd">The scale of the herd</h2>
<p>To get a sense of proportion, consider the scale at which cattle are
raised and slaughtered. Beef production worldwide is measured in many
tens of millions of animals per year. In any single country with a large
beef industry, the annual slaughter runs into the millions. Compared
with those figures, the number of animals that would be needed to supply
an oxygen carrier for a specialized medical market is a very small
fraction, unless the market becomes enormous.</p>
<p>I say this cautiously, because the fraction depends entirely on which
market. A niche supply for trauma patients who cannot receive blood, and
for veterinary practice, is one thing. A general substitute for
transfusion across a health system would be another, and would require a
supply chain on a different scale. The honest position is that the
technology could supply the first from existing beef infrastructure, and
that the second remains speculative until the product’s clinical role is
established. I do not have a defensible number for the second, and I
would distrust anyone who offers one with confidence.</p>
<h2 id="the-byproduct-argument">The byproduct argument</h2>
<p>The strongest ethical argument in favor of bovine sourcing is that
the blood is already there. Cattle are raised and slaughtered for food,
and their blood is largely a waste stream or a low-value input to animal
feed and industrial uses. If it can be converted into a medical product
that saves human lives, the argument goes, no additional animal is
killed on account of the product. The medical use adds value to
something that would otherwise be discarded.</p>
<p>There is force in this. It converts what looks like an extra harm
into a use of an existing one. Someone who accepts the existing practice
of raising cattle for food can reasonably accept the use of the
blood.</p>
<p>The argument is also incomplete. A byproduct that becomes valuable
changes the economics of the primary product. If blood becomes worth a
substantial amount per animal, it slightly raises the value of each
animal and thereby slightly supports the industry that produces it. At
small scale the effect is negligible. At large scale it is not. And the
argument does nothing for a reader who objects to the industry itself.
For that reader the question is whether a life-saving use is sufficient
to justify participation in a practice they reject, and the byproduct
framing does not answer it.</p>
<h2 id="the-objection-from-the-other-side">The objection from the other
side</h2>
<p>Some readers will object from a very different direction, not that
using cattle is wrong, but that it is unnecessary, because human donors
and, eventually, engineered sources could do the job. Recombinant
hemoglobin, produced in bacteria or yeast, avoids the animal entirely.
Hemoglobin from outdated human blood avoids the herd. Hemoglobin from
other sources, such as marine worms, has been proposed.</p>
<p>These alternatives are real, and several are discussed elsewhere in
this series. What can be said here is that each has its own
difficulties. Recombinant production at the scale of grams per patient
is expensive with current methods, and the molecules require engineering
to overcome the same toxicities that plague other cell-free hemoglobins.
Human-derived hemoglobin depends on the donor supply that the technology
is meant to supplement. The bovine molecule has the advantage that it
has been studied for decades, that its oxygen release does not depend on
the cofactor that human hemoglobin needs, and that the raw material is
available at scale. It is not the only possible answer. It is the answer
with the most history.</p>
<h2 id="what-the-animal-cannot-tell-us">What the animal cannot tell
us</h2>
<p>I want to say something about the moral status of the animal that is
neither dismissive nor performatively grieving. Cattle are sentient, and
the conditions in which they are raised and killed vary enormously. A
responsible program would draw its blood from herds raised to high
welfare standards, slaughtered by methods designed to minimize
suffering, and audited by independent inspectors. Those requirements
happen to align with the biosecurity requirements, since healthy,
traceable animals are also the ones that meet the safety standards.</p>
<p>That alignment is fortunate, and it should not be mistaken for the
whole of the ethical case. The deeper question is whether the interests
of an animal can be outweighed by the interests of a person who would
otherwise die. Most moral traditions answer yes in some form, and some
answer no. The reader who says no is not being irrational, and a serious
advocate of the technology should say so, and should respect the
position rather than trying to talk the person out of it.</p>
<h2 id="religious-and-cultural-considerations">Religious and cultural
considerations</h2>
<p>There is a practical dimension of the ethical question that
mainstream discussions rarely mention. Patients differ in their
religious and cultural attitudes to animal-derived products. Some avoid
products derived from particular species, and in a country where cattle
are held sacred, the use of a bovine product in medicine may be
contentious. In others, the objection may concern the manner of
slaughter or the status of the blood itself.</p>
<p>Hospitals that serve diverse populations already deal with these
concerns for other medicines, including gelatin capsules, heparin from
pigs and heart valves from cattle and pigs. The established practice is
disclosure and choice: patients are told the source and can decline. For
a product intended for emergency use, when a patient may be unable to
speak, the difficulty is sharper. The consent essays in this series
discuss it. The relevant point here is that supply arithmetic and
cultural acceptability interact. A product that a significant share of
potential patients would refuse has a smaller effective market than the
herd could supply.</p>
<h2 id="the-supply-chain-as-a-vulnerability">The supply chain as a
vulnerability</h2>
<p>A last practical consideration is fragility. A product that depends
on a specific herd, a specific plant, and a specific regulatory
certification is exposed to shocks. A disease outbreak in the herd, a
contamination event at the plant or a change in the regulation of
cattle-derived material could interrupt supply for months. The history
of the field includes companies whose entire operation rested on a
single facility, and the closure of that facility ended the
business.</p>
<p>A resilient design would diversify: several source herds in different
regions, more than one manufacturing site, and a stockpile sufficient to
bridge a temporary interruption. Each of those adds cost. In a
low-margin market, the temptation is to skip them. The result is a
technology that is theoretically abundant and practically brittle.</p>
<h2 id="a-worked-example-with-the-assumptions-exposed">A worked example,
with the assumptions exposed</h2>
<p>To make the reasoning concrete, let me walk through a hypothetical,
using invented round numbers that a reader can replace. Suppose that the
blood collected from one animal, under controlled conditions, contains
hemoglobin equal to a hundred bags of finished product at the strength
described earlier, before losses. Suppose that the overall yield from
collected hemoglobin to finished, releasable product is one in three.
Then one animal yields about thirty-three bags. If a typical course uses
three bags, one animal supports about eleven courses.</p>
<p>Now vary the assumptions. If collection is half as efficient, the
figure falls to five or six courses. If the yield doubles, it rises to
twenty-odd. If a course uses only one bag, as in some veterinary cases
and perhaps in some human bridge uses, the figure triples. The range
from a handful to several dozen is not a scandal and not a miracle. It
is a plain feature of the numbers.</p>
<p>The reader should keep two things in mind about this example. First,
every input is hypothetical. I have not reported the actual yield of any
manufacturing process, and a published figure from a company would
supersede the assumptions above. Second, the interesting question is not
the central estimate but the sensitivity. Whatever the true numbers are,
the answer is likely to move by a factor of several with plausible
changes in process, and therefore the honest response to the question in
the title is a range with reasons.</p>
<h2 id="what-a-decent-answer-sounds-like">What a decent answer sounds
like</h2>
<p>Suppose the skeptic at the conference asks the question again. A
decent answer would run as follows. Each animal supports a small number
of treatments, the exact number depends on process yield and dose, and I
would rather show you the calculation than quote a figure. The blood
comes from animals raised for food, which changes the moral picture
without erasing it. The supply is adequate for a specialized market and
untested for a general one. And the alternatives, recombinant and
human-derived, are worth pursuing in parallel, because a field that
depends on one source is fragile.</p>
<p>That answer contains no false precision and no evasion. It also
leaves the moral question where it belongs, with the questioner. The
arithmetic can tell you how many animals. It cannot tell you whether a
life is worth them, and pretending otherwise is a way of avoiding the
argument.</p>
<h2 id="the-measure-that-matters">The measure that matters</h2>
<p>There is a final reframing. The title asks how many cows is a life,
and the question could be inverted. How many lives is a cow? If one
animal supports, on the assumptions above, several patients whose
alternative was death because compatible blood was unavailable, the
ratio looks favorable to many people. If the patients would have
survived anyway, or if the product does not reduce mortality, the ratio
is meaningless.</p>
<p>That is why the clinical evidence matters more than the supply
arithmetic. Supply is a constraint on scale, but benefit is what
justifies the effort. A product that saves few lives per animal is still
worth making if the lives are real and the alternative is nothing. A
product that saves none is not worth a single animal. Everything else,
including the yield calculations, is secondary to the question of
whether the carrier works when it is needed. The essays elsewhere on
this site examine that question, and this one has tried to make sure
that the supply question is asked in the right order: after the
evidence, not before it.</p>
<h2 id="questions-worth-putting-to-any-manufacturer">Questions worth
putting to any manufacturer</h2>
<p>A reader evaluating a company’s claims about supply can put a short
list of questions to it. How many animals are in the qualified herd, and
how is that herd audited? What fraction of collected hemoglobin ends up
in releasable product, and what happens to the rest? How many days of
stock does the company hold, and what is the plan if the single plant
goes offline? What is the cost of raw material per finished bag, and how
much of the price is the herd and how much the process? Which
independent body has inspected the welfare and biosecurity arrangements,
and are its reports public?</p>
<p>None of these questions is hostile. A serious manufacturer will have
answers, and the willingness to give them is itself informative. Vague
answers about proprietary processes are a warning that the arithmetic
has not been done, or has been done and is unflattering. In a field with
a long record of promises that outran evidence, transparency about
supply is one of the few things a patient community can reasonably
demand.</p>
<h2 id="further-reading">Further reading</h2>
<p>The manufacturing and sourcing of bovine-derived oxygen carriers is

comparable rules apply elsewhere. Beef production statistics are
